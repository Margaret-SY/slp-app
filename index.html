function doPause(id){
  var k=kidById(id); if(!k) return;
  var reason=(document.getElementById('pauseReason')||{}).value||'';
  var note=(document.getElementById('pauseNote')||{}).value||'';
  k.status='waiting'; k.waitSince=TODAY; k.archivedAt=null;
  k.pauseReason=reason||null; k.pauseNote=note||null;

  k.queueOrder=mx;

}

/* ==================================================================
   预约候诊（轻量预约登记：电话约了、孩子还没来，先只写名字，不建档）
   ================================================================== */
function bookById(bid){ var b=null; BOOKS.forEach(function(x){ if(x.id===bid) b=x; }); return b; }
function bookOn(ds){ return BOOKS.filter(function(b){ return b.date===ds; }); }
function bookStLbl(st){ return ({wait:'候诊·未到',scheduled:'待上课',arrived:'已到诊·建档',no:'爽约未到',cancel:'已取消'})[st]||st; }

function addDays(ds,n){ var d=parseD(ds); d.setDate(d.getDate()+n); return fmtD(d); }
/* 首次到诊后，按固定星期+时间自动生成未来 N 周的预约；遇停诊日顺延一周（最多顺延 24 周） */
function genSeries(kidId, startDs, wk, tStart, tEnd, count){
  for(var i=1;i<=count;i++){
    var ds=addDays(startDs,7*i), guard=0;
    while(CLOSED.some(function(c){ return c.date===ds; }) && guard<24){ ds=addDays(ds,7); guard++; }
    BOOKS.push({
      id:uid(), name:kidName(kidId), date:ds,
      tStart:tStart, tEnd:tEnd, time:(tStart?tStart:'')+(tEnd?('–'+tEnd):''),
      status:'scheduled', kidId:kidId, source:'固定排课', seriesStart:startDs, createdAt:TODAY
    });
  }
}
/* 新建档案时，把"固定上课时间"直接落成未来固定预约（scheduled），同步进考勤日历 */
function genBookingsForSlots(kidId, slots, weeks){
  slots.forEach(function(sl){
    if(!(sl.tStart||sl.tEnd)) return;
    var wk=(+sl.wk)%7;
    var diff=(wk - parseD(TODAY).getDay() + 7)%7;
    var first = diff===0 ? TODAY : addDays(TODAY, diff);
    genSeries(kidId, addDays(first,-7), wk, sl.tStart||'', sl.tEnd||'', weeks);
  });
}
/* 一轮结束 / 转排队时，清除该孩子剩余的未来预约。
   按 kidId 精确匹配——一对二时只删这一个人，绝不波及同场另一个孩子。 */
function endRoundCleanup(kidId){
  var before=BOOKS.length;
  BOOKS = BOOKS.filter(function(b){
    return !(b.kidId===kidId && (b.status==='wait'||b.status==='scheduled') && b.date>TODAY);
  });
  return before-BOOKS.length;
}

function bookRow(b){
  var overdue = (b.status==='wait' && b.date<TODAY);
  var chipCls = b.status==='wait'?'chip t1':(b.status==='scheduled'?'chip st-sched':(b.status==='arrived'?'chip dn':(b.status==='no'?'chip ab':'chip st-archived')));
  var dotC = b.status==='wait'?'#7c3aed':(b.status==='scheduled'?'#0e7490':(b.status==='arrived'?'#16a34a':(b.status==='no'?'#dc2626':'#94a3b8')));
  var h='<div class="bkrow '+b.status+(overdue?' od':'')+'">'+
    '<div class="bk-main">'+
      '<div class="bk-t">'+
        '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+dotC+';flex-shrink:0"></span>'+
        '<b>'+esc(b.name)+'</b>'+
        '<span class="'+chipCls+'">'+bookStLbl(b.status)+'</span>'+
        (b.source==='固定排课'?'<span class="chip st-fixed">固定</span>':'')+
        (overdue?'<span class="chip ab">逾期 '+daysBetween(b.date,TODAY)+' 天</span>':'')+
      '</div>'+
      '<div class="bk-s">'+esc(md(b.date))+(b.time?' '+esc(b.time):'')+' · '+(b.source||'预约')+
        (b.tag?' · '+esc(b.tag):'')+(b.phone?' · '+esc(b.phone):'')+'</div>';
  if(b.note) h+='<div class="bk-s">'+esc(b.note)+'</div>';
  h+='</div><div class="bk-a">';
  if(b.status==='wait'){
    h+='<button class="btn sm pri" onclick="bookArrive(\''+b.id+'\')">已到诊 · 建档</button>'+
       '<button class="btn sm dan" onclick="setBookSt(\''+b.id+'\',\'no\',this)">爽约未到</button>'+
       '<button class="btn sm" onclick="openBookForm(\''+b.id+'\')">改期 / 编辑</button>'+
       '<button class="btn sm" onclick="setBookSt(\''+b.id+'\',\'cancel\',this)">取消</button>'+
       '<button class="btn sm dan" onclick="delBook(\''+b.id+'\',this)">删除</button>';
  }else if(b.status==='scheduled'){
    h+='<button class="btn sm pri" onclick="bookArrive(\''+b.id+'\')">已到诊</button>'+
       '<button class="btn sm dan" onclick="setBookSt(\''+b.id+'\',\'no\',this)">爽约未到</button>'+
       '<button class="btn sm" onclick="openBookForm(\''+b.id+'\')">改期 / 编辑</button>'+
       '<button class="btn sm dan" onclick="delBook(\''+b.id+'\',this)">删除</button>';
  }else if(b.status==='arrived'){
    h+=(b.kidId?'<button class="btn sm" onclick="openKidDetail(\''+b.kidId+'\')">查看档案</button>':'<span class="bk-s">已建档</span>');
  }else{
    h+='<button class="btn sm" onclick="setBookSt(\''+b.id+'\',\'wait\',this)">恢复候诊</button>';
  }
  h+='</div></div>';
  return h;
}

function bookCard(){
  /* 预约候诊框只放「还没到诊」的轻量预约登记（候诊·未到）。
     已到诊孩子的固定排课（待上课 / 已到诊）不再堆在这里——它们已进入下方日历与对应日期框，
     否则一个孩子的十周排课会把框框撑得很长。 */
  var hasFixed = BOOKS.some(function(b){ return b.source==='固定排课' && b.kidId; });
  var list = BOOKS.filter(function(b){ return b.status==='wait'; }).sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return 0;
  });
  var h='<div class="card"><div class="card-h">'+
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+
    '<h3>预约候诊</h3><span class="sp"></span>'+
    (hasFixed?'<button class="btn sm" onclick="openBatchPostpone()">⏩ 整批顺延</button>':'')+
    '<button class="btn sm" onclick="openBookForm(null,\''+CAL.sel+'\')">＋ 新建预约</button>'+
    (list.length?'<span style="font-size:12px;color:var(--muted)">共 '+list.length+' 条</span>':'')+
    '</div><div class="card-b">';
  if(!list.length){
    h+='<div class="mini-note">还没有候诊登记。电话联系了家长、孩子还没来之前，点「＋ 新建预约」只写名字和电话，不必建档；孩子到了再一键转成正式档案。已到诊孩子的固定排课会显示在下方日历和对应日期里。</div>';
  }else{
    h+='<div class="bklist">'+list.map(bookRow).join('')+'</div>';

function saveBook(id){
  var name=(document.getElementById('bkName').value||'').trim();
  if(!name){ toast('请填写预约人 / 孩子姓名','err'); var n=document.getElementById('bkName'); if(n) n.focus(); return; }
  var date=document.getElementById('bkDate').value;
  if(!date){ toast('请选择预约日期','err'); return; }
  var ts=(document.getElementById('bkStart').value||'').trim();
  var te=(document.getElementById('bkEnd').value||'').trim();
  var rec={
    name:name,
    phone:(document.getElementById('bkPhone').value||'').trim(),
    date:date,
    tStart:ts, tEnd:te,
    time:(ts?ts:'')+(te?('–'+te):''),
    tag:(document.getElementById('bkTag').value||'').trim(),
    source:document.getElementById('bkSource').value,
    note:(document.getElementById('bkNote').value||'').trim()
  };
  if(id){
    var b=bookById(id); if(b){ for(var kk in rec) b[kk]=rec[kk]; }
    toast('预约已更新','ok');
  }else{
    rec.id=uid(); rec.status='wait'; rec.kidId=null; rec.createdAt=TODAY;
    BOOKS.push(rec);
    toast('已登记预约：'+name+'（'+md(date)+'）','ok');
  }
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render();
}

function delBook(id, btn){

    BOOKS=BOOKS.filter(function(x){ return x.id!==id; });

}

/* 整批顺延：把某孩子全部未来固定排课整体后移 N 周（自动跳过停诊日）。
   用于「我有一天停诊了」场景——一键把所有固定时间往后推，不影响别的孩子。 */
function openBatchPostpone(){
  var kids={};
  BOOKS.forEach(function(b){ if(b.source==='固定排课' && b.date>TODAY && b.kidId) kids[b.kidId]=kidName(b.kidId); });
  var opts=Object.keys(kids).map(function(id){ return '<option value="'+id+'">'+esc(kids[id])+'</option>'; }).join('');
  if(!opts){ toast('当前没有可整批顺延的固定排课','err'); return; }
  var h='<div class="fg"><label>选择孩子</label><select class="inp" id="bpKid">'+opts+'</select></div>'+
    '<div class="fg"><label>顺延周数</label><input class="inp" type="number" id="bpWk" value="1" min="1" max="12"></div>'+
    '<div class="hint">将该孩子所有「待上课」的固定预约整体向后顺延指定周数；若顺延后落在停诊日，会自动再顺延一周。每节的具体时间段（开始/结束）保持不变。</div>';
  showMo('整批顺延固定排课', h,
    '<button class="btn" onclick="closeMo()">取消</button>'+
    '<button class="btn pri" onclick="doBatchPostpone()">顺延</button>');
}
function batchPostpone(kid, wk){
  var n=0;
  BOOKS.forEach(function(b){
    if(b.kidId===kid && b.source==='固定排课' && b.date>TODAY){
      var ds=addDays(b.date,7*wk), guard=0;
      while(CLOSED.some(function(c){ return c.date===ds; }) && guard<24){ ds=addDays(ds,7); guard++; }
      b.date=ds; n++;
    }
  });
  return n;
}
function doBatchPostpone(){
  var kid=document.getElementById('bpKid').value;
  var wk=parseInt(document.getElementById('bpWk').value,10)||1;
  if(wk<1) wk=1;
  var n=batchPostpone(kid, wk);
  if(!n){ toast('没有需要顺延的预约','err'); return; }
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast('已顺延 '+n+' 条固定预约（'+wk+' 周）','ok');
}

function calMove(d){
  var m=CAL.m+d, y=CAL.y;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  CAL.m=m; CAL.y=y; render();
}
function calToday(){ var n=new Date(); CAL.y=n.getFullYear(); CAL.m=n.getMonth(); CAL.sel=TODAY; render(); }
function calPick(d){ CAL.sel=d; render(); }

function sessionsOn(date){
  var out=[];
  SESSIONS.forEach(function(s){ if(s.date===date) out.push(s); });
  return out;
}

function calendarHTML(){
  var first=new Date(CAL.y,CAL.m,1);
  var startDow=first.getDay();
  var start=new Date(CAL.y,CAL.m,1-startDow);
  var h='<div class="cal">';
  ['日','一','二','三','四','五','六'].forEach(function(w,i){
    h+='<div class="cal-w'+(i===0||i===6?' we':'')+'">'+w+'</div>';
  });
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    var ds=fmtD(d);
    var out = d.getMonth()!==CAL.m;
    var ss=sessionsOn(ds);
    var items=[];
    ss.forEach(function(s){
      s.kidIds.forEach(function(id){
        var e=s.entries[id]||{};
        items.push({n:kidName(id), st:e.status||'pending'});
      });
    });
    bookOn(ds).forEach(function(b){
      if(b.status==='cancel') return;
      /* 只有「候诊·未到」(还没建档的电话预约) 才加「预约·」前缀；
         已到诊 / 待上课 / 爽约 都是已建档或在册的孩子，日历上直接写名字即可。 */
      var _p = b.status==='wait' ? '预约·' : '';
      items.push({ n:_p+b.name, cls:(b.status==='wait'?'bk':(b.status==='scheduled'?'pd':(b.status==='arrived'?'dn':'ab'))) });
    });
    var hasOverdue = (ds<TODAY && items.some(function(x){return x.st==='pending';}))
      || (ds<TODAY && bookOn(ds).some(function(b){ return b.status==='wait'||b.status==='scheduled'; }));
    var isClosed = CLOSED.some(function(c){ return c.date===ds; });
    var cls='cal-d'+(out?' out':'')+(ds===TODAY?' tdy':'')+(ds===CAL.sel?' sel':'')+(isClosed?' closed':'');
    h+='<div class="'+cls+'" onclick="calPick(\''+ds+'\')">'+
      '<div class="cal-n">'+d.getDate()+(hasOverdue?'<span class="odm"></span>':'')+'</div>'+
      items.slice(0,3).map(function(x){
        return '<div class="cchip '+(x.cls||ST_CLS[x.st]||'pd')+'">'+esc(x.n)+'</div>'; }).join('')+
      (items.length>3?'<div class="cmore">+'+(items.length-3)+'</div>':'')+
    '</div>';
    if(i>=34 && d.getMonth()!==CAL.m && (i%7===6)) { /* 提前收尾由固定 42 格处理 */ }
  }
  h+='</div>';
  return h;
}

                '<button class="btn sm dan" onclick="markOne(\''+s.id+'\',\''+id+'\',\'absent\')" style="height:30px;padding:0 10px;font-size:12px">旷课</button>'+
                '<button class="btn sm" onclick="openSession(\''+s.id+'\')" style="height:30px;padding:0 10px;font-size:12px">改期</button>'+

        }).join('')+'</div></div>';
    }).join('');
  }
  h+='</div></div>';
  return h;

function markOne(sid,kid,st){
  var s=null; SESSIONS.forEach(function(x){ if(x.id===sid) s=x; });
  if(!s||!s.entries[kid]) return;
  if(st==='leave'){
    askReason('请假原因（可留空）', function(r){
      s.entries[kid].status='leave';
      s.entries[kid].reason=r||'';
      saveAll(); render(); toast(kidName(kid)+' → 请假','ok');
    });
    return;
  }
  s.entries[kid].status=st;
  saveAll(); render(); toast(kidName(kid)+' → '+ST_LABEL[st],'ok');
}

function statTable(){
  var rows=KIDS.slice().sort(function(a,b){
    var o={active:0,waiting:1,archived:2};
    return (o[a.status]-o[b.status])||a.name.localeCompare(b.name,'zh');
  });
  if(!rows.length) return '<div class="mini-note">暂无数据</div>';
  var tot={used:0,remain:0,leave:0,absent:0,pending:0};
  var body=rows.map(function(k){
    var c=calc(k);
    var lv=statCount(k.id,'leave'), ab=statCount(k.id,'absent'), pd=statCount(k.id,'pending');
    tot.used+=c.used; tot.remain+=Math.max(0,c.remain); tot.leave+=lv; tot.absent+=ab; tot.pending+=pd;
    var stLbl={active:'疗程中',waiting:'待排队',archived:'已归档'}[k.status];

      '<td><b>'+esc(k.name)+'</b><div style="font-size:11.5px;color:var(--muted)">'+esc((k.tags||[]).join('/'))+'</div></td>'+

      '<td class="num">第'+k.courseNo+'期</td>'+
      '<td class="num">'+c.inCourse+' / '+c.per+'</td>'+
      '<td class="num">'+c.used+'</td>'+
      '<td class="num" style="color:'+(c.remain<=0?'#dc2626':(c.remain<=2?'#d97706':'#16a34a'))+'">'+c.remain+'</td>'+
      '<td class="num">'+lv+'</td>'+
      '<td class="num">'+ab+'</td>'+
      '<td class="num">'+pd+'</td>'+
      '<td><button class="btn sm" onclick="openKidDetail(\''+k.id+'\')">详情</button></td>'+
    '</tr>';
  }).join('');
  return '<div class="tw"><table>'+
    '<thead><tr><th>孩子</th><th>状态</th><th>疗程</th><th>本疗程进度</th><th>累计已上</th><th>剩余课时</th><th>请假</th><th>旷课</th><th>待上课</th><th></th></tr></thead>'+
    '<tbody>'+body+
    '<tr style="background:#f8fafc;font-weight:700"><td colspan="4">合计</td>'+
      '<td class="num">'+tot.used+'</td><td class="num">'+tot.remain+'</td>'+
      '<td class="num">'+tot.leave+'</td><td class="num">'+tot.absent+'</td>'+
      '<td class="num">'+tot.pending+'</td><td></td></tr>'+
    '</tbody></table></div>';
}

function toggleTag(btn){
  var t=btn.getAttribute('data-t');
  var i=_tagSel.indexOf(t);
  if(i>=0){ _tagSel.splice(i,1); btn.classList.remove('on'); }
  else{ _tagSel.push(t); btn.classList.add('on'); }
}
function kidTagChips(){
  if(!CFG.customTags) CFG.customTags=[];
  function chip(t, custom){
    var on=_tagSel.indexOf(t)>=0?' on':'';
    var rm = custom ? '<span class="rm" onclick="event.stopPropagation();removeCustomTag(\''+esc(t)+'\',this)" title="从类型库移除">×</span>' : '';
    return '<button type="button" class="'+on+'" data-t="'+esc(t)+'" onclick="toggleTag(this)">'+esc(t)+rm+'</button>';
  }
  return TAGS.map(function(t){ return chip(t,false); }).join('') +
         CFG.customTags.map(function(t){ return chip(t,true); }).join('');
}
function addCustomTag(){
  var el=document.getElementById('kCustomTag');
  var v=(el.value||'').trim();
  if(!v) return;
  if(TAGS.indexOf(v)>=0 || (CFG.customTags||[]).indexOf(v)>=0){ toast('这个类型已经在列表里了'); el.value=''; return; }
  if(!CFG.customTags) CFG.customTags=[];
  CFG.customTags.push(v);
  if(_tagSel.indexOf(v)<0) _tagSel.push(v);
  save(K.cfg, CFG);
  document.getElementById('kTags').innerHTML = kidTagChips();
  el.value='';
  toast('已新增类型「'+v+'」','ok');
}
function removeCustomTag(t, btn){
  armDel('tag:'+t, btn, function(){
    CFG.customTags = (CFG.customTags||[]).filter(function(x){ return x!==t; });
    save(K.cfg, CFG);
    document.getElementById('kTags').innerHTML = kidTagChips();
    toast('已从类型库移除「'+t+'」');
  });
}
function saveKid(id){
  var name=(document.getElementById('kName').value||'').trim();
  if(!name){ toast('姓名不能为空','err'); document.getElementById('kName').focus(); return; }
  var per=parseInt(document.getElementById('kPer').value,10)||CFG.perCourse;
  var k = id?kidById(id):null;
  if(k){
    k.name=name;
    k.gender=document.getElementById('kGender').value;
    k.birth=document.getElementById('kBirth').value;
    k.phone=(document.getElementById('kPhone').value||'').trim();
    k.dNo=(document.getElementById('kDno').value||'').trim();
    k.format=document.getElementById('kFormat').value;
    k.tags=_tagSel.slice();
    k.brief=document.getElementById('kBrief').value;
    k.slots=_slotEdits.filter(function(s){ return (s.tStart||s.tEnd); }).map(function(s){ return {wk:+s.wk, tStart:s.tStart||'', tEnd:s.tEnd||''}; });
    k.createdAt = document.getElementById('kIntake').value || k.createdAt;
    k.perCourse=per;
    var q=parseInt(document.getElementById('kQuota').value,10);
    if(!isNaN(q)) k.quotaTotal=q;
  }else{
    var base=parseInt(document.getElementById('kBase').value,10)||0;
    var _nid=uid();
    var _newSlots=_slotEdits.filter(function(s){ return (s.tStart||s.tEnd); });
    KIDS.push({
      id:_nid, name:name,
      gender:document.getElementById('kGender').value,
      birth:document.getElementById('kBirth').value,
      phone:(document.getElementById('kPhone').value||'').trim(),
      dNo:(document.getElementById('kDno').value||'').trim(),
      format:document.getElementById('kFormat').value,
      tags:_tagSel.slice(),
      brief:document.getElementById('kBrief').value,
      slots:_slotEdits.filter(function(s){ return (s.tStart||s.tEnd); }).map(function(s){ return {wk:+s.wk, tStart:s.tStart||'', tEnd:s.tEnd||''}; }),
      status:'active', courseNo:1, perCourse:per,
      usedBase:base, quotaTotal:base+per, courseStartUsed:base,
      createdAt:(document.getElementById('kIntake').value||TODAY), courseStartAt:TODAY, history:[]
    });
    if(!window.__fromBook && _newSlots.length){
      genBookingsForSlots(_nid, _newSlots, 10);
      var _nk2=kidById(_nid); if(_nk2) _nk2.autoScheduled=true;
    }
    if(window.__fromBook){
      var _bk=bookById(window.__fromBook);
      if(_bk){ _bk.status='arrived'; _bk.kidId=_nid; _bk.arrivedAt=TODAY; }
      window.__fromBook=null;
      if(_bk){
        var _nk=kidById(_nid);
        if(_nk && !_nk.autoScheduled){
          genSeries(_nid, _bk.date, parseD(_bk.date).getDay(), _bk.tStart||'', _bk.tEnd||'', 9); // 含到诊周共 10 节：到诊为第 1 节，再生成 9 节固定排课
          _nk.autoScheduled=true;
        }
      }
    }
  }
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast(id?'已保存':'档案已创建','ok');
}
function delKid(id, btn){
  armDel('kid:'+id, btn, function(){
    var k=kidById(id); if(!k) return;
    var n=SESSIONS.filter(function(s){ return s.kidIds.indexOf(id)>=0; }).length;
    KIDS=KIDS.filter(function(x){ return x.id!==id; });
    PLANS=PLANS.filter(function(p){ return p.kidId!==id; });
    SESSIONS.forEach(function(s){
      s.kidIds=s.kidIds.filter(function(x){ return x!==id; });
      delete s.entries[id];
    });
    SESSIONS=SESSIONS.filter(function(s){ return s.kidIds.length>0; });
    saveAll(); closeMo(); render(); toast('已删除');
  });
}

          (p.status==='active'?'<span class="chip st-active">进行中</span>':'<span class="chip">已存档</span>')+
          '<span class="tl-d">'+esc(p.createdAt)+'</span></div>'+
        '<div class="tl-c">'+esc(p.goal)+'</div></div>';
    }).join('')+'</div>':'<div class="mini-note">还没有阶段计划</div>')+
  '</div>';

  /* 课程记录 */
  b+='<div class="dsec"><h4>课程记录（'+ss.length+' 条）<span class="sp"></span>'+
    '<button class="btn sm" onclick="closeMo();openSession(null,\''+id+'\')">记一节课</button></h4>'+
    (ss.length?'<div class="scroll-y">'+ss.map(function(s){
      var e=s.entries[id]||{};
      return '<div class="hist"><div class="hist-h">'+esc(md(s.date))+' '+esc(wd(s.date))+(s.tStart?(' · '+esc(s.tStart)+(s.tEnd?('–'+esc(s.tEnd)):'')):'')+
        '<span class="chip '+(ST_CLS[e.status]||'')+'">'+(ST_LABEL[e.status]||'—')+'</span>'+
        '<span class="chip t4">'+esc(s.format)+'</span>'+
        (s.kidIds.length>1?'<span class="chip">同伴：'+esc(s.kidIds.filter(function(x){return x!==id;}).map(kidName).join('、'))+'</span>':'')+
        '<span class="sp"></span>'+
        '<button class="btn sm" onclick="closeMo();openSession(\''+s.id+'\')" style="height:28px;padding:0 9px;font-size:12px">查看</button></div>'+
        (e.reason?'<div style="margin-top:4px;color:#b45309">原因：'+esc(e.reason)+'</div>':'')+
        (e.content?'<div style="margin-top:4px;color:#475569">'+esc(e.content)+'</div>':'')+
        (e.perf?'<div style="margin-top:3px;color:#64748b;font-size:12.8px">表现：'+esc(e.perf)+'</div>':'')+
        (s.imgs&&s.imgs.length?'<div class="imgrid" style="margin-top:7px">'+s.imgs.map(function(src,i){ return '<div class="thumb sm"><img src="'+src+'" onclick="previewSessionImgKid(\''+s.id+'\','+i+')" alt="课程图片"></div>'; }).join('')+'</div>':'')+
      '</div>';
    }).join('')+'</div>':'<div class="mini-note">暂无课程记录</div>')+
  '</div>';

  /* 缴费确认（按疗程：一个疗程 N 节 = N 次缴费） */
  var c=calc(k);
  var paid=coursePaid(k);
  var unpaid=unpaidSessions(k);
  var kpays = PAYS.filter(function(p){ return p.kidId===id && (p.courseNo||1)===k.courseNo; })
                   .sort(function(a,b){ return a.date<b.date?1:-1; });
  var pct=Math.min(100,Math.round(paid/c.per*100));
  var full = paid>=c.per;
  b+='<div class="dsec"><h4>缴费确认 <span class="chip '+(full?'dn':'ab')+'">第'+k.courseNo+'疗程 已缴 '+paid+'/'+c.per+'</span><span class="sp"></span>'+
    '<button class="btn sm" onclick="openPayForm(\''+id+'\')">+ 登记缴费</button></h4>'+
    '<div class="reg-row'+(full?' full':'')+'">'+
      '<div class="rr-top"><b>本疗程已确认缴费 '+paid+' / '+c.per+' 次</b>'+
        (full?'<span class="rr-cnt ok">已缴满</span>'
             :'<span class="rr-cnt">还差 '+(c.per-paid)+' 次</span>')+'</div>'+
      '<div class="rr-bar"><i style="width:'+pct+'%'+(full?' class="ok"':'')+'"></i></div>'+
    '</div>'+
    (k.status==='archived'
      ? '<div class="mini-note">已归档 · 本疗程已确认缴费 '+paid+' / '+c.per+' 次</div>'
      : (unpaid.length? '<div class="pay-list"><div class="mini-note" style="margin:4px 0 6px">以下已上课尚未确认缴费：</div>'+unpaid.map(function(s){
          return '<div class="pay-row"><div class="pm"><b>'+esc(md(s.date))+'</b> '+esc(s.format)+' · 待确认缴费</div>'+
            '<button class="btn sm pri" onclick="markPaid(\''+id+'\',\''+s.id+'\')">确认已缴费</button></div>';
        }).join('')+'</div>'
      : (full?'<div class="mini-note">本疗程 '+c.per+' 次缴费已全部确认 ✓</div>'
          :'<div class="mini-note">本疗程暂无可确认的已上课记录</div>'))) +
    (kpays.length? '<div class="pay-list" style="margin-top:10px">'+kpays.map(function(p){
        var rel='第'+(p.courseNo||'?')+'疗程';
        var amt = Number(p.amount)||0;
        // 旧版数据可能带空的 verifyDate（待核对）；新版记录不带该字段
        var legacyPending = (!p.verifyDate);
        return '<div class="pay-row"><div class="pm"><b>'+esc(p.date)+'</b> · '+(p.verifyDate?('核对 '+esc(p.verifyDate)):'未核对')+' · '+esc(rel)+
          (amt?(' · ¥'+amt.toLocaleString('zh-CN')):'')+(p.note?'<small>'+esc(p.note)+'</small>':'')+'</div>'+
          (p.verifyDate?'<span class="chip dn">已核对</span>':'')+
          (legacyPending?'<span class="chip lv">待核对</span><button class="btn sm ok" onclick="markVerified(\''+p.id+'\')">核对</button>':'')+
          '<button class="btn sm dan" onclick="delPay(\''+p.id+'\',this)">删除</button></div>';
      }).join('')+'</div>' : '')+
  '</div>';

  /* 影像 / 纸质资料 */
  var kimgs = k.imgs||[];
  b+='<div class="dsec"><h4>影像 / 纸质资料<span class="sp"></span>'+
    '<label class="btn sm pri" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传图片'+
      '<input type="file" accept="image/*" multiple style="display:none" onchange="uploadKidImg(\''+id+'\',this)"></label></h4>'+
    '<div class="hint" style="margin:2px 0 10px">可上传纸质记录拍照 / 评估单扫描，自动压缩到 800px，每个孩最多 9 张，用于数字化留存与连贯性</div>'+
    (kimgs.length? '<div class="imgrid">'+kimgs.map(function(src,i){
        return '<div class="thumb"><img src="'+src+'" onclick="previewImg(\''+id+'\','+i+')" alt="资料图片">'+
               '<button class="thumb-x" type="button" onclick="delKidImg(\''+id+'\','+i+')">×</button></div>';
      }).join('')+'</div>'
    : '<div class="mini-note">还没有图片，点「上传图片」把纸质记录数字化</div>')+
  '</div>';

  showMo('儿童档案', b,
    '<button class="btn" onclick="closeMo()">关闭</button>'+
    '<button class="btn" onclick="closeMo();openKidReport(\''+id+'\')">导出档案</button>'+
    '<button class="btn" onclick="closeMo();openAssessForm(null,\''+id+'\')">评估</button>'+
    '<button class="btn pri" onclick="closeMo();openSession(null,\''+id+'\')">记一节课</button>', 'wide');
}

/* ==================================================================
   课程日志表单
   ================================================================== */
var _sf = null;  // {id,date,format,kidIds,entries}
function openSession(sid, presetKid, presetDate){
  var s=null; if(sid) SESSIONS.forEach(function(x){ if(x.id===sid) s=x; });
  if(s){
    _sf = { id:s.id, date:s.date, tStart:s.tStart||'', tEnd:s.tEnd||'', format:s.format, kidIds:s.kidIds.slice(),
            entries: JSON.parse(JSON.stringify(s.entries)), imgs:(s.imgs||[]).slice() };
  }else{
    var pk = presetKid?kidById(presetKid):null;
    _sf = { id:null, date: presetDate||TODAY, tStart:'', tEnd:'',
            format: pk?(pk.format||'一对一'):'一对一',
            kidIds: pk?[pk.id]:[], entries:{}, imgs:[] };
    if(pk) _sf.entries[pk.id]=blankEntry();
    if(pk && pk.slots && pk.slots.length){
      var _wd = parseD(_sf.date).getDay();
      var _sl = pk.slots[0];
      pk.slots.forEach(function(x){ if(+x.wk===_wd) _sl=x; });
      _sf.tStart = _sl.tStart||''; _sf.tEnd = _sl.tEnd||'';
    }
  }
  window.__stageKey='';
  _sf.q=''; _sf.showAll=false;
  drawSessionForm();
}
function blankEntry(){ return {status:'done',content:'',perf:'',coop:'',hw:'',reason:'',nextPlan:'',promote:false}; }

function drawSessionForm(){
  var maxN = _sf.format==='一对一'?1:(_sf.format==='一对二'?2:8);

  var b='';
  b+='<div class="frow">'+
    '<div class="fg"><label>上课日期 <span class="req">*</span></label>'+
      '<input class="inp" type="date" id="sfDate" value="'+esc(_sf.date)+'" onchange="_sf.date=this.value"></div>'+
    '<div class="fg"><label>上课形式 <span class="req">*</span></label>'+
      '<div class="segm" id="sfFormat">'+FORMATS.map(function(f){
        return '<button type="button" class="'+(_sf.format===f?'on':'')+'" data-v="'+f+'" onclick="pickFormat(\''+f+'\')">'+f+'</button>'; }).join('')+
      '</div></div></div>';

  b+='<div class="frow">'+
    '<div class="fg"><label>开始时间（约几点）</label>'+
      '<input class="inp" type="time" id="sfTStart" value="'+esc(_sf.tStart||'')+'" onchange="_sf.tStart=this.value"></div>'+
    '<div class="fg"><label>结束时间（到几点）</label>'+
      '<input class="inp" type="time" id="sfTEnd" value="'+esc(_sf.tEnd||'')+'" onchange="_sf.tEnd=this.value"></div>'+
    '</div>';

  b+=kidPickBlock(maxN);

  if(_sf.kidIds.length>1){
    b+='<div style="margin-bottom:12px"><button type="button" class="btn sm" onclick="copyContent()">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'+
      '把第一个孩子的「本节内容」复制到其他人</button></div>';
  }

  if(_sf.kidIds.length){
    var sg=_sf.kidIds.map(function(id){ return suggestBlock(id); }).join('');
    if(sg) b+='<div class="suggest-box"><div class="sg-title">💡 写记录小贴士（按孩子障碍类型 + 当前疗程阶段推荐，可一键套用，也能自己改）</div>'+sg+'</div>';
  }

  b+= _sf.kidIds.map(function(id,idx){ return entryBlock(id,idx); }).join('');
  if(!_sf.kidIds.length) b+='<div class="mini-note">请先在上面选择孩子</div>';

  b+='<div class="fg" style="margin-top:14px"><label>本节课图片（作业单 / 照片，最多 4 张）</label>'+
    '<label class="btn sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:8px">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传图片'+
      '<input type="file" accept="image/*" multiple style="display:none" onchange="uploadSessionImg(this)"></label>'+
    '<div class="imgrid" id="sfImgs">'+
      (_sf.imgs||[]).map(function(src,i){ return '<div class="thumb"><img src="'+src+'" onclick="previewSessionImg('+i+')" alt="课程图片"><button class="thumb-x" type="button" onclick="delSessionImg('+i+')">×</button></div>'; }).join('')+
    '</div></div>';

  showMo(_sf.id?'编辑课程日志':'新建课程日志', b,
    '<button class="btn" onclick="closeMo()">取消</button>'+
    '<button class="btn pri" onclick="saveSession()">保存日志</button>', 'wide');
}

function entryBlock(id,idx){
  var e=_sf.entries[id]||blankEntry();
  var k=kidById(id);
  var curPlan=null;
  PLANS.forEach(function(p){ if(p.kidId===id && p.status==='active') curPlan=p; });
  var isLeave = (e.status==='leave'||e.status==='absent');

  return '<div class="entry">'+
    '<div class="entry-h">'+
      '<span class="ava" style="width:28px;height:28px;border-radius:8px;font-size:12px;background:'+avaColor(k?k.name:'?')+'">'+esc((k?k.name:'?').slice(-1))+'</span>'+
      '<strong>'+esc(kidName(id))+'</strong>'+
      (_sf.kidIds.length>1?'<span class="chip">第 '+(idx+1)+' 位</span>':'')+
      '<span class="sp"></span>'+
      '<div class="stpick">'+['done','pending','leave','absent','closed'].map(function(st){
        return '<button type="button" data-v="'+st+'" class="'+(e.status===st?'on':'')+'" onclick="setEStatus(\''+id+'\',\''+st+'\')">'+ST_LABEL[st]+'</button>'; }).join('')+
      '</div></div>'+
    '<div class="entry-b">'+
      (isLeave
        ? '<div class="fg"><label>'+(e.status==='leave'?'请假原因':'旷课备注')+'</label>'+
          '<input class="inp" value="'+esc(e.reason)+'" oninput="_sf.entries[\''+id+'\'].reason=this.value" placeholder="如：感冒发烧、临时出差、未提前告知">'+
          '<div class="hint">'+(e.status==='leave'?'请假默认不消耗课时':'旷课不消耗课时，如需扣课请在档案里手动调整累计购买课时')+'</div></div>'
        : '<div class="fg"><label>本节课内容'+aiBtnHTML('本节课内容',id)+'</label>'+
            '<textarea class="inp" rows="2" oninput="_sf.entries[\''+id+'\'].content=this.value" placeholder="训练目标、使用教具、活动流程……">'+esc(e.content)+'</textarea></div>'+
          '<div class="fg"><label>孩子表现'+aiBtnHTML('孩子表现',id)+'</label>'+
            '<textarea class="inp" rows="2" oninput="_sf.entries[\''+id+'\'].perf=this.value" placeholder="正确率、注意力时长、情绪状态、需辅助的环节……">'+esc(e.perf)+'</textarea></div>'+
          '<div class="fg"><label>配合程度</label>'+
            '<select class="inp" onchange="_sf.entries[\''+id+'\'].coop=this.value">'+
            '<option value="">— 未评 —</option>'+
            ['优','良','中','差'].map(function(c){ return '<option value="'+c+'"'+(e.coop===c?' selected':'')+'>'+c+'</option>'; }).join('')+
            '</select></div>'+
          '<div class="fg"><label>家庭指导'+aiBtnHTML('家庭作业',id)+'</label>'+
            '<textarea class="inp" rows="2" oninput="_sf.entries[\''+id+'\'].hw=this.value" placeholder="给家长的具体练习任务与频次">'+esc(e.hw)+'</textarea></div>'+
          '<div class="fg"><label>下一步计划'+aiBtnHTML('下一步计划',id)+
            (curPlan?'<span style="font-weight:600;color:var(--faint);font-size:12px">（当前：'+esc(curPlan.stage)+'）</span>':'<span style="font-weight:600;color:var(--faint);font-size:12px">（暂无进行中的计划）</span>')+
            '</label>'+
            '<textarea class="inp" rows="2" oninput="_sf.entries[\''+id+'\'].nextPlan=this.value" placeholder="下节课打算做什么 / 阶段目标是否调整">'+esc(e.nextPlan)+'</textarea>'+
            '<label class="ckline" style="margin-top:9px"><input type="checkbox" '+(e.promote?'checked':'')+
              ' onchange="_sf.entries[\''+id+'\'].promote=this.checked">'+
              '<span>把它存为新的阶段计划'+(curPlan?'，并将「'+esc(curPlan.stage)+'」归档':'')+'</span></label></div>')+
    '</div></div>';
}

/* ============ 便携选孩子：搜索 + 最近上课 + 已选 chip ============ */
function kidPickBlock(maxN){
  var sel=_sf.kidIds.map(function(id){
    var k=kidById(id); if(!k) return '';
    return '<span class="kp-chip">'+esc(k.name)+
      '<button type="button" title="移除" onclick="toggleKid(\''+id+'\')">×</button></span>';
  }).join('');
  var h='<div class="fg"><label>选择孩子 <span class="req">*</span>'+
    '<span class="lb-hint">（'+_sf.format+' 最多 '+maxN+' 人，已选 '+_sf.kidIds.length+'）</span></label>';
  h+='<div class="kp-sel">'+(sel||'<span class="kp-empty">还没选 —— 直接搜名字，或点下面「最近上课」</span>')+'</div>';
  h+='<div class="kp-search">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
      '<input class="inp" id="kpQ" autocomplete="off" placeholder="搜姓名 / 拼音首字母（如 lyx）/ 小D随访号" value="'+esc(_sf.q||'')+'" oninput="_sf.q=this.value; if(kpComp) return; drawKidList()" oncompositionstart="kpComp=true" oncompositionend="kpComp=false; _sf.q=this.value; drawKidList()">'+
      '<button type="button" class="kp-clr" title="清空" onclick="_sf.q=\'\';var e=document.getElementById(\'kpQ\');if(e){e.value=\'\';e.focus();}drawKidList()">×</button>'+
     '</div>';
  h+='<div id="kpList">'+pickerKidListHTML()+'</div></div>';
  return h;
}
function kidMatch(k,q){
  if((k.name||'').toLowerCase().indexOf(q)>=0) return true;
  if((k.dNo||'').toLowerCase().indexOf(q)>=0) return true;
  if((k.phone||'').indexOf(q)>=0) return true;
  if(pyMatch(k.name,q)) return true;
  return false;
}
function kpBtn(k){
  var on=_sf.kidIds.indexOf(k.id)>=0;
  return '<button type="button" class="kpb'+(on?' on':'')+'" onclick="toggleKid(\''+k.id+'\')">'+
    '<b>'+esc(k.name)+'</b><small>'+esc(ST_LABEL[k.status]||'')+(k.dNo?' · '+esc(k.dNo):'')+'</small></button>';
}
function pickerKidListHTML(){
  var q=(_sf.q||'').trim().toLowerCase();
  var all=KIDS.filter(function(k){ return k.status!=='archived' || _sf.kidIds.indexOf(k.id)>=0; });
  if(!KIDS.length) return '<div class="mini-note">还没有建档的孩子，先去「档案」新建</div>';
  var h='';
  if(q){
    var hit=all.filter(function(k){ return kidMatch(k,q); });
    h+='<div class="kp-h">搜索「'+esc(_sf.q)+'」· 命中 '+hit.length+' 人</div>';
    h+= hit.length ? '<div class="kidpick">'+hit.map(kpBtn).join('')+'</div>'
                   : '<div class="mini-note">没找到。换个字试试，或点右边 × 清空看全部</div>';
    return h;
  }
  var last={};
  SESSIONS.forEach(function(s){ (s.kidIds||[]).forEach(function(id){ if(!last[id]||s.date>last[id]) last[id]=s.date; }); });
  var rec=all.filter(function(k){ return last[k.id]; })
             .sort(function(a,b){ return last[a.id]<last[b.id]?1:-1; }).slice(0,8);
  if(rec.length) h+='<div class="kp-h">最近上课</div><div class="kidpick">'+rec.map(kpBtn).join('')+'</div>';
  var showAll=!!_sf.showAll;
  var pool=all.filter(function(k){ return showAll || k.status==='active'; });
  h+='<div class="kp-h">'+(showAll?'全部孩子':'疗程中')+' · '+pool.length+' 人'+
     '<button type="button" class="kp-tg" onclick="_sf.showAll=!_sf.showAll;drawKidList()">'+
     (showAll?'只看疗程中':'显示全部')+'</button></div>';
  h+= pool.length ? '<div class="kidpick">'+pool.map(kpBtn).join('')+'</div>'
                  : '<div class="mini-note">当前没有「疗程中」的孩子，点上面「显示全部」</div>';
  return h;
}
function drawKidList(){ var el=document.getElementById('kpList'); if(el) el.innerHTML=pickerKidListHTML(); }

function pickFormat(f){
  _sf.format=f;
  var maxN = f==='一对一'?1:(f==='一对二'?2:8);
  if(_sf.kidIds.length>maxN){
    _sf.kidIds.slice(maxN).forEach(function(id){ delete _sf.entries[id]; });
    _sf.kidIds=_sf.kidIds.slice(0,maxN);
    toast(f+' 最多 '+maxN+' 人，已保留前 '+maxN+' 位');
  }
  drawSessionForm();
}
function toggleKid(id){
  var i=_sf.kidIds.indexOf(id);
  if(i>=0){ _sf.kidIds.splice(i,1); delete _sf.entries[id]; }
  else{
    var maxN=_sf.format==='一对一'?1:(_sf.format==='一对二'?2:8);
    if(_sf.kidIds.length>=maxN){
      if(maxN===1){ // 一对一直接替换
        var old=_sf.kidIds[0]; delete _sf.entries[old]; _sf.kidIds=[];
      }else{ toast(_sf.format+' 最多选 '+maxN+' 人','err'); drawSessionForm(); return; }
    }
    _sf.kidIds.push(id);
    if(!_sf.entries[id]) _sf.entries[id]=blankEntry();
    defaultTimeFromKid(id);
  }
  drawSessionForm();
}
function setEStatus(id,st){ _sf.entries[id].status=st; drawSessionForm(); }
function defaultTimeFromKid(id){
  if(_sf.tStart||_sf.tEnd) return; /* 已手动填过不覆盖 */
  var k=kidById(id); if(!k||!k.slots||!k.slots.length) return;
  var w=parseD(_sf.date).getDay();
  var sl=k.slots[0]; k.slots.forEach(function(x){ if(+x.wk===w) sl=x; });
  _sf.tStart=sl.tStart||''; _sf.tEnd=sl.tEnd||'';

function pullFeed(){
  try{
    var last=localStorage.getItem('wb_slp_feeddate');
    var hasRss=LEARN.some(function(l){ return l.addedBy==='rss'; });
    // 今天已成功拉过、且本地已有 rss 条目 → 跳过，避免反复请求
    // 关键修复：若本地还没有 rss 条目（如刚重装 PWA 首次拉取失败），必须持续重试，
    // 不能再因「今天已记过日期」就永久跳过，否则热点一整天都不出现。
    if(last===TODAY && hasRss) return;
    // 关键：URL 带 ?ts= 时间戳，让 Service Worker 的 cache-first 永远 miss（URL 不同），
    // 无论 SW 是新是旧都会走真实 network 请求，彻底绕过 SW 缓存的旧响应。
    // 否则 iOS PWA 里旧 SW 缓存的「首次失败/空」响应会一直返回，热点永远不出现。
    fetch('/api/feed?ts=' + Date.now()).then(function(r){
      if(!r || !r.ok) throw new Error('http' + (r ? r.status : '?'));
      return r.json();
    }).then(function(d){
      if(d && d.items && d.items.length){
        d.items.forEach(function(it){
          if(!it.link) return;
          var has=LEARN.some(function(l){ return l.addedBy==='rss' && l.link===it.link; });
          if(!has){
            LEARN.unshift({ id:'rss'+Date.now()+Math.floor(Math.random()*1e4),
              title:it.title, cat:(it.cat||'热点'), tags:[it.kw||'热点'], src:'', body:it.desc||'',
              status:'unread', fav:false, addedBy:'rss', source:it.source||'', link:it.link,
              rssDate:it.date||'', createdAt:TODAY });
          }
        });
        saveAll();
        if(VIEW==='learn') render();
        if(hasRss===false) toast('已拉取 '+d.items.length+' 条热点','ok');
      } else {
        // 接口返回空（非失败）：提示一下，不锁死，下次还能重试
        toast('热点接口暂无可推送内容','warn');
      }
      // 只有真正拿到数据才记今天日期，失败不记 → 下次还能重试
      localStorage.setItem('wb_slp_feeddate', TODAY);
    }).catch(function(err){
      // 拉取失败：不写日期，下次进入/切换仍会重试；已有 rss 也不强制重拉
      // 明确提示，别再静默 0 条让用户以为是「没有」
      toast('热点拉取失败（'+(err&&err.message?err.message:'')+'），点🔄刷新重试','warn');
    });
  }catch(e){ /* 异常也不写日期，留给下次重试 */ }
}

}

function learnList(){
  var q=(LF2.q||'').trim().toLowerCase();
  return LEARN.slice().sort(function(a,b){ return (b.fav?1:0)-(a.fav?1:0) || (a.createdAt<b.createdAt?1:-1); }).filter(function(l){
    if(LF2.cat && l.cat!==LF2.cat) return false;
    if(LF2.status && l.status!==LF2.status) return false;
    if(LF2.rss && l.addedBy!=='rss') return false;
    if(q){
      var hay=(l.title+' '+(l.body||'')+' '+(l.tags||[]).join(' ')).toLowerCase();

/* ==================================================================
   云端同步（Route B）：客户端加密 + 自有免费云空间
   - 数据先用同步密码 AES-GCM 加密，再 PUT 到用户自己的同步服务
   - 同步服务 = 一个极简 Cloudflare Worker（KV 存储，跨设备共享）
   - 云端只存密文；不同密码 = 不同数据（天然隔离）
   ================================================================== */
function saveSync(){ try{ localStorage.setItem(K.sync, JSON.stringify(SYNC)); }catch(e){} }
function setSyStatus(){ var el=document.getElementById('syStatus'); if(el) el.textContent = SYNC.last?('上次：'+SYNC.last):'尚未同步'; }
function collectSlp(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k && k.indexOf('wb_slp_')===0) o[k]=localStorage.getItem(k);
  }
  return o;
}
function reloadFromStorage(){
  KIDS=load(K.kids,[]); SESSIONS=load(K.sessions,[]); PLANS=load(K.plans,[]);
  PAYS=load(K.pays,[]); LIB=load(K.lib,[]); ASSESS=load(K.assess,[]);
  BOOKS=load(K.books,[]); CFG=load(K.cfg,{}); SYNC=load(K.sync,{}); CLOSED=load(K.closed,[]);
  if(CFG.perCourse==null) CFG.perCourse=10;
  if(CFG.waitAlertDays==null) CFG.waitAlertDays=30;
  if(CFG.countLeave==null) CFG.countLeave=false;
  render();
}
function bufToB64(buf){
  var bytes=new Uint8Array(buf), s='';
  for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64ToBuf(b64){
  b64=b64.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  var s=atob(b64), bytes=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
  return bytes.buffer;
}
function syDeriveKey(pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(mat){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:enc.encode('slp-sync-v1'), iterations:100000, hash:'SHA-256'},
      mat, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  });
}
function syEncrypt(text, pass){
  return syDeriveKey(pass).then(function(key){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(text))
      .then(function(ct){ return bufToB64(iv)+'.'+bufToB64(ct); });
  });
}
function syDecrypt(payload, pass){
  var parts=payload.split('.');
  var iv=new Uint8Array(b64ToBuf(parts[0])), ct=b64ToBuf(parts[1]);
  return syDeriveKey(pass).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct)
      .then(function(pt){ return new TextDecoder().decode(pt); });
  });
}
function syCryptoReady(){
  if(!window.crypto || !crypto.subtle){ toast('同步需在 https 打开的网页中使用（部署后的网址）','err'); return false; }
  return true;
}

function fetchWithTimeout(url, opt, ms){
  ms = ms || 12000;
  return new Promise(function(resolve, reject){
    var done = false;
    var t = setTimeout(function(){
      if(done) return;
      done = true;
      reject(new Error('请求超时（'+Math.round(ms/1000)+'秒未响应）'));
    }, ms);
    fetch(url, opt).then(function(r){ if(done) return; done=true; clearTimeout(t); resolve(r); })
                  .catch(function(e){ if(done) return; done=true; clearTimeout(t); reject(e); });
  });
}

    } else {

    }
  }

  toast('同步设置已保存','ok'); setSyStatus();
  if(SYNC.on) setTimeout(syncUpload, 300);
}
function syncUpload(){
  if(!SYNC.on){ toast('请先在上方开启同步并保存','warn'); return; }
  if(!syCryptoReady()) return;
  var type = SYNC.type||'cf';
  if(type==='cf'){
    if(!SYNC.pass){ toast('请先设置同步密码并保存','warn'); return; }
  } else {
    if(!SYNC.gist || !SYNC.pat || !SYNC.pass){ toast('请先填写 Gist ID、访问令牌和同步密码','warn'); return; }
  }
  var btnUp = document.getElementById('syBtnUp');
  var btnDn = document.getElementById('syBtnDn');
  function end(ok, msg){
    if(btnUp){ btnUp.disabled=false; btnUp.textContent=btnUp.dataset.t||'上传同步（本机 → 云）'; }
    if(btnDn){ btnDn.disabled=false; btnDn.dataset.t=btnDn.dataset.t||btnDn.textContent; }
    toast(msg, ok?'ok':'err');
  }
  if(btnUp){ btnUp.disabled=true; btnUp.dataset.t=btnUp.dataset.t||btnUp.textContent; btnUp.textContent='上传中…'; }
  var data=collectSlp();
  syEncrypt(JSON.stringify(data), SYNC.pass).then(function(payload){
    if(type==='cf'){
      return fetchWithTimeout(syKVUrl(), {method:'PUT', headers:{'Content-Type':'text/plain'}, body:payload}, 12000);
    }
    return fetchWithTimeout('https://api.github.com/gists/'+SYNC.gist, {
      method:'PATCH',
      headers:{'Authorization':'token '+SYNC.pat, 'Content-Type':'application/json'},
      body: JSON.stringify({files:{'slp-sync.txt':{content:payload}}})
    }, 18000);
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    SYNC.last='已上传 '+new Date().toLocaleString(); saveSync(); setSyStatus();
    end(true, '已上传到云端');
  }).catch(function(e){ end(false, '上传失败：'+(e&&e.message?e.message:e)); });
}
function syncDownload(){
  if(!SYNC.on){ toast('请先在上方开启同步并保存','warn'); return; }
  if(!syCryptoReady()) return;
  var type = SYNC.type||'cf';
  if(type==='cf'){
    if(!SYNC.pass){ toast('请先设置同步密码','warn'); return; }
  } else {
    if(!SYNC.gist || !SYNC.pat || !SYNC.pass){ toast('请先填写 Gist ID、访问令牌和同步密码','warn'); return; }
  }
  var url, opt;
  if(type==='cf'){ url=syKVUrl(); opt={method:'GET'}; }
  else { url='https://api.github.com/gists/'+SYNC.gist; opt={method:'GET', headers:{'Authorization':'token '+SYNC.pat}}; }
  var btnUp = document.getElementById('syBtnUp');
  var btnDn = document.getElementById('syBtnDn');
  function end(ok, msg){
    if(btnUp){ btnUp.disabled=false; btnUp.textContent=btnUp.dataset.t||'上传同步（本机 → 云）'; }
    if(btnDn){ btnDn.disabled=false; btnDn.textContent=btnDn.dataset.t||'拉取同步（云 → 本机）'; }
    toast(msg, ok?'ok':'err');
  }
  if(btnDn){ btnDn.disabled=true; btnDn.dataset.t=btnDn.dataset.t||btnDn.textContent; btnDn.textContent='拉取中…'; }
  fetchWithTimeout(url, opt, type==='cf'?12000:18000).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(type==='cf') return r.text();
    return r.json().then(function(g){
      var f=g.files && g.files['slp-sync.txt'];
      return f? (f.content||'') : '';
    });
  }).then(function(payload){
    payload = (payload||'').trim();
    if(!payload){ toast('云端还没有数据，请先在另一台上传','warn'); return; }
    if(!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(payload)){
      end(false, '云端返回的不是有效加密数据（请确认打开的是 slp-app-git.pages.dev，且另一台已上传）');
      return;
    }
    return syDecrypt(payload, SYNC.pass).then(function(text){
      var data=JSON.parse(text);
      for(var k in data){ if(data.hasOwnProperty(k)) localStorage.setItem(k, data[k]); }
      reloadFromStorage();
      SYNC.last='已拉取 '+new Date().toLocaleString(); saveSync(); setSyStatus();
      toast('已从云端拉取并合并','ok');
    });
  }).catch(function(e){ end(false, '拉取失败：'+(e&&e.message?e.message:e)); });
}

/* ==================================================================
   图片上传（压缩到 800px）+ 预览 / 删除
   ================================================================== */
function compressImage(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var maxW=800, w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      var ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ cb(cv.toDataURL('image/jpeg',0.8)); }catch(e){ cb(''); }
    };
    img.onerror=function(){ cb(''); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(''); };
  fr.readAsDataURL(file);
}
function uploadKidImg(id, input){
  var k=kidById(id); if(!k) return;
  if(!k.imgs) k.imgs=[];
  var files = input.files ? Array.prototype.slice.call(input.files) : [];
  if(!files.length) return;
  if(k.imgs.length + files.length > 9){
    toast('每个孩子最多 9 张图片，已为您保留前 '+(9-k.imgs.length)+' 张','err',4000);
    files = files.slice(0, Math.max(0, 9-k.imgs.length));
  }
  if(!files.length) return;
  var done=0;
  files.forEach(function(f){
    compressImage(f, function(data){
      if(data) k.imgs.push(data);
      done++;
      if(done===files.length){
        saveAll();
        if(window.__detailId===id) openKidDetail(id); else render();
        toast('已上传，共 '+k.imgs.length+' 张图片','ok');
      }
    });
  });
}

  var k=kidById(id); if(!k||!k.imgs) return;

  if(window.__detailId===id) openKidDetail(id); else render();
}

}
function kpi(v, l){ return '<div class="dstat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function pieSVG(slices, R){
  var total=0; slices.forEach(function(s){ total+=s.val; });
  if(!total) return '';
  var cx=R, cy=R, r=R-6;
  var ang=-Math.PI/2;
  var paths = slices.map(function(s){
    var frac=s.val/total, a2=ang+frac*2*Math.PI;
    var large = frac>0.5?1:0;
    var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    var x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    var d='M'+cx+' '+cy+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z';
    ang=a2;
    return '<path d="'+d+'" fill="'+s.color+'" stroke="#fff" stroke-width="1.6"><title>'+esc(s.label)+' '+s.val+' 人</title></path>';
  }).join('');
  var cText='<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="16" font-weight="800" fill="#334155">'+total+'</text>'+
            '<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="9" fill="#94a3b8">标签合计</text>';
  return '<svg width="'+(R*2)+'" height="'+(R*2)+'" viewBox="0 0 '+(R*2)+' '+(R*2)+'">'+paths+cText+'</svg>';
}
function exportCSVPeriod(){
  var yr=SF.year, mo=SF.month;
  var scopeLabel = (mo==='all') ? (yr+' 年') : (yr+' 年 '+mo+' 月');
  var rows=[['日期','星期','时间','上课形式','孩子','状态','本节课内容','孩子表现','配合程度','家庭指导','请假/旷课原因','下一步计划']];
  SESSIONS.filter(function(s){
    if(!s.date || s.date.slice(0,4)!==String(yr)) return false;
    if(mo!=='all' && s.date.slice(5,7)!==p2(mo)) return false;
    return true;
  }).slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(s){
    s.kidIds.forEach(function(id){
      var e=s.entries[id]||{};
      var tt=(s.tStart||'')+(s.tEnd?('–'+s.tEnd):'');
      rows.push([s.date, wd(s.date), tt, s.format, kidName(id), ST_LABEL[e.status]||'',
                 e.content||'', e.perf||'', e.coop||'', e.hw||'', e.reason||'', e.nextPlan||'']);
    });
  });
  if(rows.length<=1){ toast('该时段没有课程记录','err'); return; }
  var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='课程复盘_'+yr+(mo==='all'?'全年':p2(mo)+'月')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1200);
  toast('已导出 '+scopeLabel+' 复盘表（'+(rows.length-1)+' 行）','ok',3000);
}

var LIB_CATS = ['评估量表','家庭指导单','典型表现照片','文献摘录','其他'];

/* ==================================================================
   评估 · 优劣势 · IEP（玩着测 → 汇总优劣势 → 生成 IEP）
   ================================================================== */
var _af = { id:null, kidId:'', date:'', types:[], scored:{}, notes:{}, iep:null, note:'' };

function assessById(id){ var r=null; for(var i=0;i<ASSESS.length;i++){ if(ASSESS[i].id===id){ r=ASSESS[i]; break; } } return r; }

function assessSummary(af){
  var strengths=[], weak=[], weakDoms={};
  (af.types||[]).forEach(function(t){
    var A=APROBE[t]; if(!A) return;
    A.doms.forEach(function(dm){
      (dm.ps||[]).forEach(function(p){
        var sc=af.scored[p.id];
        if(sc===0) strengths.push({type:t,dom:dm.d,probe:p.t});
        else if(sc===2){ weak.push({type:t,dom:dm.d,probe:p.t,g:p.g,hw:p.hw}); weakDoms[t+'|'+dm.d]=dm; }
      });
    });
  });
  return {strengths:strengths, weak:weak, weakDoms:weakDoms};
}

function buildIEP(af, sum){
  sum = sum || assessSummary(af);
  var longGoals=[], seenLG={}, strategies=[], seenST={};
  for(var key in sum.weakDoms){ var dm=sum.weakDoms[key];
    if(dm.lg && !seenLG[dm.lg]){ seenLG[dm.lg]=1; longGoals.push(dm.lg); }
    (dm.st||[]).forEach(function(s){ if(!seenST[s]){ seenST[s]=1; strategies.push(s); } });
  }
  var shortGoals = sum.weak.map(function(w){ return (w.type?'【'+w.type+'】':'')+w.probe+'：'+w.g; });
  var homework = sum.weak.map(function(w){ return (w.type?'【'+w.type+'】':'')+w.probe+'：'+w.hw; });
  var measure='每节课记录达成率与正确率；每 4 周复盘一次，弱项目标达成率 ≥70% 即升入下一阶段；优势项转入日常泛化，不再单独训练。';
  return {longGoals:longGoals, shortGoals:shortGoals, strategies:strategies.slice(0,8), homework:homework, measure:measure};
}

function formatIEPText(a){
  var sum=assessSummary(a); var iep=a.iep||buildIEP(a,sum);
  var L=['【IEP 个别化教育计划】', (a.kidName||'孩子')+' · '+a.date+' · '+(a.types||[]).join(' / ')];
  L.push('— 优势 —'); (sum.strengths.length?sum.strengths:[]).forEach(function(s){ L.push('· '+s.probe+'（'+s.dom+'）'); });
  L.push('— 待提升 —'); (sum.weak.length?sum.weak:[]).forEach(function(s){ L.push('· '+s.probe+'（'+s.dom+'）'); });
  L.push('— 长期目标 —'); (iep.longGoals||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 短期目标（SMART）—'); (iep.shortGoals||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 教学策略 —'); (iep.strategies||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 家庭作业 —'); (iep.homework||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 评量标准 —'); L.push('· '+(iep.measure||''));
  return L.join('\n');
}

function saveWorksheetAssess(){
  if(!__ws){ toast('工作台状态丢失','err'); return; }
  var kid = kidById(__ws.kidId);
  if(!kid){ toast('请选择评估对象','err'); return; }
  var p = (ASSESS_PROTOCOLS || []).filter(function(x){ return x.key === __ws.key; })[0];
  if(!p){ toast('协议未找到','err'); return; }
  var overallEl = document.getElementById('wsOverall');
  if(overallEl) __ws.overall = overallEl.value || '';
  var L = ['【动态评估 - '+__ws.key+'】'];
  if(p.desc) L.push('核心心法：' + p.desc.slice(0,120));
  (p.flow || []).forEach(function(f, i){
    var sc = __ws.scores[i];
    var scLbl = sc==='0' ? '优势' : (sc==='1' ? '一般' : (sc==='2' ? '弱项' : '未测'));
    L.push('— [' + f.time + '] 评分：' + scLbl + ' —');
    L.push(__ws.notes[i] || '（无记录）');
  });
  if(__ws.overall) L.push('— 整体小结 —\n' + __ws.overall);
  var rec = {
    id: uid(),
    kidId: kid.id,
    kidName: kid.name,
    date: __ws.date,
    types: [__ws.key],
    scored: {},
    notes: {},
    note: L.join('\n'),
    iep: null,
    source: 'worksheet'
  };
  ASSESS.push(rec);
  if(!saveAll()){ toast('保存失败','err'); return; }
  __ws = null;
  closeMo();
  __assessTab = 'rec';
  toast('已保存为评估记录','ok');
  render();
  setTimeout(function(){ openAssessView(rec.id); }, 220);
}

function openAssessForm(id, presetKid){
  var a = id? assessById(id) : null;
  if(a){
    _af = { id:a.id, kidId:a.kidId, date:a.date, types:(a.types||[]).slice(),
            scored:JSON.parse(JSON.stringify(a.scored||{})), notes:JSON.parse(JSON.stringify(a.notes||{})),
            iep: a.iep? JSON.parse(JSON.stringify(a.iep)) : null, note:a.note||'' };
  }else{
    var kid = presetKid? kidById(presetKid) : (KIDS[0]||null);
    var dt = kid? aTypesOf(kid) : [];
    if(!dt.length) dt = Object.keys(APROBE).slice(0,1);
    _af = { id:null, kidId: kid?kid.id:'', date:TODAY, types:dt.slice(), scored:{}, notes:{}, iep:null, note:'' };
  }
  drawAssessForm();
}

  var b='';
  var kidOpts = KIDS.map(function(k){ return '<option value="'+k.id+'"'+(_af.kidId===k.id?' selected':'')+'>'+esc(k.name)+'</option>'; }).join('');

    '<div class="fg"><label>评估对象 <span class="req">*</span></label>'+
      '<select class="inp" id="afKid" onchange="_af.kidId=this.value;_maybeAutoType()">'+
      (KIDS.length?'<option value="">— 选择孩子 —</option>'+kidOpts:'<option value="">还没有建档的孩子</option>')+'</select></div>'+
    '<div class="fg"><label>评估日期</label><input class="inp" type="date" id="afDate" value="'+esc(_af.date)+'" onchange="_af.date=this.value"></div>'+
    '</div>';

  b+= Object.keys(APROBE).map(function(t){
    var on=_af.types.indexOf(t)>=0;
    return '<label class="'+(on?'on':'')+'"><input type="checkbox" '+(on?'checked':'')+' data-at="'+t+'" onchange="toggleAssessType(this)">'+t+'</label>';
  }).join('');

  b+='<div class="fg" style="margin-top:4px"><label>评估整体备注（可选）'+aiBtnHTML('评估备注',_af.kidId)+'</label><textarea class="inp" rows="2" id="afNote" placeholder="第一节课整体印象、亲子关系、特别要注意的点……">'+esc(_af.note||'')+'</textarea></div>';

function _maybeAutoType(){
  var k=kidById(_af.kidId);
  if(k && !_af.types.length){
    _af.types = aTypesOf(k);
    if(!_af.types.length) _af.types=Object.keys(APROBE).slice(0,1);
  }
  drawAssessForm();
}

function toggleAssessType(cb){
  var t=cb.getAttribute('data-at'); var lab=cb.parentNode;
  var i=_af.types.indexOf(t);
  if(cb.checked){ if(i<0)_af.types.push(t); lab.className='on'; }
  else { if(i>=0)_af.types.splice(i,1); lab.className=''; }
  var box=document.getElementById('aProbes'); if(box) box.innerHTML=drawAssessProbes();
  refreshIEPEnabled();
}

function refreshIEPEnabled(){
  var wrap=document.querySelector('.ass-iep');
  if(!wrap) return;
  if(_af.types.length){ wrap.style.opacity='1'; wrap.style.pointerEvents='auto'; }
  else { wrap.style.opacity='.5'; wrap.style.pointerEvents='none'; var r=document.getElementById('aResult'); if(r) r.innerHTML=drawAssessResult(); }
}

function drawAssessProbes(){
  if(!_af.types.length) return '<div class="mini-note">先勾选上面的「关注领域」，下面就会出现对应的玩着测清单。</div>';
  var h='';
  _af.types.forEach(function(t){
    var A=APROBE[t]; if(!A) return;
    h+='<div class="ass-type"><div class="ass-type-t">'+esc(t)+'</div>'+
       '<div class="mini-note" style="margin:6px 0">'+esc(A.tip)+'</div>'+
       '<div class="ass-mat">材料：'+esc(A.mat)+'</div>';
    A.doms.forEach(function(dm){
      h+='<div class="ass-dom"><div class="ass-dom-t">'+esc(dm.d)+'</div>';
      (dm.ps||[]).forEach(function(p){
        var sc=_af.scored[p.id];
        var opts=[{v:undefined,t:'未测'},{v:0,t:'优势'},{v:1,t:'一般'},{v:2,t:'弱项'}];
        var radios = opts.map(function(o){
          var val=(o.v===undefined)?'':String(o.v);
          var on=(sc===o.v);
          var cls= on?(' ar'+o.v):'';
          return '<label class="ar'+cls+'"><input type="radio" name="ar_'+p.id+'" '+(on?'checked':'')+' value="'+val+'" onchange="setScore(\''+p.id+'\',this.value)">'+o.t+'</label>';
        }).join('');
        var note=_af.notes[p.id]||'';
        h+='<div class="ass-probe">'+
           '<div class="ass-probe-t">'+esc(p.t)+'</div>'+
           '<div class="ass-how"><b>怎么玩着测：</b>'+esc(p.how)+'</div>'+
           '<div class="arow">'+radios+'</div>'+
           '<input class="inp ass-note" placeholder="观察备注（可选）" value="'+esc(note)+'" oninput="_af.notes[\''+p.id+'\']=this.value">'+
           '</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  return h;
}

function setScore(pid, val){
  if(val===''){ delete _af.scored[pid]; }
  else { _af.scored[pid]=parseInt(val,10); }
  var box=document.getElementById('aResult'); if(box) box.innerHTML=drawAssessResult();
}

function drawAssessResult(){
  if(!_af.types.length) return '<div class="mini-note">勾选关注领域后即可生成优劣势与 IEP。</div>';
  var sum = assessSummary(_af);
  var iep = _af.iep || buildIEP(_af, sum);
  var h='';
  h+='<div class="ass-sw">'+
     '<div class="ass-col"><div class="ass-col-h ok">优势（'+sum.strengths.length+'）</div>'+
       (sum.strengths.length? sum.strengths.map(function(s){ return '<div class="ass-srow">'+esc(s.probe)+'<span class="faint">'+esc(s.dom)+'</span></div>'; }).join('') : '<div class="mini-note">把对应探针评为「优势」即出现在这里。</div>')+
     '</div>'+
     '<div class="ass-col"><div class="ass-col-h bad">待提升（'+sum.weak.length+'）</div>'+
       (sum.weak.length? sum.weak.map(function(s){ return '<div class="ass-srow">'+esc(s.probe)+'<span class="faint">'+esc(s.dom)+'</span></div>'; }).join('') : '<div class="mini-note">把对应探针评为「弱项」即出现在这里。</div>')+
     '</div></div>';
  h+='<div class="ass-iep-edit">'+
     '<div class="fg"><label>长期目标（每行一条，来自待提升领域的长期目标）'+aiBtnHTML('IEP长期目标',_af.kidId||'')+'</label><textarea class="inp" rows="3" id="iepLG" placeholder="每行一条">'+esc((iep.longGoals||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>短期目标 SMART（来自待提升探针）'+aiBtnHTML('IEP短期目标',_af.kidId||'')+'</label><textarea class="inp" rows="4" id="iepSG" placeholder="每行一条">'+esc((iep.shortGoals||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>教学策略（来自待提升领域）'+aiBtnHTML('IEP教学策略',_af.kidId||'')+'</label><textarea class="inp" rows="3" id="iepST" placeholder="每行一条">'+esc((iep.strategies||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>家庭指导（来自待提升探针）'+aiBtnHTML('IEP家庭作业',_af.kidId||'')+'</label><textarea class="inp" rows="3" id="iepHW" placeholder="每行一条">'+esc((iep.homework||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>评量标准'+aiBtnHTML('IEP评量标准',_af.kidId||'')+'</label><textarea class="inp" rows="2" id="iepMS">'+esc(iep.measure||'')+'</textarea></div>'+
     '</div>';
  return h;
}

function recomputeIEP(){
  var sum=assessSummary(_af);
  _af.iep = buildIEP(_af, sum);
  var box=document.getElementById('aResult'); if(box) box.innerHTML=drawAssessResult();
  toast('已按当前评分重新生成 IEP','ok');
}

function saveAssess(){
  if(!_af.kidId){ toast('请选择评估对象','err'); return; }
  if(!_af.types.length){ toast('至少勾选一个关注领域','err'); return; }
  var noteEl=document.getElementById('afNote');
  var split = function(el){ return (el.value||'').split('\n').map(function(x){return x.trim();}).filter(function(x){return x;}); };
  var iep={ longGoals:split(document.getElementById('iepLG')),
            shortGoals:split(document.getElementById('iepSG')),
            strategies:split(document.getElementById('iepST')),
            homework:split(document.getElementById('iepHW')),
            measure:(document.getElementById('iepMS').value||'').trim() };
  var k=kidById(_af.kidId);
  var rec={ id:_af.id||uid(), kidId:_af.kidId, kidName:k?k.name:_af.kidId, date:_af.date,
            types:_af.types.slice(), scored:JSON.parse(JSON.stringify(_af.scored)), notes:JSON.parse(JSON.stringify(_af.notes)),
            iep:iep, note:noteEl?noteEl.value:'', createdAt:_af.id?(assessById(_af.id).createdAt):TODAY };
  if(_af.id){ for(var i=0;i<ASSESS.length;i++) if(ASSESS[i].id===_af.id) ASSESS[i]=rec; }
  else ASSESS.push(rec);
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast('评估已保存','ok');
}

function iepBlock(title, arr){

function applyIEP(aid){
  var a=assessById(aid); if(!a) return;
  if(!kidById(a.kidId)){ toast('该孩子档案已删除，无法写入计划','err'); return; }
  openSession(null, a.kidId, TODAY);
  if(_sf.kidIds.length){
    _sf.entries[_sf.kidIds[0]].nextPlan = formatIEPText(a);
    drawSessionForm();
    toast('已把 IEP 写入「下一步计划」，可再调整','ok');
  }
}

function copyIEP(aid){
  var a=assessById(aid); if(!a) return;
  var txt=formatIEPText(a);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('IEP 已复制，可粘贴到微信 / 文档','ok'); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('IEP 已复制','ok'); }
  catch(e){ toast('复制失败，请手动选择文本','err'); }
  document.body.removeChild(ta);
}

function delAssess(id, btn){
  armDel('assess:'+id, btn, function(){
    ASSESS=ASSESS.filter(function(a){ return a.id!==id; });
    saveAll(); render(); toast('已删除');
  });
}

  } else {
    h+='<div class="lib-grid">'+list.map(function(x){
      var imgs = x.imgs||[];
      var thumb = imgs.length? ('<div class="imgrid" style="margin-top:8px">'+imgs.map(function(src,i){ return '<div class="thumb sm"><img src="'+src+'" onclick="previewLibImg(\''+x.id+'\','+i+')" alt="资料图片"></div>'; }).join('')+'</div>') : '';
      return '<div class="lib-card">'+

          '<span class="sp"></span>'+

        '<div class="lib-title">'+esc(x.title||'（无标题）')+'</div>'+

    }).join('')+'</div>';

}
function openLibForm(id){
  var x = id? (function(){ var r=null; LIB.forEach(function(l){ if(l.id===id) r=l; }); return r; })() : null;
  window.__libId = id||null;
  var cat = x?x.cat:(window.__libF&&window.__libF.cat)||'评估量表';
  var b='';
  b+='<div class="fg"><label>标题 <span class="req">*</span></label><input class="inp" id="libTitle" value="'+esc(x?x.title:'')+'" placeholder="如「S-S 法筛查记录表」「口部运动家庭指导单」"></div>';
  b+='<div class="frow"><div class="fg"><label>分类</label><select class="inp" id="libCat">'+
     LIB_CATS.map(function(c){ return '<option'+(c===cat?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></div>'+
     '<div class="fg"><label>关联障碍类型（可多选）</label><div class="kidpick" style="margin-top:6px">'+
       TAGS.map(function(t){ var on=(x&&(x.tags||[]).indexOf(t)>=0); return '<label class="'+(on?'on':'')+'"><input type="checkbox" '+(on?'checked':'')+' data-lt="'+t+'" onchange="toggleLibTag(this)">'+t+'</label>'; }).join('')+
     '</div></div></div>';
  b+='<div class="fg"><label>内容 / 摘录</label><textarea class="inp" rows="4" id="libNote" placeholder="记录量表要点、指导单内容、文献摘录……">'+esc(x?x.note:'')+'</textarea></div>';
  b+='<div class="fg"><label>文件位置（PDF / 文档只记名称或路径，不存储文件本身）</label><input class="inp" id="libFile" value="'+esc(x?x.file:'')+'" placeholder="如「桌面/书/语言康复评估量表.pdf 第 30 页」"></div>';
  b+='<div class="fg"><label>图片（评估表照片 / 典型表现，最多 9 张）</label>'+
    '<label class="btn sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:8px">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传图片'+
      '<input type="file" accept="image/*" multiple style="display:none" onchange="uploadLibImg(this)"></label>'+
    '<div class="imgrid" id="libImgs">'+
      ((x&&x.imgs)?x.imgs.map(function(src,i){ return '<div class="thumb"><img src="'+src+'" onclick="previewLibImg(\''+(x.id)+'\','+i+')" alt="资料图片"><button class="thumb-x" type="button" onclick="delLibImg('+i+')">×</button></div>'; }).join(''):'')+
    '</div></div>';
  showMo(id?'编辑资料':'新增资料', b,
    '<button class="btn" onclick="closeMo()">取消</button>'+
    '<button class="btn pri" onclick="saveLib()">保存</button>', 'wide');
}
function toggleLibTag(cb){
  var t=cb.getAttribute('data-lt');
  var lab=cb.parentNode;
  if(cb.checked) lab.className='on'; else lab.className='';
}
function uploadLibImg(input){
  var files = input.files ? Array.prototype.slice.call(input.files) : [];
  if(!files.length) return;
  var box=document.getElementById('libImgs');
  var cur = box? box.querySelectorAll('.thumb').length : 0;
  if(cur + files.length > 9){ toast('每份资料最多 9 张图片，已保留前 '+(9-cur)+' 张','err',4000); files=files.slice(0,Math.max(0,9-cur)); }
  var done=0;
  files.forEach(function(f){
    compressImage(f, function(src){
      var d=document.createElement('div'); d.className='thumb';
      var im=document.createElement('img'); im.src=src; im.alt='资料图片';
      im.onclick=function(){ previewSrc(this.src); };
      var xb=document.createElement('button'); xb.className='thumb-x'; xb.type='button'; xb.textContent='×';
      xb.onclick=function(){ d.parentNode.removeChild(d); };
      d.appendChild(im); d.appendChild(xb);
      box.appendChild(d);
      if(++done===files.length) toast('图片已添加（保存后生效）','ok');
    });
  });
}
function delLibImg(i){
  var box=document.getElementById('libImgs'); if(!box) return;
  var th=box.querySelectorAll('.thumb'); if(th[i]) th[i].remove();
}
function saveLib(){
  var title=(document.getElementById('libTitle').value||'').trim();
  if(!title){ toast('请填写标题','err'); return; }
  var cat=document.getElementById('libCat').value;
  var tags=[]; document.querySelectorAll('#moBox input[data-lt]').forEach(function(cb){ if(cb.checked) tags.push(cb.getAttribute('data-lt')); });
  var note=document.getElementById('libNote').value;
  var file=(document.getElementById('libFile').value||'').trim();
  var imgs=[]; var box=document.getElementById('libImgs');
  if(box) box.querySelectorAll('.thumb img').forEach(function(im){ imgs.push(im.src); });
  if(window.__libId){
    var x=null; LIB.forEach(function(l){ if(l.id===window.__libId) x=l; });
    if(x){ x.title=title; x.cat=cat; x.tags=tags; x.note=note; x.file=file; x.imgs=imgs; }
    toast('资料已更新','ok');
  } else {
    LIB.push({ id:uid(), title:title, cat:cat, tags:tags, note:note, file:file, imgs:imgs, createdAt:TODAY });
    toast('资料已保存','ok');
  }
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render();
}
function delLib(id, btn){
  armDel('lib:'+id, btn, function(){
    LIB = LIB.filter(function(l){ return l.id!==id; });
    saveAll(); render(); toast('已删除');
  });
}
function previewSrc(src){
  showMo('图片预览','<img src="'+src+'" style="max-width:100%;border-radius:8px">','<button class="btn" onclick="closeMo()">关闭</button>','narrow');
}
function previewLibImg(id, i){
  var x=null; LIB.forEach(function(l){ if(l.id===id) x=l; });
  if(!x || !x.imgs || !x.imgs[i]) return;
  showMo('图片预览','<img src="'+x.imgs[i]+'" style="max-width:100%;border-radius:8px">','<button class="btn" onclick="closeMo()">关闭</button>','narrow');
}

/* ==================================================================
   治疗记录报表（医保 / 检查用）— 导出 Word / 打印 PDF
   ================================================================== */
/* ==================================================================
   单个儿童完整档案导出（Word / PDF）
   ================================================================== */
function rptKV(l,v){
  return '<tr><td class="rpt-k">'+esc(l)+'</td><td>'+esc(v)+'</td></tr>';
}

function buildKidReportHTML(kidId){
  var k=kidById(kidId); if(!k) return '<div class="rpt">未找到该儿童档案</div>';
  var c=calc(k);
  var now=new Date();
  var ss=SESSIONS.filter(function(s){ return s.kidIds.indexOf(kidId)>=0; })
                 .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  var ps=PLANS.filter(function(p){ return p.kidId===kidId; })
              .sort(function(a,b){ return a.createdAt<b.createdAt?1:-1; });
  var as=ASSESS.filter(function(a){ return a.kidId===kidId; })
               .sort(function(a,b){ return a.date<b.date?1:-1; });
  var pays=PAYS.filter(function(p){ return p.kidId===kidId; })
               .sort(function(a,b){ return a.date<b.date?1:-1; });

  var head='<div class="rpt">'+
    '<div class="rpt-hd"><h1>儿童言语治疗档案 · '+esc(k.name)+'</h1>'+
    '<div class="rpt-sub">档案号（小D号）：'+esc(k.dNo||'未填写')+
      ' ｜ 生成时间：'+esc(fmtD(now))+' '+esc(wd(fmtD(now)))+
      ' ｜ 治疗师：____________</div></div>';

  /* 一、基本情况 */
  var basic='<h2>一、儿童基本情况</h2><table class="rpt-tb"><tbody>'+
    rptKV('姓名',k.name)+
    rptKV('性别',k.gender||'-')+
    rptKV('出生日期',k.birth||'-')+
    rptKV('年龄',ageOf(k.birth)||'-')+
    rptKV('障碍类型 / 标签',(k.tags||[]).join(' / ')||'-')+
    rptKV('治疗形式',k.format||'-')+
    rptKV('小D随访号',k.dNo||'-')+
    rptKV('建档日期',k.createdAt||'-')+
    rptKV('当前状态',{active:'疗程中',waiting:'待重新排队',archived:'已归档'}[k.status]||'-')+
    rptKV('当前疗程','第 '+k.courseNo+' 疗程（标准 '+c.per+' 节）')+
    rptKV('累计购买 / 已上 / 剩余',((k.quotaTotal||0)+' 节 / '+c.used+' 节 / '+Math.max(0,c.remain)+' 节'))+
    '</tbody></table>';
  if(k.brief) basic+='<div class="rpt-note" style="margin-top:6px">接案摘要：'+esc(k.brief).replace(/\n/g,'<br>')+'</div>';

  /* 二、疗程记录 */
  var course='<h2>二、疗程记录</h2>';
  var cur=(k.status==='active')?
    '<div class="rpt-iep"><div class="rpt-iep-h"><b>第 '+k.courseNo+' 疗程</b> <span class="rpt-dim">进行中 · '+c.inCourse+' / '+c.per+' 节</span></div>'+
    '<div>本疗程进度：'+(c.pct*100).toFixed(0)+'%，剩余 '+Math.max(0,c.remain)+' 节</div></div>':'';
  var hist=(k.history||[]).map(function(x){
    return '<div class="rpt-iep"><div class="rpt-iep-h"><b>第 '+x.no+' 疗程</b> · '+esc(x.result||'')+
      (x.carry?' · '+esc(x.carry):'')+' · <span class="rpt-dim">'+esc(x.endedAt||'')+'</span></div>'+
      '<div>上课 '+x.done+' 节'+(x.target?' / 目标 '+x.target+' 节':'')+(x.note?'<br>'+esc(x.note):'')+'</div></div>';
  }).join('');
  course += (cur||hist) ? (cur+hist) : '<div class="rpt-empty" style="padding:12px">暂无疗程记录</div>';

  /* 三、治疗计划 */
  var plan='<h2>三、治疗计划</h2>';
  plan += ps.length ? ps.map(function(p){
    return '<div class="rpt-iep"><div class="rpt-iep-h"><b>'+esc(p.stage)+'</b> · '+
      (p.status==='active'?'<span class="rpt-dim">进行中</span>':'<span class="rpt-dim">已存档</span>')+
      ' · <span class="rpt-dim">'+esc(p.createdAt)+'</span></div>'+
      '<div class="rpt-iep-b">'+esc(p.goal).replace(/\n/g,'<br>')+'</div></div>';
  }).join('') : '<div class="rpt-empty" style="padding:12px">暂无阶段计划</div>';

  /* 四、课程记录明细（全部） */
  var detail='<h2>四、课程记录明细（共 '+ss.length+' 次）</h2>';
  if(!ss.length){
    detail+='<div class="rpt-empty" style="padding:12px">暂无课程记录</div>';
  }else{
    detail+='<table class="rpt-tb"><thead><tr>'+
      '<th>日期</th><th>时间</th><th>形式</th><th>考勤</th><th>治疗内容</th><th>课堂表现</th><th>配合程度</th><th>家庭指导</th><th>缴费</th></tr></thead><tbody>';
    ss.forEach(function(s){
      var e=s.entries[kidId]||{};
      var pay=PAYS.filter(function(p){ return p.sessionId===s.id && p.kidId===kidId; })[0];
      var payTxt=pay?('已确认'+(pay.verifyDate?(' / 核对 '+pay.verifyDate):'')):'待确认';
      detail+='<tr>'+
        '<td>'+esc(s.date)+'<br><span class="rpt-dim">'+esc(wd(s.date))+'</span></td>'+
        '<td>'+(s.tStart?esc(s.tStart)+(s.tEnd?('–'+esc(s.tEnd)):'')+'':'')+'</td>'+
        '<td>'+esc(s.format)+'</td>'+
        '<td>'+esc(ST_LABEL[e.status]||'—')+'</td>'+
        '<td class="rpt-mult">'+esc(e.content||'')+'</td>'+
        '<td class="rpt-mult">'+esc(e.perf||'')+'</td>'+
        '<td>'+esc(e.coop||'')+'</td>'+
        '<td class="rpt-mult">'+esc(e.hw||'')+'</td>'+
        '<td>'+esc(payTxt)+'</td>'+
      '</tr>';
    });
    detail+='</tbody></table>';
  }

  /* 五、评估与 IEP（全部） */
  var iep='<h2>五、评估与个别化教育计划（IEP）</h2>';
  if(!as.length){
    iep+='<div class="rpt-empty" style="padding:12px">暂无评估 / IEP 记录</div>';
  }else{
    as.forEach(function(a){
      iep+='<div class="rpt-iep"><div class="rpt-iep-h"><b>'+esc(k.name)+'</b> '+
        '<span class="rpt-dim">'+esc(a.date)+' · '+(a.types||[]).join(' / ')+'</span></div>'+
        '<div class="rpt-iep-b">'+esc(formatIEPText(a)).replace(/\n/g,'<br>')+'</div>'+
        (a.note?'<div class="rpt-note">备注：'+esc(a.note)+'</div>':'')+'</div>';
    });
  }

  /* 六、缴费确认 */
  var paid=coursePaid(k);
  var paySec='<h2>六、缴费确认</h2>';
  paySec+='<div class="rpt-iep"><div class="rpt-iep-h"><b>本疗程（第 '+k.courseNo+' 疗程）已确认缴费 '+paid+' / '+c.per+' 次</b></div></div>';
  paySec += pays.length ?
    '<table class="rpt-tb"><thead><tr><th>日期</th><th>方式</th><th>疗程</th><th>金额</th><th>核对</th></tr></thead><tbody>'+
    pays.map(function(p){
      var amt=Number(p.amount)||0;
      return '<tr><td>'+esc(p.date)+'</td><td>'+esc(p.verifyDate||'-')+'</td><td>第'+(p.courseNo||1)+'疗程</td>'+
        '<td class="num">'+(amt?('¥'+amt.toLocaleString('zh-CN')):'-')+'</td>'+
        '<td>'+esc(p.verifyDate?'已核对':'待核对')+'</td></tr>';
    }).join('')+'</tbody></table>'
    : '<div class="rpt-empty" style="padding:12px">暂无缴费登记</div>';

  /* 七、影像 / 纸质资料 */
  var kimgs=k.imgs||[];
  var imgSec='<h2>七、影像 / 纸质资料（'+kimgs.length+' 张）</h2>';
  if(!kimgs.length){
    imgSec+='<div class="rpt-empty" style="padding:12px">暂无上传图片</div>';
  }else{
    imgSec+='<div class="rpt-imgrid">'+kimgs.map(function(src){
      return '<img class="rpt-img" src="'+src+'">';
    }).join('')+'</div>';
  }

  /* 八、签字确认 */
  var sign='<h2>八、签字确认</h2><div class="rpt-sign">'+
    '<div>治疗师签字：____________________ 日期：__________</div>'+
    '<div>家长确认签字：____________________ 日期：__________</div>'+
    '<div class="rpt-ft">本档案由「言语治疗工作台」生成，数据存于本机浏览器，仅供内部核对与医保检查留档使用。</div></div>';

  return head+basic+course+plan+detail+iep+paySec+imgSec+sign+'</div>';
}

function openKidReport(kidId){
  var k=kidById(kidId); if(!k){ toast('未找到该儿童档案','err'); return; }
  var html=buildKidReportHTML(kidId);
  window.__krHTML=html; window.__krId=kidId; window.__krName=k.name;
  showMo('儿童档案导出 · '+esc(k.name), '<div class="rpt-scroll">'+html+'</div>',
    '<button class="btn" onclick="closeMo()">关闭</button>'+
    '<button class="btn" onclick="printKidReport()">打印 / 存为 PDF</button>'+
    '<button class="btn pri" onclick="downloadKidWord()">导出 Word</button>', 'lg');

function downloadKidWord(){
  var html=window.__krHTML;
  if(!html){ toast('请先生成档案','err'); return; }
  var head='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>儿童档案</title>'+
    '<style>body{font-family:"Microsoft YaHei",sans-serif}table{border-collapse:collapse}td,th{border:1px solid #cbd5e1;padding:5px 7px;font-size:12px}.rpt-k{background:#f8fafc;font-weight:600;color:#475569;white-space:nowrap;width:34%}.rpt-mult{white-space:pre-wrap}.rpt-img{max-width:160px;max-height:160px;border:1px solid #cbd5e1;border-radius:6px;margin:4px}</style></head><body>';
  var blob=new Blob([head+html+'</body></html>'],{type:'application/msword'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='儿童档案_'+(window.__krName||'')+'_'+TODAY+'.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1200);

function openReportPreview(){

function confirmImport(btn){

function importApply(d, mode){
  if(mode==='replace'){
    KIDS=d.kids||[]; SESSIONS=d.sessions||[]; PLANS=d.plans||[]; PAYS=d.pays||[]; LIB=d.lib||[]; ASSESS=d.assess||[]; BOOKS=d.books||[]; LEARN=d.learn||[]; RESEARCH=d.research||[];
    if(d.cfg) CFG=d.cfg;
  }else{
    var mk={}; KIDS.forEach(function(k,i){ mk[k.id]=i; });
    (d.kids||[]).forEach(function(k){ if(mk[k.id]!=null) KIDS[mk[k.id]]=k; else KIDS.push(k); });
    var ms={}; SESSIONS.forEach(function(s,i){ ms[s.id]=i; });
    (d.sessions||[]).forEach(function(s){ if(ms[s.id]!=null) SESSIONS[ms[s.id]]=s; else SESSIONS.push(s); });
    var mp={}; PLANS.forEach(function(p,i){ mp[p.id]=i; });
    (d.plans||[]).forEach(function(p){ if(mp[p.id]!=null) PLANS[mp[p.id]]=p; else PLANS.push(p); });
    var mpy={}; PAYS.forEach(function(p,i){ mpy[p.id]=i; });
    (d.pays||[]).forEach(function(p){ if(mpy[p.id]!=null) PAYS[mpy[p.id]]=p; else PAYS.push(p); });
    var ml={}; LIB.forEach(function(l,i){ ml[l.id]=i; });
    (d.lib||[]).forEach(function(l){ if(ml[l.id]!=null) LIB[ml[l.id]]=l; else LIB.push(l); });
    var ma={}; ASSESS.forEach(function(a,i){ ma[a.id]=i; });
    (d.assess||[]).forEach(function(a){ if(ma[a.id]!=null) ASSESS[ma[a.id]]=a; else ASSESS.push(a); });
    var mb={}; BOOKS.forEach(function(b,i){ mb[b.id]=i; });
    (d.books||[]).forEach(function(b){ if(mb[b.id]!=null) BOOKS[mb[b.id]]=b; else BOOKS.push(b); });
    var ml2={}; LEARN.forEach(function(l,i){ ml2[l.id]=i; });
    (d.learn||[]).forEach(function(l){ if(ml2[l.id]!=null) LEARN[ml2[l.id]]=l; else LEARN.push(l); });
    var mr={}; RESEARCH.forEach(function(rr,i){ mr[rr.id]=i; });
    (d.research||[]).forEach(function(rr){ if(mr[rr.id]!=null) RESEARCH[mr[rr.id]]=rr; else RESEARCH.push(rr); });
  }
  if(!saveAll || !save(K.kids,KIDS)){ }
  saveAll();
  localStorage.setItem(K.seeded,'1');
  window.__imp=null;
  closeMo(); render();
  toast('导入完成：'+KIDS.length+' 份档案 / '+SESSIONS.length+' 条记录','ok',3600);
}

function clearDemo(btn){
  var demoK=['k1','k2','k3','k4','k5'];
  var has = KIDS.some(function(k){ return demoK.indexOf(k.id)>=0; })
    || LEARN.some(function(l){ return l.addedBy==='seed'; })
    || BOOKS.some(function(b){ return demoK.indexOf(b.kidId)>=0; })
    || REMINDERS.some(function(r){ return r.addedBy==='seed'; })
    || PAYS.some(function(p){ return demoK.indexOf(p.kidId)>=0; })
    || ASSESS.some(function(a){ return demoK.indexOf(a.kidId)>=0; });
  if(!has){ toast('没有检测到示例数据'); return; }
  armDel('clearDemo', btn, function(){
    KIDS=KIDS.filter(function(k){ return demoK.indexOf(k.id)<0; });
    PLANS=PLANS.filter(function(p){ return demoK.indexOf(p.kidId)<0; });
    SESSIONS.forEach(function(s){
      s.kidIds=s.kidIds.filter(function(id){ return demoK.indexOf(id)<0; });
      demoK.forEach(function(id){ delete s.entries[id]; });
    });
    SESSIONS=SESSIONS.filter(function(s){ return s.kidIds.length>0; });
    BOOKS=BOOKS.filter(function(b){ return demoK.indexOf(b.kidId)<0; });
    PAYS=PAYS.filter(function(p){ return demoK.indexOf(p.kidId)<0; });
    ASSESS=ASSESS.filter(function(a){ return demoK.indexOf(a.kidId)<0; });
    LEARN=LEARN.filter(function(l){ return l.addedBy!=='seed'; });
    REMINDERS=REMINDERS.filter(function(r){ return r.addedBy!=='seed'; });
    saveAll(); closeMo(); render(); toast('示例数据已清空','ok');
  }, '确认清空示例?');
}
