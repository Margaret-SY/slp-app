function toggleTag(btn){
  var t=btn.getAttribute('data-t');
  var i=_tagSel.indexOf(t);
  if(i>=0){ _tagSel.splice(i,1); btn.classList.remove('on'); }
  else{ _tagSel.push(t); btn.classList.add('on'); }
}
function kidTagChips(){
  if(!CFG.customTags) CFG.customTags=[];
  function chip(t, custom){
    var on=_tagSel.indexOf(t)>=0?' on':'';
    var rm = custom ? '<span class="rm" onclick="event.stopPropagation();removeCustomTag(\''+esc(t)+'\')" title="从类型库移除">×</span>' : '';
    return '<button type="button" class="'+on+'" data-t="'+esc(t)+'" onclick="toggleTag(this)">'+esc(t)+rm+'</button>';
  }
  return TAGS.map(function(t){ return chip(t,false); }).join('') +
         CFG.customTags.map(function(t){ return chip(t,true); }).join('');
}
function addCustomTag(){
  var el=document.getElementById('kCustomTag');
  var v=(el.value||'').trim();
  if(!v) return;
  if(TAGS.indexOf(v)>=0 || (CFG.customTags||[]).indexOf(v)>=0){ toast('这个类型已经在列表里了'); el.value=''; return; }
  if(!CFG.customTags) CFG.customTags=[];
  CFG.customTags.push(v);
  if(_tagSel.indexOf(v)<0) _tagSel.push(v);
  save(K.cfg, CFG);
  document.getElementById('kTags').innerHTML = kidTagChips();
  el.value='';
  toast('已新增类型「'+v+'」','ok');
}
function removeCustomTag(t){
  if(!confirm('把「'+t+'」从类型库移除？\n已使用该类型的孩子档案里仍会保留此标签，仅不再作为可选项出现。')) return;
  CFG.customTags = (CFG.customTags||[]).filter(function(x){ return x!==t; });
  save(K.cfg, CFG);
  document.getElementById('kTags').innerHTML = kidTagChips();
  toast('已从类型库移除「'+t+'」');
}
function saveKid(id){
  var name=(document.getElementById('kName').value||'').trim();
  if(!name){ toast('姓名不能为空','err'); document.getElementById('kName').focus(); return; }
  var per=parseInt(document.getElementById('kPer').value,10)||CFG.perCourse;
  var k = id?kidById(id):null;
  if(k){
    k.name=name;
    k.gender=document.getElementById('kGender').value;
    k.birth=document.getElementById('kBirth').value;
    k.phone=(document.getElementById('kPhone').value||'').trim();
    k.dNo=(document.getElementById('kDno').value||'').trim();
    k.format=document.getElementById('kFormat').value;
    k.tags=_tagSel.slice();
    k.brief=document.getElementById('kBrief').value;
    k.createdAt = document.getElementById('kIntake').value || k.createdAt;
    k.perCourse=per;
    var q=parseInt(document.getElementById('kQuota').value,10);
    if(!isNaN(q)) k.quotaTotal=q;
  }else{
    var base=parseInt(document.getElementById('kBase').value,10)||0;
    var _nid=uid();
    KIDS.push({
      id:_nid, name:name,
      gender:document.getElementById('kGender').value,
      birth:document.getElementById('kBirth').value,
      phone:(document.getElementById('kPhone').value||'').trim(),
      dNo:(document.getElementById('kDno').value||'').trim(),
      format:document.getElementById('kFormat').value,
      tags:_tagSel.slice(),
      brief:document.getElementById('kBrief').value,
      status:'active', courseNo:1, perCourse:per,
      usedBase:base, quotaTotal:base+per, courseStartUsed:base,
      createdAt:(document.getElementById('kIntake').value||TODAY), courseStartAt:TODAY, history:[]
    });
    if(window.__fromBook){
      var _bk=bookById(window.__fromBook);
      if(_bk){ _bk.status='arrived'; _bk.kidId=_nid; _bk.arrivedAt=TODAY; }
      window.__fromBook=null;
    }
  }
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast(id?'已保存':'档案已创建','ok');
}
function delKid(id){
  var k=kidById(id); if(!k) return;
  var n=SESSIONS.filter(function(s){ return s.kidIds.indexOf(id)>=0; }).length;
  if(!confirm('确定要彻底删除「'+k.name+'」的档案吗？\n\n关联的 '+n+' 条课程记录中该孩子的部分也会一并移除，此操作不可撤销。\n\n如果只是治疗结束了，建议用「归档」而不是删除。')) return;
  KIDS=KIDS.filter(function(x){ return x.id!==id; });
  PLANS=PLANS.filter(function(p){ return p.kidId!==id; });
  SESSIONS.forEach(function(s){
    s.kidIds=s.kidIds.filter(function(x){ return x!==id; });
    delete s.entries[id];
  });
  SESSIONS=SESSIONS.filter(function(s){ return s.kidIds.length>0; });
  saveAll(); closeMo(); render(); toast('已删除');
}

var _sf = null;  // {id,date,format,kidIds,entries}
function openSession(sid, presetKid, presetDate){
  var s=null; if(sid) SESSIONS.forEach(function(x){ if(x.id===sid) s=x; });
  if(s){
    _sf = { id:s.id, date:s.date, format:s.format, kidIds:s.kidIds.slice(),
            entries: JSON.parse(JSON.stringify(s.entries)), imgs:(s.imgs||[]).slice() };
  }else{
    var pk = presetKid?kidById(presetKid):null;
    _sf = { id:null, date: presetDate||TODAY,
            format: pk?(pk.format||'一对一'):'一对一',
            kidIds: pk?[pk.id]:[], entries:{}, imgs:[] };
    if(pk) _sf.entries[pk.id]=blankEntry();
  }
  window.__stageKey='';
  _sf.q=''; _sf.showAll=false;
  drawSessionForm();
}

function kidMatch(k,q){

  if((k.phone||'').indexOf(q)>=0) return true;

}
function kpBtn(k){
  var on=_sf.kidIds.indexOf(k.id)>=0;

function pickerKidListHTML(){
  var q=(_sf.q||'').trim().toLowerCase();
  var all=KIDS.filter(function(k){ return k.status!=='archived' || _sf.kidIds.indexOf(k.id)>=0; });
  if(!KIDS.length) return '<div class="mini-note">还没有建档的孩子，先去「档案」新建</div>';
  var h='';
  if(q){
    var hit=all.filter(function(k){ return kidMatch(k,q); });
    h+='<div class="kp-h">搜索「'+esc(_sf.q)+'」· 命中 '+hit.length+' 人</div>';
    h+= hit.length ? '<div class="kidpick">'+hit.map(kpBtn).join('')+'</div>'
                   : '<div class="mini-note">没找到。换个字试试，或点右边 × 清空看全部</div>';
    return h;
  }
  var last={};
  SESSIONS.forEach(function(s){ (s.kidIds||[]).forEach(function(id){ if(!last[id]||s.date>last[id]) last[id]=s.date; }); });
  var rec=all.filter(function(k){ return last[k.id]; })
             .sort(function(a,b){ return last[a.id]<last[b.id]?1:-1; }).slice(0,8);
  if(rec.length) h+='<div class="kp-h">最近上课</div><div class="kidpick">'+rec.map(kpBtn).join('')+'</div>';

  h+='<div class="kp-h">'+(showAll?'全部孩子':'疗程中')+' · '+pool.length+' 人'+
     '<button type="button" class="kp-tg" onclick="_sf.showAll=!_sf.showAll;drawKidList()">'+
     (showAll?'只看疗程中':'显示全部')+'</button></div>';

                  : '<div class="mini-note">当前没有「疗程中」的孩子，点上面「显示全部」</div>';
  return h;
}

function pickFormat(f){
  _sf.format=f;
  var maxN = f==='一对一'?1:(f==='一对二'?2:8);
  if(_sf.kidIds.length>maxN){
    _sf.kidIds.slice(maxN).forEach(function(id){ delete _sf.entries[id]; });
    _sf.kidIds=_sf.kidIds.slice(0,maxN);
    toast(f+' 最多 '+maxN+' 人，已保留前 '+maxN+' 位');
  }
  drawSessionForm();
}
function toggleKid(id){
  var i=_sf.kidIds.indexOf(id);
  if(i>=0){ _sf.kidIds.splice(i,1); delete _sf.entries[id]; }
  else{
    var maxN=_sf.format==='一对一'?1:(_sf.format==='一对二'?2:8);
    if(_sf.kidIds.length>=maxN){
      if(maxN===1){ // 一对一直接替换
        var old=_sf.kidIds[0]; delete _sf.entries[old]; _sf.kidIds=[];
      }else{ toast(_sf.format+' 最多选 '+maxN+' 人','err'); drawSessionForm(); return; }
    }
    _sf.kidIds.push(id);
    if(!_sf.entries[id]) _sf.entries[id]=blankEntry();
  }
  drawSessionForm();
}
function setEStatus(id,st){ _sf.entries[id].status=st; drawSessionForm(); }
function copyContent(){
  if(_sf.kidIds.length<2) return;
  var src=_sf.entries[_sf.kidIds[0]].content||'';
  _sf.kidIds.slice(1).forEach(function(id){ _sf.entries[id].content=src; });
  drawSessionForm(); toast('已复制到其他孩子');
}
function saveSession(){
  if(!_sf.kidIds.length){ toast('请至少选择一个孩子','err'); return; }
  if(!_sf.date){ toast('请选择上课日期','err'); return; }

  var rec = { id:_sf.id||uid(), date:_sf.date, format:_sf.format,
              kidIds:_sf.kidIds.slice(), entries:{}, imgs:(_sf.imgs||[]).slice(), createdAt:_sf.id?undefined:TODAY };
  _sf.kidIds.forEach(function(id){
    var e=_sf.entries[id];
    rec.entries[id]={ status:e.status, content:e.content||'', perf:e.perf||'',
                      hw:e.hw||'', reason:e.reason||'', nextPlan:e.nextPlan||'' };
    /* 升级为阶段计划 */
    if(e.promote && (e.nextPlan||'').trim()){
      PLANS.forEach(function(p){
        if(p.kidId===id && p.status==='active'){ p.status='archived'; p.archivedAt=_sf.date; }
      });
      var kk=kidById(id);
      var n=PLANS.filter(function(p){ return p.kidId===id; }).length+1;
      PLANS.push({ id:uid(), kidId:id, stage:'阶段'+n+'：'+ (e.nextPlan.trim().slice(0,14)),
                   goal:e.nextPlan.trim(), createdAt:_sf.date, status:'active' });
    }
  });

  if(_sf.id){
    for(var i=0;i<SESSIONS.length;i++) if(SESSIONS[i].id===_sf.id){
      rec.createdAt=SESSIONS[i].createdAt; SESSIONS[i]=rec;
    }
  }else SESSIONS.push(rec);

  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast('日志已保存','ok');
}

    '</div><div class="hint">同一个孩子设为「进行中」时，会自动把该孩子其他计划转为存档</div></div>';

  showMo(p?'编辑阶段计划':'新增阶段计划', b,

    '<button class="btn pri" onclick="savePlan('+(p?"'"+p.id+"'":'null')+')">保存</button>', 'narrow');
}
function savePlan(pid){
  var kid=document.getElementById('plKid').value;
  var stage=(document.getElementById('plStage').value||'').trim();
  if(!stage){ toast('请填写阶段名称','err'); return; }
  var goal=document.getElementById('plGoal').value;
  var st=segVal('plStatus')||'active';
  var p=null; PLANS.forEach(function(x){ if(x.id===pid) p=x; });
  if(st==='active'){
    PLANS.forEach(function(x){
      if(x.kidId===(p?p.kidId:kid) && x.status==='active' && x.id!==pid){ x.status='archived'; x.archivedAt=TODAY; }
    });
  }
  if(p){ p.stage=stage; p.goal=goal; p.status=st; if(st==='archived'&&!p.archivedAt) p.archivedAt=TODAY; if(st==='active') p.archivedAt=null; }
  else PLANS.push({ id:uid(), kidId:kid, stage:stage, goal:goal, createdAt:TODAY, status:st });
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast('计划已保存','ok');
}
function delPlan(pid){
  if(!confirm('确定删除这个阶段计划吗？此操作不可撤销。')) return;
  PLANS=PLANS.filter(function(p){ return p.id!==pid; });
  saveAll(); closeMo(); render(); toast('已删除');
}

var LF2 = { q:'', cat:'', status:'', rss:false };
var LEARN_CATS = ['科普','新技能','文献','视频','论文'];

function openSide(){ var s=document.getElementById('side'); if(s) s.classList.add('open'); var b=document.getElementById('sideBg'); if(b) b.classList.add('open'); }
function closeSide(){ var s=document.getElementById('side'); if(s) s.classList.remove('open'); var b=document.getElementById('sideBg'); if(b) b.classList.remove('open'); }
function _ancHasClass(el, cls){ while(el && el!==document){ if(el.classList && el.classList.contains(cls)) return true; el=el.parentNode; } return false; }
document.addEventListener('click', function(e){
  var s=document.getElementById('side');

});
function pullFeed(){
  try{
    var last=localStorage.getItem('wb_slp_feeddate');
    if(last===TODAY) return;
    fetch('/api/feed').then(function(r){ return r.json(); }).then(function(d){
      if(d && d.items && d.items.length){
        d.items.forEach(function(it){
          if(!it.link) return;
          var has=LEARN.some(function(l){ return l.addedBy==='rss' && l.link===it.link; });
          if(!has){
            LEARN.unshift({ id:'rss'+Date.now()+Math.floor(Math.random()*1e4),
              title:it.title, cat:'热点', tags:[it.kw||'热点'], src:'', body:it.desc||'',
              status:'unread', fav:false, addedBy:'rss', source:it.source||'', link:it.link,
              rssDate:it.date||'', createdAt:TODAY });
          }
        });
        saveAll();
        if(VIEW==='learn') render();
      }
      localStorage.setItem('wb_slp_feeddate', TODAY);
    }).catch(function(){ localStorage.setItem('wb_slp_feeddate', TODAY); });
  }catch(e){ try{ localStorage.setItem('wb_slp_feeddate', TODAY); }catch(e2){} }
}
function viewLearn(){
  var list = learnList();
  var total = LEARN.length;
  var unreadN = LEARN.filter(function(l){return l.status!=='done';}).length;
  var doneN = LEARN.filter(function(l){return l.status==='done';}).length;
  var favN = LEARN.filter(function(l){return l.fav;}).length;
  var html = '';
  html += '<div class="card"><div class="card-b">';
  html += '<div class="flexb"><h3 style="margin:0;font-size:16px">学习库</h3>'+
          '<button class="btn pri sm" onclick="openLearnForm(null)">+ 新建学习条目</button></div>';
  html += '<div class="learn-stats">共 '+total+' 篇 · 未读/在读 '+unreadN+' · 已读 '+doneN+' · 收藏 '+favN+'</div>';
  html += '<div class="filters">'+
    '<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'+
    '<input id="lQ" value="'+esc(LF2.q)+'" placeholder="搜索标题/正文/标签" oninput="LF2.q=this.value;learnRender()"></div>'+
    '<select class="fsel" onchange="LF2.cat=this.value;learnRender()">'+
      '<option value="">全部分类</option>'+LEARN_CATS.map(function(c){return '<option'+(LF2.cat===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'+
    '<select class="fsel" onchange="LF2.status=this.value;learnRender()">'+
      '<option value="">全部状态</option>'+Object.keys(LEARN_ST).map(function(k){return '<option value="'+k+'"'+(LF2.status===k?' selected':'')+'>'+LEARN_ST[k]+'</option>';}).join('')+'</select>'+
    '<button class="fbtn'+(LF2.rss?' on':'')+'" onclick="LF2.rss=!LF2.rss;render()">只看热点</button>'+
    '</div>';
  html += '<div id="learnList">'+learnCards(list)+'</div>';
  html += '</div></div>';
  return html;
}
function learnList(){
  var q=(LF2.q||'').trim().toLowerCase();
  return LEARN.slice().sort(function(a,b){ return (b.fav?1:0)-(a.fav?1:0) || (a.createdAt<b.createdAt?1:-1); }).filter(function(l){
    if(LF2.cat && l.cat!==LF2.cat) return false;
    if(LF2.status && l.status!==LF2.status) return false;
    if(LF2.rss && l.addedBy!=='rss') return false;
    if(q){
      var hay=(l.title+' '+(l.body||'')+' '+(l.tags||[]).join(' ')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function learnCards(list){
  if(!list.length) return '<div class="empty"><p>没有匹配的学习条目</p><small>点上方"新建学习条目"添加，或从首页「本周学习推荐」进入</small></div>';
  return list.map(function(l){
    var tags=(l.tags||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('');
    var body=(l.body||'').replace(/\n/g,'<br>');
    var stCls = l.status==='done'?'dn':(l.status==='reading'?'lv':'pd');
    var srcBtn = '';
    if(l.addedBy==='rss' && l.link){ srcBtn = '<a class="btn sm pri" href="'+esc(l.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">打开原文</a>'; }
    else if(l.src){ srcBtn = '<a class="btn sm" href="'+esc(l.src)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看原文</a>'; }
    var nextSt = l.status==='done'?'unread':(l.status==='reading'?'done':'reading');
    var nextLbl = l.status==='done'?'标未读':(l.status==='reading'?'标已读':'标在读');
    return '<div class="ln-card'+(l.status==='done'?' ln-done':'')+(l.addedBy==='rss'?' ln-rss':'')+'">'+
      '<div class="ln-top">'+
        '<span class="chip t4">'+esc(l.cat||'其他')+'</span>'+tags+
        '<span class="sp"></span>'+
        '<button class="ln-fav'+(l.fav?' on':'')+'" onclick="toggleFav(\''+l.id+'\')" title="收藏">'+(l.fav?'★':'☆')+'</button>'+
      '</div>'+
      '<div class="ln-title">'+esc(l.title)+'</div>'+
      '<div class="ln-body">'+body+'</div>'+
      (l.addedBy==='rss' ? '<div class="ln-meta">来源：'+(l.source||'网络')+(l.rssDate?' · '+l.rssDate:'')+'</div>' : '')+
      '<div class="ln-foot">'+
        '<span class="chip '+stCls+'">'+LEARN_ST[l.status||'unread']+'</span>'+
        srcBtn+
        '<button class="btn sm" onclick="markLearn(\''+l.id+'\',\''+nextSt+'\')">'+nextLbl+'</button>'+
        (l.addedBy==='rss' ? '' : '<button class="btn sm" onclick="openLearnForm(\''+l.id+'\')">编辑</button>')+
        '<button class="btn sm dan" onclick="delLearn(\''+l.id+'\')">删除</button>'+
      '</div>'+
    '</div>';
  }).join('');
}
function learnRender(){ var el=document.getElementById('learnList'); if(el) el.innerHTML=learnCards(learnList()); }
function toggleFav(id){ for(var i=0;i<LEARN.length;i++){ if(LEARN[i].id===id){ LEARN[i].fav=!LEARN[i].fav; break; } } saveAll(); render(); }

function saveLearn(id){
  var title=document.getElementById('lnTitle').value.trim();
  if(!title){ toast('请填写标题','err'); return; }
  var cat=document.getElementById('lnCat').value;
  var tags=document.getElementById('lnTags').value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});

/* ==================================================================
   云端同步（Route B）：客户端加密 + 自有免费云空间
   - 数据先用同步密码 AES-GCM 加密，再 PUT 到用户自己的同步服务
   - 同步服务 = 一个极简 Cloudflare Worker（KV 存储，跨设备共享）
   - 云端只存密文；不同密码 = 不同数据（天然隔离）
   ================================================================== */
function saveSync(){ try{ localStorage.setItem(K.sync, JSON.stringify(SYNC)); }catch(e){} }
function setSyStatus(){ var el=document.getElementById('syStatus'); if(el) el.textContent = SYNC.last?('上次：'+SYNC.last):'尚未同步'; }
function collectSlp(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k && k.indexOf('wb_slp_')===0) o[k]=localStorage.getItem(k);
  }
  return o;
}
function reloadFromStorage(){
  KIDS=load(K.kids,[]); SESSIONS=load(K.sessions,[]); PLANS=load(K.plans,[]);
  PAYS=load(K.pays,[]); LIB=load(K.lib,[]); ASSESS=load(K.assess,[]);
  BOOKS=load(K.books,[]); CFG=load(K.cfg,{}); SYNC=load(K.sync,{});
  if(CFG.perCourse==null) CFG.perCourse=10;
  if(CFG.waitAlertDays==null) CFG.waitAlertDays=30;
  if(CFG.countLeave==null) CFG.countLeave=false;
  render();
}
function bufToB64(buf){
  var bytes=new Uint8Array(buf), s='';
  for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64ToBuf(b64){
  b64=b64.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  var s=atob(b64), bytes=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
  return bytes.buffer;
}
function syDeriveKey(pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(mat){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:enc.encode('slp-sync-v1'), iterations:100000, hash:'SHA-256'},
      mat, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  });
}
function syEncrypt(text, pass){
  return syDeriveKey(pass).then(function(key){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(text))
      .then(function(ct){ return bufToB64(iv)+'.'+bufToB64(ct); });
  });
}
function syDecrypt(payload, pass){
  var parts=payload.split('.');
  var iv=new Uint8Array(b64ToBuf(parts[0])), ct=b64ToBuf(parts[1]);
  return syDeriveKey(pass).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct)
      .then(function(pt){ return new TextDecoder().decode(pt); });
  });
}
function syCryptoReady(){
  if(!window.crypto || !crypto.subtle){ toast('同步需在 https 打开的网页中使用（部署后的网址）','err'); return false; }
  return true;
}

function fetchWithTimeout(url, opt, ms){
  ms = ms || 12000;
  return new Promise(function(resolve, reject){
    var done = false;
    var t = setTimeout(function(){
      if(done) return;
      done = true;
      reject(new Error('请求超时（'+Math.round(ms/1000)+'秒未响应）'));
    }, ms);
    fetch(url, opt).then(function(r){ if(done) return; done=true; clearTimeout(t); resolve(r); })
                  .catch(function(e){ if(done) return; done=true; clearTimeout(t); reject(e); });
  });
}

function syKVUrl(){

function syncSaveCfg(){

    if(SYNC.type==='cf'){
      if(SYNC.pass.length<8){ toast('开启同步需设 8 位以上同步密码','warn'); return; }
    } else {
      if(!SYNC.gist || !SYNC.pat || SYNC.pass.length<8){ toast('开启同步需填 Gist ID、访问令牌、且密码至少 8 位','warn'); return; }
    }
  }
  saveSync();
  toast('同步设置已保存','ok'); setSyStatus();
  if(SYNC.on) setTimeout(syncUpload, 300);
}
function syncUpload(){
  if(!SYNC.on){ toast('请先在上方开启同步并保存','warn'); return; }
  if(!syCryptoReady()) return;
  var type = SYNC.type||'cf';
  if(type==='cf'){
    if(!SYNC.pass){ toast('请先设置同步密码并保存','warn'); return; }
  } else {
    if(!SYNC.gist || !SYNC.pat || !SYNC.pass){ toast('请先填写 Gist ID、访问令牌和同步密码','warn'); return; }
  }
  var btnUp = document.getElementById('syBtnUp');
  var btnDn = document.getElementById('syBtnDn');
  function end(ok, msg){
    if(btnUp){ btnUp.disabled=false; btnUp.textContent=btnUp.dataset.t||'上传同步（本机 → 云）'; }
    if(btnDn){ btnDn.disabled=false; btnDn.dataset.t=btnDn.dataset.t||btnDn.textContent; }
    toast(msg, ok?'ok':'err');
  }
  if(btnUp){ btnUp.disabled=true; btnUp.dataset.t=btnUp.dataset.t||btnUp.textContent; btnUp.textContent='上传中…'; }
  var data=collectSlp();
  syEncrypt(JSON.stringify(data), SYNC.pass).then(function(payload){
    if(type==='cf'){
      return fetchWithTimeout(syKVUrl(), {method:'PUT', headers:{'Content-Type':'text/plain'}, body:payload}, 12000);
    }
    return fetchWithTimeout('https://api.github.com/gists/'+SYNC.gist, {
      method:'PATCH',
      headers:{'Authorization':'token '+SYNC.pat, 'Content-Type':'application/json'},
      body: JSON.stringify({files:{'slp-sync.txt':{content:payload}}})
    }, 18000);
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    SYNC.last='已上传 '+new Date().toLocaleString(); saveSync(); setSyStatus();
    end(true, '已上传到云端');
  }).catch(function(e){ end(false, '上传失败：'+(e&&e.message?e.message:e)); });
}
function syncDownload(){
  if(!SYNC.on){ toast('请先在上方开启同步并保存','warn'); return; }
  if(!syCryptoReady()) return;
  var type = SYNC.type||'cf';
  if(type==='cf'){
    if(!SYNC.pass){ toast('请先设置同步密码','warn'); return; }
  } else {
    if(!SYNC.gist || !SYNC.pat || !SYNC.pass){ toast('请先填写 Gist ID、访问令牌和同步密码','warn'); return; }
  }
  var url, opt;
  if(type==='cf'){ url=syKVUrl(); opt={method:'GET'}; }
  else { url='https://api.github.com/gists/'+SYNC.gist; opt={method:'GET', headers:{'Authorization':'token '+SYNC.pat}}; }
  var btnUp = document.getElementById('syBtnUp');
  var btnDn = document.getElementById('syBtnDn');
  function end(ok, msg){
    if(btnUp){ btnUp.disabled=false; btnUp.textContent=btnUp.dataset.t||'上传同步（本机 → 云）'; }
    if(btnDn){ btnDn.disabled=false; btnDn.textContent=btnDn.dataset.t||'拉取同步（云 → 本机）'; }
    toast(msg, ok?'ok':'err');
  }
  if(btnDn){ btnDn.disabled=true; btnDn.dataset.t=btnDn.dataset.t||btnDn.textContent; btnDn.textContent='拉取中…'; }
  fetchWithTimeout(url, opt, type==='cf'?12000:18000).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(type==='cf') return r.text();
    return r.json().then(function(g){
      var f=g.files && g.files['slp-sync.txt'];
      return f? (f.content||'') : '';
    });
  }).then(function(payload){
    payload = (payload||'').trim();
    if(!payload){ toast('云端还没有数据，请先在另一台上传','warn'); return; }
    if(!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(payload)){
      end(false, '云端返回的不是有效加密数据（请确认打开的是 slp-app-git.pages.dev，且另一台已上传）');
      return;
    }
    return syDecrypt(payload, SYNC.pass).then(function(text){
      var data=JSON.parse(text);
      for(var k in data){ if(data.hasOwnProperty(k)) localStorage.setItem(k, data[k]); }
      reloadFromStorage();
      SYNC.last='已拉取 '+new Date().toLocaleString(); saveSync(); setSyStatus();
      toast('已从云端拉取并合并','ok');
    });
  }).catch(function(e){ end(false, '拉取失败：'+(e&&e.message?e.message:e)); });
}

/* 缴费记录已用 verifyDate（核对日期）替代支付方式，机构方看不到家长支付方式，故不记录 */

function coursePaid(kid){
  var cn = kid ? (kid.courseNo||1) : 1;
  return PAYS.filter(function(p){ return p.kidId===kid.id && (p.courseNo||1)===cn; }).length;
}
function unpaidSessions(kid){
  return SESSIONS.filter(function(s){
    if((s.kidIds||[]).indexOf(kid.id)<0) return false;
    var e=s.entries[kid.id]||{};
    if(e.status!=='done') return false;
    return !PAYS.some(function(p){ return p.kidId===kid.id && p.sessionId===s.id; });
  });
}
function sessionLabel(sid){
  var s=null; for(var i=0;i<SESSIONS.length;i++) if(SESSIONS[i].id===sid) s=SESSIONS[i];
  if(!s) return '';
  return md(s.date)+' '+s.format;
}
function markPaid(kidId, sid){
  var k=kidById(kidId); if(!k) return;
  var s=null; SESSIONS.forEach(function(x){ if(x.id===sid) s=x; });
  if(!s) return;
  PAYS.push({ id:uid(), date:s.date, amount:0, verifyDate:TODAY, kidId:kidId, courseNo:k.courseNo, sessionId:sid, note:'' });
  saveAll();
  if(window.__detailId) openKidDetail(window.__detailId); else render();

}

/* ==================================================================
   图片上传（压缩到 800px）+ 预览 / 删除
   ================================================================== */
function compressImage(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var maxW=800, w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      var ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ cb(cv.toDataURL('image/jpeg',0.8)); }catch(e){ cb(''); }
    };
    img.onerror=function(){ cb(''); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(''); };
  fr.readAsDataURL(file);
}
function uploadKidImg(id, input){
  var k=kidById(id); if(!k) return;
  if(!k.imgs) k.imgs=[];

    toast('每个孩子最多 9 张图片，已为您保留前 '+(9-k.imgs.length)+' 张','err',4000);
    files = files.slice(0, Math.max(0, 9-k.imgs.length));
  }
  if(!files.length) return;
  var done=0;
  files.forEach(function(f){
    compressImage(f, function(data){

        saveAll();

function kpi(v, l){ return '<div class="dstat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function pieSVG(slices, R){
  var total=0; slices.forEach(function(s){ total+=s.val; });
  if(!total) return '';
  var cx=R, cy=R, r=R-6;
  var ang=-Math.PI/2;
  var paths = slices.map(function(s){
    var frac=s.val/total, a2=ang+frac*2*Math.PI;
    var large = frac>0.5?1:0;
    var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    var x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    var d='M'+cx+' '+cy+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z';
    ang=a2;
    return '<path d="'+d+'" fill="'+s.color+'" stroke="#fff" stroke-width="1.6"><title>'+esc(s.label)+' '+s.val+' 人</title></path>';
  }).join('');
  var cText='<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="16" font-weight="800" fill="#334155">'+total+'</text>'+
            '<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="9" fill="#94a3b8">标签合计</text>';
  return '<svg width="'+(R*2)+'" height="'+(R*2)+'" viewBox="0 0 '+(R*2)+' '+(R*2)+'">'+paths+cText+'</svg>';
}

   视图 6：评估资料库（治疗师自己的参考 / 评估素材）
   - 支持分类标签、关联障碍类型、图片上传（压缩 800px，最多 9 张）
   - PDF 等文件只记「文件名 / 存放位置」备注，不存二进制（localStorage 容量有限）
   ================================================================== */
var LIB_CATS = ['评估量表','家庭指导单','典型表现照片','文献摘录','其他'];

/* ==================================================================
   评估 · 优劣势 · IEP（玩着测 → 汇总优劣势 → 生成 IEP）
   ================================================================== */
var _af = { id:null, kidId:'', date:'', types:[], scored:{}, notes:{}, iep:null, note:'' };

function assessById(id){ var r=null; for(var i=0;i<ASSESS.length;i++){ if(ASSESS[i].id===id){ r=ASSESS[i]; break; } } return r; }

function assessSummary(af){
  var strengths=[], weak=[], weakDoms={};
  (af.types||[]).forEach(function(t){
    var A=APROBE[t]; if(!A) return;
    A.doms.forEach(function(dm){
      (dm.ps||[]).forEach(function(p){
        var sc=af.scored[p.id];
        if(sc===0) strengths.push({type:t,dom:dm.d,probe:p.t});
        else if(sc===2){ weak.push({type:t,dom:dm.d,probe:p.t,g:p.g,hw:p.hw}); weakDoms[t+'|'+dm.d]=dm; }
      });
    });
  });
  return {strengths:strengths, weak:weak, weakDoms:weakDoms};
}

function buildIEP(af, sum){
  sum = sum || assessSummary(af);
  var longGoals=[], seenLG={}, strategies=[], seenST={};
  for(var key in sum.weakDoms){ var dm=sum.weakDoms[key];
    if(dm.lg && !seenLG[dm.lg]){ seenLG[dm.lg]=1; longGoals.push(dm.lg); }
    (dm.st||[]).forEach(function(s){ if(!seenST[s]){ seenST[s]=1; strategies.push(s); } });
  }
  var shortGoals = sum.weak.map(function(w){ return (w.type?'【'+w.type+'】':'')+w.probe+'：'+w.g; });
  var homework = sum.weak.map(function(w){ return (w.type?'【'+w.type+'】':'')+w.probe+'：'+w.hw; });
  var measure='每节课记录达成率与正确率；每 4 周复盘一次，弱项目标达成率 ≥70% 即升入下一阶段；优势项转入日常泛化，不再单独训练。';
  return {longGoals:longGoals, shortGoals:shortGoals, strategies:strategies.slice(0,8), homework:homework, measure:measure};
}

function formatIEPText(a){
  var sum=assessSummary(a); var iep=a.iep||buildIEP(a,sum);
  var L=['【IEP 个别化教育计划】', (a.kidName||'孩子')+' · '+a.date+' · '+(a.types||[]).join(' / ')];
  L.push('— 优势 —'); (sum.strengths.length?sum.strengths:[]).forEach(function(s){ L.push('· '+s.probe+'（'+s.dom+'）'); });
  L.push('— 待提升 —'); (sum.weak.length?sum.weak:[]).forEach(function(s){ L.push('· '+s.probe+'（'+s.dom+'）'); });
  L.push('— 长期目标 —'); (iep.longGoals||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 短期目标（SMART）—'); (iep.shortGoals||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 教学策略 —'); (iep.strategies||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 家庭作业 —'); (iep.homework||[]).forEach(function(x){ L.push('· '+x); });
  L.push('— 评量标准 —'); L.push('· '+(iep.measure||''));
  return L.join('\n');
}

function _maybeAutoType(){
  var k=kidById(_af.kidId);
  if(k && !_af.types.length){
    _af.types = aTypesOf(k);
    if(!_af.types.length) _af.types=Object.keys(APROBE).slice(0,1);
  }
  drawAssessForm();
}

function toggleAssessType(cb){
  var t=cb.getAttribute('data-at'); var lab=cb.parentNode;
  var i=_af.types.indexOf(t);
  if(cb.checked){ if(i<0)_af.types.push(t); lab.className='on'; }
  else { if(i>=0)_af.types.splice(i,1); lab.className=''; }
  var box=document.getElementById('aProbes'); if(box) box.innerHTML=drawAssessProbes();
  refreshIEPEnabled();
}

function refreshIEPEnabled(){
  var wrap=document.querySelector('.ass-iep');
  if(!wrap) return;
  if(_af.types.length){ wrap.style.opacity='1'; wrap.style.pointerEvents='auto'; }
  else { wrap.style.opacity='.5'; wrap.style.pointerEvents='none'; var r=document.getElementById('aResult'); if(r) r.innerHTML=drawAssessResult(); }
}

function drawAssessProbes(){
  if(!_af.types.length) return '<div class="mini-note">先勾选上面的「关注领域」，下面就会出现对应的玩着测清单。</div>';
  var h='';
  _af.types.forEach(function(t){
    var A=APROBE[t]; if(!A) return;
    h+='<div class="ass-type"><div class="ass-type-t">'+esc(t)+'</div>'+
       '<div class="mini-note" style="margin:6px 0">'+esc(A.tip)+'</div>'+
       '<div class="ass-mat">材料：'+esc(A.mat)+'</div>';
    A.doms.forEach(function(dm){
      h+='<div class="ass-dom"><div class="ass-dom-t">'+esc(dm.d)+'</div>';
      (dm.ps||[]).forEach(function(p){
        var sc=_af.scored[p.id];
        var opts=[{v:undefined,t:'未测'},{v:0,t:'优势'},{v:1,t:'一般'},{v:2,t:'弱项'}];
        var radios = opts.map(function(o){
          var val=(o.v===undefined)?'':String(o.v);
          var on=(sc===o.v);
          var cls= on?(' ar'+o.v):'';
          return '<label class="ar'+cls+'"><input type="radio" name="ar_'+p.id+'" '+(on?'checked':'')+' value="'+val+'" onchange="setScore(\''+p.id+'\',this.value)">'+o.t+'</label>';
        }).join('');
        var note=_af.notes[p.id]||'';
        h+='<div class="ass-probe">'+
           '<div class="ass-probe-t">'+esc(p.t)+'</div>'+
           '<div class="ass-how"><b>怎么玩着测：</b>'+esc(p.how)+'</div>'+
           '<div class="arow">'+radios+'</div>'+
           '<input class="inp ass-note" placeholder="观察备注（可选）" value="'+esc(note)+'" oninput="_af.notes[\''+p.id+'\']=this.value">'+
           '</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  return h;
}

function setScore(pid, val){
  if(val===''){ delete _af.scored[pid]; }
  else { _af.scored[pid]=parseInt(val,10); }
  var box=document.getElementById('aResult'); if(box) box.innerHTML=drawAssessResult();
}

  h+='<div class="ass-sw">'+
     '<div class="ass-col"><div class="ass-col-h ok">优势（'+sum.strengths.length+'）</div>'+
       (sum.strengths.length? sum.strengths.map(function(s){ return '<div class="ass-srow">'+esc(s.probe)+'<span class="faint">'+esc(s.dom)+'</span></div>'; }).join('') : '<div class="mini-note">把对应探针评为「优势」即出现在这里。</div>')+
     '</div>'+

     '</div></div>';

     '<div class="fg"><label>长期目标（每行一条，来自待提升领域的长期目标）'+aiBtnHTML('IEP长期目标',_af.kidId||'')+'</label><textarea class="inp" rows="3" id="iepLG" placeholder="每行一条">'+esc((iep.longGoals||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>短期目标 SMART（来自待提升探针）'+aiBtnHTML('IEP短期目标',_af.kidId||'')+'</label><textarea class="inp" rows="4" id="iepSG" placeholder="每行一条">'+esc((iep.shortGoals||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>教学策略（来自待提升领域）'+aiBtnHTML('IEP教学策略',_af.kidId||'')+'</label><textarea class="inp" rows="3" id="iepST" placeholder="每行一条">'+esc((iep.strategies||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>家庭作业（来自待提升探针）'+aiBtnHTML('IEP家庭作业',_af.kidId||'')+'</label><textarea class="inp" rows="3" id="iepHW" placeholder="每行一条">'+esc((iep.homework||[]).join('\n'))+'</textarea></div>'+
     '<div class="fg"><label>评量标准'+aiBtnHTML('IEP评量标准',_af.kidId||'')+'</label><textarea class="inp" rows="2" id="iepMS">'+esc(iep.measure||'')+'</textarea></div>'+

function recomputeIEP(){
  var sum=assessSummary(_af);
  _af.iep = buildIEP(_af, sum);
  var box=document.getElementById('aResult'); if(box) box.innerHTML=drawAssessResult();
  toast('已按当前评分重新生成 IEP','ok');
}

function saveAssess(){
  if(!_af.kidId){ toast('请选择评估对象','err'); return; }
  if(!_af.types.length){ toast('至少勾选一个关注领域','err'); return; }
  var noteEl=document.getElementById('afNote');
  var split = function(el){ return (el.value||'').split('\n').map(function(x){return x.trim();}).filter(function(x){return x;}); };
  var iep={ longGoals:split(document.getElementById('iepLG')),
            shortGoals:split(document.getElementById('iepSG')),
            strategies:split(document.getElementById('iepST')),
            homework:split(document.getElementById('iepHW')),
            measure:(document.getElementById('iepMS').value||'').trim() };
  var k=kidById(_af.kidId);
  var rec={ id:_af.id||uid(), kidId:_af.kidId, kidName:k?k.name:_af.kidId, date:_af.date,
            types:_af.types.slice(), scored:JSON.parse(JSON.stringify(_af.scored)), notes:JSON.parse(JSON.stringify(_af.notes)),
            iep:iep, note:noteEl?noteEl.value:'', createdAt:_af.id?(assessById(_af.id).createdAt):TODAY };
  if(_af.id){ for(var i=0;i<ASSESS.length;i++) if(ASSESS[i].id===_af.id) ASSESS[i]=rec; }
  else ASSESS.push(rec);
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render(); toast('评估已保存','ok');
}

function applyIEP(aid){
  var a=assessById(aid); if(!a) return;
  if(!kidById(a.kidId)){ toast('该孩子档案已删除，无法写入计划','err'); return; }
  openSession(null, a.kidId, TODAY);
  if(_sf.kidIds.length){
    _sf.entries[_sf.kidIds[0]].nextPlan = formatIEPText(a);
    drawSessionForm();
    toast('已把 IEP 写入「下一步计划」，可再调整','ok');
  }
}

function copyIEP(aid){
  var a=assessById(aid); if(!a) return;
  var txt=formatIEPText(a);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('IEP 已复制，可粘贴到微信 / 文档','ok'); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('IEP 已复制','ok'); }
  catch(e){ toast('复制失败，请手动选择文本','err'); }
  document.body.removeChild(ta);
}

function delAssess(id){
  if(!confirm('删除这份评估？')) return;
  ASSESS=ASSESS.filter(function(a){ return a.id!==id; });
  saveAll(); render(); toast('已删除');
}

function toggleLibTag(cb){
  var t=cb.getAttribute('data-lt');
  var lab=cb.parentNode;
  if(cb.checked) lab.className='on'; else lab.className='';
}
function uploadLibImg(input){
  var files = input.files ? Array.prototype.slice.call(input.files) : [];
  if(!files.length) return;
  var box=document.getElementById('libImgs');
  var cur = box? box.querySelectorAll('.thumb').length : 0;
  if(cur + files.length > 9){ toast('每份资料最多 9 张图片，已保留前 '+(9-cur)+' 张','err',4000); files=files.slice(0,Math.max(0,9-cur)); }
  var done=0;
  files.forEach(function(f){
    compressImage(f, function(src){
      var d=document.createElement('div'); d.className='thumb';
      var im=document.createElement('img'); im.src=src; im.alt='资料图片';
      im.onclick=function(){ previewSrc(this.src); };
      var xb=document.createElement('button'); xb.className='thumb-x'; xb.type='button'; xb.textContent='×';
      xb.onclick=function(){ d.parentNode.removeChild(d); };
      d.appendChild(im); d.appendChild(xb);
      box.appendChild(d);
      if(++done===files.length) toast('图片已添加（保存后生效）','ok');
    });
  });
}
function delLibImg(i){
  var box=document.getElementById('libImgs'); if(!box) return;
  var th=box.querySelectorAll('.thumb'); if(th[i]) th[i].remove();
}
function saveLib(){
  var title=(document.getElementById('libTitle').value||'').trim();
  if(!title){ toast('请填写标题','err'); return; }
  var cat=document.getElementById('libCat').value;
  var tags=[]; document.querySelectorAll('#moBox input[data-lt]').forEach(function(cb){ if(cb.checked) tags.push(cb.getAttribute('data-lt')); });
  var note=document.getElementById('libNote').value;
  var file=(document.getElementById('libFile').value||'').trim();
  var imgs=[]; var box=document.getElementById('libImgs');
  if(box) box.querySelectorAll('.thumb img').forEach(function(im){ imgs.push(im.src); });
  if(window.__libId){
    var x=null; LIB.forEach(function(l){ if(l.id===window.__libId) x=l; });
    if(x){ x.title=title; x.cat=cat; x.tags=tags; x.note=note; x.file=file; x.imgs=imgs; }
    toast('资料已更新','ok');
  } else {
    LIB.push({ id:uid(), title:title, cat:cat, tags:tags, note:note, file:file, imgs:imgs, createdAt:TODAY });
    toast('资料已保存','ok');
  }
  if(!saveAll()){ toast('保存失败，数据未写入。请检查浏览器存储或先导出备份','err',6000); return; }
  closeMo(); render();
}
function delLib(id){
  if(!confirm('删除这份资料？')) return;
  LIB = LIB.filter(function(l){ return l.id!==id; });
  saveAll(); render(); toast('已删除');
}

/* ==================================================================
   单个儿童完整档案导出（Word / PDF）
   ================================================================== */
function rptKV(l,v){
  return '<tr><td class="rpt-k">'+esc(l)+'</td><td>'+esc(v)+'</td></tr>';
}

function buildKidReportHTML(kidId){
  var k=kidById(kidId); if(!k) return '<div class="rpt">未找到该儿童档案</div>';
  var c=calc(k);
  var now=new Date();
  var ss=SESSIONS.filter(function(s){ return s.kidIds.indexOf(kidId)>=0; })
                 .sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  var ps=PLANS.filter(function(p){ return p.kidId===kidId; })
              .sort(function(a,b){ return a.createdAt<b.createdAt?1:-1; });
  var as=ASSESS.filter(function(a){ return a.kidId===kidId; })
               .sort(function(a,b){ return a.date<b.date?1:-1; });
  var pays=PAYS.filter(function(p){ return p.kidId===kidId; })
               .sort(function(a,b){ return a.date<b.date?1:-1; });

  var head='<div class="rpt">'+
    '<div class="rpt-hd"><h1>儿童言语治疗档案 · '+esc(k.name)+'</h1>'+
    '<div class="rpt-sub">档案号（小D号）：'+esc(k.dNo||'未填写')+
      ' ｜ 生成时间：'+esc(fmtD(now))+' '+esc(wd(fmtD(now)))+
      ' ｜ 治疗师：____________</div></div>';

  /* 一、基本情况 */
  var basic='<h2>一、儿童基本情况</h2><table class="rpt-tb"><tbody>'+
    rptKV('姓名',k.name)+
    rptKV('性别',k.gender||'-')+
    rptKV('出生日期',k.birth||'-')+
    rptKV('年龄',ageOf(k.birth)||'-')+
    rptKV('障碍类型 / 标签',(k.tags||[]).join(' / ')||'-')+
    rptKV('治疗形式',k.format||'-')+
    rptKV('小D随访号',k.dNo||'-')+
    rptKV('建档日期',k.createdAt||'-')+
    rptKV('当前状态',{active:'疗程中',waiting:'待重新排队',archived:'已归档'}[k.status]||'-')+
    rptKV('当前疗程','第 '+k.courseNo+' 疗程（标准 '+c.per+' 节）')+
    rptKV('累计购买 / 已上 / 剩余',((k.quotaTotal||0)+' 节 / '+c.used+' 节 / '+Math.max(0,c.remain)+' 节'))+
    '</tbody></table>';
  if(k.brief) basic+='<div class="rpt-note" style="margin-top:6px">接案摘要：'+esc(k.brief).replace(/\n/g,'<br>')+'</div>';

  /* 二、疗程记录 */
  var course='<h2>二、疗程记录</h2>';
  var cur=(k.status==='active')?
    '<div class="rpt-iep"><div class="rpt-iep-h"><b>第 '+k.courseNo+' 疗程</b> <span class="rpt-dim">进行中 · '+c.inCourse+' / '+c.per+' 节</span></div>'+
    '<div>本疗程进度：'+(c.pct*100).toFixed(0)+'%，剩余 '+Math.max(0,c.remain)+' 节</div></div>':'';
  var hist=(k.history||[]).map(function(x){
    return '<div class="rpt-iep"><div class="rpt-iep-h"><b>第 '+x.no+' 疗程</b> · '+esc(x.result||'')+
      (x.carry?' · '+esc(x.carry):'')+' · <span class="rpt-dim">'+esc(x.endedAt||'')+'</span></div>'+
      '<div>上课 '+x.done+' 节'+(x.target?' / 目标 '+x.target+' 节':'')+(x.note?'<br>'+esc(x.note):'')+'</div></div>';
  }).join('');
  course += (cur||hist) ? (cur+hist) : '<div class="rpt-empty" style="padding:12px">暂无疗程记录</div>';

  /* 三、治疗计划 */
  var plan='<h2>三、治疗计划</h2>';
  plan += ps.length ? ps.map(function(p){
    return '<div class="rpt-iep"><div class="rpt-iep-h"><b>'+esc(p.stage)+'</b> · '+
      (p.status==='active'?'<span class="rpt-dim">进行中</span>':'<span class="rpt-dim">已存档</span>')+
      ' · <span class="rpt-dim">'+esc(p.createdAt)+'</span></div>'+
      '<div class="rpt-iep-b">'+esc(p.goal).replace(/\n/g,'<br>')+'</div></div>';
  }).join('') : '<div class="rpt-empty" style="padding:12px">暂无阶段计划</div>';

  /* 四、课程记录明细（全部） */
  var detail='<h2>四、课程记录明细（共 '+ss.length+' 次）</h2>';
  if(!ss.length){
    detail+='<div class="rpt-empty" style="padding:12px">暂无课程记录</div>';
  }else{
    detail+='<table class="rpt-tb"><thead><tr>'+
      '<th>日期</th><th>形式</th><th>考勤</th><th>治疗内容</th><th>课堂表现</th><th>家庭作业</th><th>缴费</th></tr></thead><tbody>';
    ss.forEach(function(s){
      var e=s.entries[kidId]||{};
      var pay=PAYS.filter(function(p){ return p.sessionId===s.id && p.kidId===kidId; })[0];
      var payTxt=pay?('已确认'+(pay.verifyDate?(' / 核对 '+pay.verifyDate):'')):'待确认';
      detail+='<tr>'+
        '<td>'+esc(s.date)+'<br><span class="rpt-dim">'+esc(wd(s.date))+'</span></td>'+
        '<td>'+esc(s.format)+'</td>'+
        '<td>'+esc(ST_LABEL[e.status]||'—')+'</td>'+
        '<td class="rpt-mult">'+esc(e.content||'')+'</td>'+
        '<td class="rpt-mult">'+esc(e.perf||'')+'</td>'+
        '<td class="rpt-mult">'+esc(e.hw||'')+'</td>'+
        '<td>'+esc(payTxt)+'</td>'+
      '</tr>';
    });
    detail+='</tbody></table>';
  }

  /* 五、评估与 IEP（全部） */
  var iep='<h2>五、评估与个别化教育计划（IEP）</h2>';
  if(!as.length){
    iep+='<div class="rpt-empty" style="padding:12px">暂无评估 / IEP 记录</div>';
  }else{
    as.forEach(function(a){
      iep+='<div class="rpt-iep"><div class="rpt-iep-h"><b>'+esc(k.name)+'</b> '+
        '<span class="rpt-dim">'+esc(a.date)+' · '+(a.types||[]).join(' / ')+'</span></div>'+
        '<div class="rpt-iep-b">'+esc(formatIEPText(a)).replace(/\n/g,'<br>')+'</div>'+
        (a.note?'<div class="rpt-note">备注：'+esc(a.note)+'</div>':'')+'</div>';
    });
  }

  /* 六、缴费确认 */
  var paid=coursePaid(k);
  var paySec='<h2>六、缴费确认</h2>';
  paySec+='<div class="rpt-iep"><div class="rpt-iep-h"><b>本疗程（第 '+k.courseNo+' 疗程）已确认缴费 '+paid+' / '+c.per+' 次</b></div></div>';
  paySec += pays.length ?
    '<table class="rpt-tb"><thead><tr><th>日期</th><th>方式</th><th>疗程</th><th>金额</th><th>核对</th></tr></thead><tbody>'+
    pays.map(function(p){
      var amt=Number(p.amount)||0;
      return '<tr><td>'+esc(p.date)+'</td><td>'+esc(p.verifyDate||'-')+'</td><td>第'+(p.courseNo||1)+'疗程</td>'+
        '<td class="num">'+(amt?('¥'+amt.toLocaleString('zh-CN')):'-')+'</td>'+
        '<td>'+esc(p.verifyDate?'已核对':'待核对')+'</td></tr>';
    }).join('')+'</tbody></table>'
    : '<div class="rpt-empty" style="padding:12px">暂无缴费登记</div>';

  /* 七、影像 / 纸质资料 */
  var kimgs=k.imgs||[];
  var imgSec='<h2>七、影像 / 纸质资料（'+kimgs.length+' 张）</h2>';
  if(!kimgs.length){
    imgSec+='<div class="rpt-empty" style="padding:12px">暂无上传图片</div>';
  }else{
    imgSec+='<div class="rpt-imgrid">'+kimgs.map(function(src){
      return '<img class="rpt-img" src="'+src+'">';
    }).join('')+'</div>';
  }

  /* 八、签字确认 */
  var sign='<h2>八、签字确认</h2><div class="rpt-sign">'+
    '<div>治疗师签字：____________________ 日期：__________</div>'+
    '<div>家长确认签字：____________________ 日期：__________</div>'+
    '<div class="rpt-ft">本档案由「言语治疗工作台」生成，数据存于本机浏览器，仅供内部核对与医保检查留档使用。</div></div>';

  return head+basic+course+plan+detail+iep+paySec+imgSec+sign+'</div>';
}

      '</tr></thead><tbody>';

function doImport(input){
  var f=input.files&&input.files[0];
  input.value='';
  if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var d;
    try{ d=JSON.parse(r.result); }
    catch(e){ toast('文件格式不对，不是有效的 JSON 备份','err',4000); return; }
    if(!d || !Array.isArray(d.kids)){ toast('这不像是本工作台导出的备份文件','err',4000); return; }
    var nK=d.kids.length, nS=(d.sessions||[]).length, nP=(d.plans||[]).length;
    var body='<div class="notice tip" style="margin:0 0 14px">'+

function researchGet(id){ for(var i=0;i<RESEARCH.length;i++) if(RESEARCH[i].id===id) return RESEARCH[i]; return null; }
function tpIndex(tp){ var i=TP_ORDER.indexOf(tp); return i>=0?i:999; }
function tpList(p){ var set={},arr=[]; (p.records||[]).forEach(function(r){ if(!set[r.tp]){ set[r.tp]=1; arr.push(r.tp); } }); arr.sort(function(a,b){ return tpIndex(a)-tpIndex(b); }); return arr; }
function uniqueKids(p){ var m={},a=[]; (p.records||[]).forEach(function(r){ if(!m[r.kidId]){ m[r.kidId]=1; a.push(r.kidId); } }); return a; }
function findRec(p,kidId,tp){ for(var i=0;i<(p.records||[]).length;i++){ if(p.records[i].kidId===kidId && p.records[i].tp===tp) return p.records[i]; } return null; }
function meanOf(p,m,tpSet){ var sum=0,n=0; (p.records||[]).forEach(function(r){ if(tpSet.indexOf(r.tp)>=0 && r.values){ var v=r.values[m.id]; if(v!=null && v!=='' && !isNaN(Number(v))){ sum+=Number(v); n++; } } }); return n? sum/n : null; }
function fmtNum(v){ return (Math.round(Number(v)*10)/10).toString(); }
function copyText(t){ if(!t) return; try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制','ok'); }catch(e){ toast('复制失败，请手动选择','err'); } }

function researchChartsHTML(p){

  if(!numM.length || !p.records || !p.records.length) return '';
  var tps=tpList(p);
  var h='<div class="card"><div class="card-h"><span>对比看板</span></div>';
  numM.forEach(function(m){
    var series=[]; var kids=uniqueKids(p);
    kids.forEach(function(kidId, idx){
      var vals=tps.map(function(tp){ var rec=findRec(p,kidId,tp); if(!rec) return null; var v=rec.values?rec.values[m.id]:undefined; return (v==null||v===''||isNaN(Number(v)))?null:Number(v); });
      series.push({name:kidName(kidId), color:CHR_COLORS[idx%CHR_COLORS.length], vals:vals});
    });
    h+='<div class="chart-block"><div class="chart-title">'+esc(m.name)+(m.unit?'（'+esc(m.unit)+'）':'')+' · 各对象趋势</div>';
    h+=svgLineChart(tps, series);
    var pre=meanOf(p,m,['前测','基线']), post=meanOf(p,m,['后测','随访']);
    if(pre!=null || post!=null){ h+='<div class="chart-title" style="margin-top:10px">'+esc(m.name)+' · 前测 vs 后测（均值）</div>'; h+=svgPrePost(pre,post,m.unit); }

  });

function svgLineChart(labels, series){
  var W=660,H=240,padL=40,padR=16,padT=14,padB=30; var iw=W-padL-padR, ih=H-padT-padB;
  var allv=[]; series.forEach(function(s){ s.vals.forEach(function(v){ if(v!=null && !isNaN(v)) allv.push(v); }); });
  if(!allv.length) return '<div class="chart-empty">暂无数值数据</div>';
  var maxV=Math.max.apply(null,allv), minV=Math.min.apply(null,allv);
  if(maxV===minV){ maxV+=1; if(minV>0) minV-=1; else minV=0; }
  var n=labels.length;
  function X(i){ return padL + (n<=1?iw/2:iw*i/(n-1)); }
  function Y(v){ return padT + ih - (v-minV)/(maxV-minV)*ih; }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="cht" preserveAspectRatio="xMidYMid meet">';
  var ticks=4;
  for(var t=0;t<=ticks;t++){ var val=minV+(maxV-minV)*t/ticks; var y=Y(val); svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef2f7"/>'; svg+='<text x="'+(padL-5)+'" y="'+(y+3)+'" font-size="9" fill="#94a3b8" text-anchor="end">'+fmtNum(val)+'</text>'; }
  for(var i=0;i<n;i++){ svg+='<text x="'+X(i)+'" y="'+(H-11)+'" font-size="9" fill="#64748b" text-anchor="middle">'+esc(labels[i]||'')+'</text>'; }
  series.forEach(function(s){ var d='', started=false; for(var i=0;i<n;i++){ var v=s.vals[i]; if(v==null||isNaN(v)) continue; d+=(started?'L':'M')+X(i)+' '+Y(v)+' '; started=true; } if(d){ svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"/>'; } for(var j=0;j<n;j++){ var v2=s.vals[j]; if(v2==null||isNaN(v2)) continue; svg+='<circle cx="'+X(j)+'" cy="'+Y(v2)+'" r="3" fill="'+s.color+'"/>'; } });
  svg+='</svg>';
  var lg='<div class="cht-lg">'+series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join('')+'</div>';
  return '<div class="cht-box">'+svg+lg+'</div>';
}
function svgPrePost(pre,post,unit){
  var vals=[pre,post].filter(function(v){ return v!=null; }); if(!vals.length) return '';
  var maxV=Math.max.apply(null,vals); if(maxV<=0) maxV=1;
  var W=300,H=120,padB=22,padT=12,padL=10,padR=10,bw=54,gap=34;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="cht" preserveAspectRatio="xMidYMid meet">';
  var bars=[{l:'前测',v:pre,c:'#94a3b8'},{l:'后测',v:post,c:'#0ea5e9'}]; var x=padL;
  bars.forEach(function(b){ if(b.v==null){ x+=bw+gap; return; } var bh=(b.v/maxV)*(H-padB-padT); var y=H-padB-bh; svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+b.c+'"/>'; svg+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="10" fill="#334155" text-anchor="middle">'+fmtNum(b.v)+'</text>'; svg+='<text x="'+(x+bw/2)+'" y="'+(H-7)+'" font-size="9" fill="#64748b" text-anchor="middle">'+b.l+'</text>'; x+=bw+gap; });
  svg+='</svg>';
  return '<div class="cht-box">'+svg+(unit?'<div class="cht-lg"><span>单位：'+esc(unit)+'</span></div>':'')+'</div>';
}

   （iPad 加到主屏后无法手动刷新，必须让 App 自己发现新版并更新）

var APP_VER='2026.08.08-5';

/* 行为检测 flex gap：不靠 CSSOM，直接量两个空 div 的间距 */
function flexGapSupported(){
  try{
    var f=document.createElement('div');
    f.style.display='flex'; f.style.flexDirection='column';
    f.style.rowGap='1px'; f.style.position='absolute';
    f.style.visibility='hidden'; f.style.height='0'; f.style.padding='0'; f.style.border='0';
    f.appendChild(document.createElement('div'));
    f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    var ok=(f.scrollHeight===1);
    f.parentNode.removeChild(f);
    return ok;
  }catch(e){ return true; }
}
function applyGapFallback(){
  try{
    if(!flexGapSupported()) document.documentElement.className+=' nogap';
  }catch(e){}
}

/* 一键强制更新：注销 SW + 清空所有缓存 + 换 URL 重载（绕过 iOS 顽固缓存） */
function forceUpdate(){
  try{ toast('正在获取最新版本…','ok'); }catch(e){}
  var fired=false;
  function done(){
    if(fired) return; fired=true;
    var base=location.pathname.replace(/[?#].*$/,'');
    try{ location.replace(base+'?v='+Date.now()); }
    catch(e){ location.href=base+'?v='+Date.now(); }
  }
  var jobs=[];
  try{
    if(window.caches && caches.keys){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches['delete'](k); }));
      }));
    }
  }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
  }catch(e){}
  if(jobs.length){
    try{ Promise.all(jobs).then(done, done); }catch(e){ done(); }
    setTimeout(done, 2500);   /* 兜底：清理卡住也照样重载 */
  } else { done(); }
}

/* 静默检查线上版本号；有新版就弹底部横幅（不打断当前操作） */
function autoCheckUpdate(){
  try{
    if(!window.fetch) return;
    var host=location.hostname||'';
    if(host==='localhost'||host==='127.0.0.1'||host==='') return;
    var url=location.pathname.replace(/[?#].*$/,'')+'?vc='+Date.now();
    fetch(url,{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(txt){
      var m=txt.match(/APP_VER\s*=\s*'([^']+)'/);
      if(m && m[1] && m[1]!==APP_VER){
        var bar=document.getElementById('updBar');
        var t=document.getElementById('updTxt');
        if(t) t.textContent='发现新版本 '+m[1]+'（当前 '+APP_VER+'）';
        if(bar) bar.classList.add('on');
      }
    })['catch'](function(){});
  }catch(e){}
}

function initVersionUI(){
  try{
    var v=document.getElementById('verNow');
    if(v) v.textContent=APP_VER;
  }catch(e){}
}

  if(aiState.taEl.dispatchEvent){ try{ aiState.taEl.dispatchEvent(new Event('input')); }catch(e){} }
  if(!keep){ closeAIMo(); }
  toast(keep?'已写入，可继续讨论':'已采纳并写入'+aiState.kind, 'ok');
}
function aiAdoptKeep(){ aiAdopt(true); }
function aiDiscard(){ document.getElementById('aiDraftWrap').style.display='none'; document.getElementById('aiDraft').value=''; }

</script>
<div id="aiMo" class="ov">
  <div class="mo wide">
    <div class="mo-h"><h3 id="aiTitle">✨ AI 润色</h3>
      <button class="mo-x" type="button" onclick="closeAIMo()"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="mo-b">
      <div class="ai-set" id="aiSetBox"></div>
      <div class="ai-ctx" id="aiCtx"></div>
      <div class="ai-tpl" id="aiTpl"></div>
      <label class="ai-lab">你的要求（可空，默认按所选模板扩写润色）</label>
      <textarea id="aiInstr" class="inp" rows="2" placeholder="例如：再加一点情绪行为观察，语气温柔专业"></textarea>
      <div class="ai-chat" id="aiChat"></div>
      <div class="ai-draft" id="aiDraftWrap" style="display:none">
        <div class="ai-draft-h">AI 草稿 · 待审核（请核对事实后再采纳，AI 不会自动写入）</div>
        <textarea id="aiDraft" class="inp" rows="6"></textarea>
        <div class="ai-actions">
          <button class="btn pri" type="button" onclick="aiAdopt(false)">采纳并写入</button>
          <button class="btn" type="button" onclick="aiAdopt(true)">采纳并继续讨论</button>
          <button class="btn ghost" type="button" onclick="aiDiscard()">放弃</button>
        </div>
      </div>
    </div>
    <div class="mo-f">
      <button class="btn" type="button" onclick="closeAIMo()">关闭</button>
      <button class="btn pri" type="button" id="aiSendBtn" onclick="aiSend()">生成 / 继续讨论</button>
    </div>
  </div>
</div>
</body>
</html>
