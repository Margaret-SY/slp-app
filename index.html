var RES = { cur:null };
var TP_ORDER = ['前测','基线','中测','干预中','后测','随访'];
var CHR_COLORS = ['#0ea5e9','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'];

function researchGet(id){ for(var i=0;i<RESEARCH.length;i++) if(RESEARCH[i].id===id) return RESEARCH[i]; return null; }
function tpIndex(tp){ var i=TP_ORDER.indexOf(tp); return i>=0?i:999; }
function tpList(p){ var set={},arr=[]; (p.records||[]).forEach(function(r){ if(!set[r.tp]){ set[r.tp]=1; arr.push(r.tp); } }); arr.sort(function(a,b){ return tpIndex(a)-tpIndex(b); }); return arr; }
function uniqueKids(p){ var m={},a=[]; (p.records||[]).forEach(function(r){ if(!m[r.kidId]){ m[r.kidId]=1; a.push(r.kidId); } }); return a; }
function findRec(p,kidId,tp){ for(var i=0;i<(p.records||[]).length;i++){ if(p.records[i].kidId===kidId && p.records[i].tp===tp) return p.records[i]; } return null; }
function meanOf(p,m,tpSet){ var sum=0,n=0; (p.records||[]).forEach(function(r){ if(tpSet.indexOf(r.tp)>=0 && r.values){ var v=r.values[m.id]; if(v!=null && v!=='' && !isNaN(Number(v))){ sum+=Number(v); n++; } } }); return n? sum/n : null; }
function fmtNum(v){ return (Math.round(Number(v)*10)/10).toString(); }
function copyText(t){ if(!t) return; try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制','ok'); }catch(e){ toast('复制失败，请手动选择','err'); } }

  if(!RESEARCH.length){ h+='<div class="empty"><p>还没有研究项目</p><small>点上方「新建研究项目」开始</small></div>'; return h; }
  h+='<div class="res-grid">';

  h+='<div class="card"><div class="card-h"><span>研究变量</span><button class="btn pri sm" onclick="openMetricForm(\''+p.id+'\',null)">+ 变量</button></div>';
  if(p.metrics && p.metrics.length){
    h+='<div class="res-metrics">';
    p.metrics.forEach(function(m){

function svgLineChart(labels, series){
  var W=660,H=240,padL=40,padR=16,padT=14,padB=30; var iw=W-padL-padR, ih=H-padT-padB;
  var allv=[]; series.forEach(function(s){ s.vals.forEach(function(v){ if(v!=null && !isNaN(v)) allv.push(v); }); });
  if(!allv.length) return '<div class="chart-empty">暂无数值数据</div>';
  var maxV=Math.max.apply(null,allv), minV=Math.min.apply(null,allv);
  if(maxV===minV){ maxV+=1; if(minV>0) minV-=1; else minV=0; }
  var n=labels.length;
  function X(i){ return padL + (n<=1?iw/2:iw*i/(n-1)); }
  function Y(v){ return padT + ih - (v-minV)/(maxV-minV)*ih; }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="cht" preserveAspectRatio="xMidYMid meet">';
  var ticks=4;
  for(var t=0;t<=ticks;t++){ var val=minV+(maxV-minV)*t/ticks; var y=Y(val); svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef2f7"/>'; svg+='<text x="'+(padL-5)+'" y="'+(y+3)+'" font-size="9" fill="#94a3b8" text-anchor="end">'+fmtNum(val)+'</text>'; }
  for(var i=0;i<n;i++){ svg+='<text x="'+X(i)+'" y="'+(H-11)+'" font-size="9" fill="#64748b" text-anchor="middle">'+esc(labels[i]||'')+'</text>'; }
  series.forEach(function(s){ var d='', started=false; for(var i=0;i<n;i++){ var v=s.vals[i]; if(v==null||isNaN(v)) continue; d+=(started?'L':'M')+X(i)+' '+Y(v)+' '; started=true; } if(d){ svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"/>'; } for(var j=0;j<n;j++){ var v2=s.vals[j]; if(v2==null||isNaN(v2)) continue; svg+='<circle cx="'+X(j)+'" cy="'+Y(v2)+'" r="3" fill="'+s.color+'"/>'; } });
  svg+='</svg>';
  var lg='<div class="cht-lg">'+series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join('')+'</div>';
  return '<div class="cht-box">'+svg+lg+'</div>';
}
function svgPrePost(pre,post,unit){
  var vals=[pre,post].filter(function(v){ return v!=null; }); if(!vals.length) return '';
  var maxV=Math.max.apply(null,vals); if(maxV<=0) maxV=1;
  var W=300,H=120,padB=22,padT=12,padL=10,padR=10,bw=54,gap=34;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="cht" preserveAspectRatio="xMidYMid meet">';
  var bars=[{l:'前测',v:pre,c:'#94a3b8'},{l:'后测',v:post,c:'#0ea5e9'}]; var x=padL;
  bars.forEach(function(b){ if(b.v==null){ x+=bw+gap; return; } var bh=(b.v/maxV)*(H-padB-padT); var y=H-padB-bh; svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+b.c+'"/>'; svg+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="10" fill="#334155" text-anchor="middle">'+fmtNum(b.v)+'</text>'; svg+='<text x="'+(x+bw/2)+'" y="'+(H-7)+'" font-size="9" fill="#64748b" text-anchor="middle">'+b.l+'</text>'; x+=bw+gap; });
  svg+='</svg>';
  return '<div class="cht-box">'+svg+(unit?'<div class="cht-lg"><span>单位：'+esc(unit)+'</span></div>':'')+'</div>';
}

/* 通用「二次点击确认」——规避 iOS 12 PWA 下 confirm()/prompt() 原生对话框静默失效 */
var _armDel = {};
function clearDelArmed(){
  for(var k in _armDel){ var a=_armDel[k]; if(a){ if(a.timer) clearTimeout(a.timer); var b=a.btn; if(b && b.tagName){ b.classList.remove('armed'); if(b._delOld!=null) b.textContent=b._delOld; } } delete _armDel[k]; }
}
function armDel(key, btn, doDelete, label){
  if(_armDel[key]){                 /* 已待确认 → 第二次点击，真执行 */
    if(_armDel[key].timer) clearTimeout(_armDel[key].timer);
    delete _armDel[key];
    doDelete();
    return;
  }
  clearDelArmed();                  /* 同时只保留一个待确认项 */
  var el = (btn && btn.tagName) ? btn : null;
  var txt = label || '确认删除?';
  if(el){ el._delOld = el.textContent; el.classList.add('armed'); el.textContent = txt; }
  _armDel[key] = { timer: setTimeout(function(){
      var a=_armDel[key]; if(a && a.btn && a.btn.tagName){ a.btn.classList.remove('armed'); if(a.btn._delOld!=null) a.btn.textContent=a.btn._delOld; } delete _armDel[key];
    }, 3000), btn: el };
  toast('再点一次「'+txt+'」执行，3 秒内有效','warn');
}
var _resDelArmed = null;
var _resDelTimer = null;
function delResearch(id, btn){
  // 切换到新 id 之前，先清掉旧的待确认态
  if(_resDelTimer && _resDelArmed !== id){
    clearTimeout(_resDelTimer);
    var oldBtn = document.querySelector('[data-resdel="'+_resDelArmed+'"]');
    if(oldBtn){ oldBtn.dataset.armed=''; oldBtn.classList.remove('armed'); oldBtn.textContent='✕'; }
    _resDelTimer = null;
  }
  // 二次确认：第一次点后 3 秒内再点同一个 → 真删
  if(_resDelArmed === id){
    if(_resDelTimer) { clearTimeout(_resDelTimer); _resDelTimer = null; }
    _resDelArmed = null;
    RESEARCH = RESEARCH.filter(function(p){ return p.id !== id; });
    if(RES.cur === id) RES.cur = null;
    saveAll(); closeMo(); render(); toast('已删除','ok');
    return;
  }
  // 第一次点：进入待确认状态（避免 iOS 12 PWA 下 confirm() 经常失败）
  _resDelArmed = id;
  var el = btn || document.querySelector('[data-resdel="'+id+'"]');
  if(el && el.tagName){
    el.dataset.armed = '1';
    el.classList.add('armed');
    el.textContent = '确认删除';
  }
  toast('再点一次「确认删除」执行，3 秒内有效','warn');
  _resDelTimer = setTimeout(function(){
    if(_resDelArmed === id){
      _resDelArmed = null;
      if(el && el.dataset && el.dataset.armed === '1'){
        el.dataset.armed = '';
        el.classList.remove('armed');
        el.textContent = '✕';
      }
    }
    _resDelTimer = null;
  }, 3000);
}

var ASSESS_PROTOCOLS = [{"key": "ASD", "desc": "BCBA核心心法（必读）：\n1. 自闭症（ASD）的核心是社交沟通障碍与刻板行为。因此，“动机建立”优先于“教学内容”，“共同注意”优先于“语言表达”。\n2. 秉持“无错教学”，绝不能让孩子经历失败的挫折感。利用高动机物品（强化物）作为饵，将任务目标无限拆小（小步子原则）。\n3. 视觉支持是ASD孩子的“母语”。多运用视觉时间表、代币系统（Token Board）、图片交换系统（PECS），少用冗长的语言指令。\n4. 先建立配合（Rapport），再建立服从（Compliance），最后才是技能习得。对孩子自我刺激或逃避行为，采用“功能行为分析（FBA）”视角寻找原因。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师坐在角落，不主动干预，给孩子5分钟时间自由探索环境。", "observe": "刻板与兴趣：是否沉迷旋转车轮、排列积木等刻板行为？对周围人的存在是否有意识？ 情绪基线：是否易哭闹？是否有自伤或攻击行为？", "intervene": "识别强化物：观察他喜欢什么（可能是某种特定的玩具、光、声音），将其作为后续治疗的“黄金强化物”。此时不打扰他，只在旁边安静陪伴。"}, {"time": "0-5分钟 自然观察期", "steps": "试探性介入：治疗师在旁平行玩他喜欢的玩具，发出有趣的声音，试探他是否注意到或看向自己。", "observe": "共同注意：是否有眼神追随？是否会看向治疗师手中的东西？ 眼神接触：呼名（叫名字）时，有没有目光对视的倾向？", "intervene": "建立关系：如果他看了你一眼，立刻微笑，并轻轻递给他一件玩具，不要求他做任何事，让他觉得“有老师在场是安全的”。"}, {"time": "5-15分钟 结构化快测期", "steps": "基础配合与指令： 1. 呼名反应：“小明！”（等待3秒）。 2. 一步指令：“坐下”、“给我”（用他最爱的强化物诱导）。 3. 模仿能力：“拍手”（粗大）、“敲桌子”（物品操作）。", "observe": "服从性：指令是否服从？需要全辅还是独立完成？ 模仿能力：是否具备模仿意识？", "intervene": "定基线：如果完全不配合，不做任何指令训练，退回第一阶段——通过高频率强化建立“坐好就有奖励”的意识。用肢体全程辅助完成。"}, {"time": "5-15分钟 结构化快测期", "steps": "沟通意图（提要求）：把最爱的玩具车放进透明罐子里，等他想要时看他的反应。", "observe": "沟通方式：抢？拉大人的手？看着大人？（有无眼神互动）？发声音？用手指指？", "intervene": "建立“要我”的动机：只要他看你一眼或拉你的手，立刻把罐子给他（功能性沟通训练）。让他明白“用非语言动作可以换取想要的东西”。"}, {"time": "5-15分钟 结构化快测期", "steps": "基础认知：拿出两片同样的拼图，看能否完成配对；出示“西瓜”与“香蕉”卡片，测试基础辨识能力。", "observe": "认知基线：处于什么认知水平？（懂不懂配对？懂不懂物体恒存？）", "intervene": "引发兴趣：边做配对边加入夸张的表情和声音：“哇，找对啦！” 提高游戏的互动性。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：尝试玩“轮流推车”或“滚球”。治疗师先做，然后把球推给孩子，等待他推回来。", "observe": "社交互动：是否理解轮流？是否有竞争意识？ 假想游戏：会不会假装给娃娃喝水（象征性思维）？", "intervene": "突破兴趣点：如果孩子极度抗拒轮流，采用“抢断法”：他把球推给你，你立刻假装把球“掉在地上”，引发他的主动关注，再借机练习轮流。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：问家长：“孩子在什么时候情绪最容易崩溃？”“他对哪些声音、触觉或物品特别敏感（感官异常）？”“在家最常沉迷做什么？”", "observe": "前因行为分析（ABC）：了解孩子发脾气前的事件（前因），发脾气时的表现（行为），家长通常如何处理（结果）。", "intervene": "定家庭支持策略：告诉家长，在处理刻板行为时，不要硬碰硬，而是用“视觉时间表”告诉他接下来要做什么，提前预防崩溃。"}, {"time": "35-40分钟 收尾期", "steps": "操作：用代币板展示：完成最后一个小任务（如把球捡起来），就给予强力强化物（零食）。", "observe": "转换能力：能否接受课程结束？对“停止”是否极度抗拒？", "intervene": "平稳过渡：采用“预告制”，对孩子说“还有一分钟，然后我们吃好吃的”。在情绪没有崩溃前结束课程，保证他带着“快乐和成功”的记忆离开。"}], "stages": [{"name": "【第一阶段】建立配合与基础服从（地基）", "content": "精细教学顺序与具体内容： 安坐与静手：使用代币板（Token Board），坐好1秒给一个代币，集满5个换零食。 目光对视（呼名反应）：叫名字，眼睛看老师，马上给强化物。开始距离极近，后期拉远距离。 物品配对与归位：相同卡片配对，将物品放入对应容器（精炼操作技能）。 一步指令：“坐下”、“摸头”、“拍手”。全程使用肢体辅助，无错教学。 基础模仿：先粗大动作（拍手），再物品操作（敲鼓）。 BCBA教学回合实例（练：呼名回应与目光对视）：\n1. 建立动机（EO）：把零食拿在手里，挡在自己眼睛前。\n2. 指令（Sd）：叫名字“小明”。\n3. 辅助（Prompt）：如果没有对视，用零食在自己眼前晃动，全肢体辅助孩子转头直视你的眼睛。\n4. 反应（Response）：眼睛与治疗师对视1秒。\n5. 结果（Consequence）：立刻大声表扬“看我啦！太棒了！”并马上把零食递给他。重复10次，直到无需辅助（只要叫名字就看）。 🎮 治疗室游戏库（第一阶段）：“抓泡泡”（练习目光追随）、“积木倒倒乐”（练习因果操作）、代币换奖游戏（视觉强化极为清晰）。 🏠 家庭指导（第一阶段）：建立规律作息！\n1. 视觉时间表：把“洗手”、“吃饭”、“玩玩具”、“睡觉”做成图片贴在墙上，每次转换时指图片给他看（预防情绪崩溃）。\n2. 强化物管理：平时不要轻易给零食，把零食作为“完成任务”的奖励，建立“先做、后得”的意识。\n3. 夸张的正面反馈：孩子看你一眼、做一个指令，家长要表现出极大的惊喜！这比说一万句“坐好”都管用。"}, {"name": "【第二阶段】基础沟通与共同注意（启动核心能力）", "content": "精细教学顺序与具体内容： 功能性沟通训练（FCT）：用“拿卡片换物品”（初级PECS），过渡到发音、词语表达。 指物命名：孩子先会“指”，再说“看”。训练其主动指认想要的东西。 跟随手指指示：治疗师指着远处的小汽车，孩子能否顺着治疗师的手指方向看过去？（核心的共同注意能力）。 延宕满足：配合眼神，延迟2-3秒再给予强化物，增强沟通意图。 BCBA教学回合实例（练：提要求与替代行为）：\n1. 建立动机（EO）：把透明罐子放在他面前，里面是他最爱的小车，他够不着。\n2. 辅助（Prompt）：治疗师在后面，手把手辅助他抓起“小汽车的卡片”，递到治疗师手上。\n3. 反应（Response）：递卡片动作完成。\n4. 结果（Consequence）：立刻打开罐子给他小车（自然强化），同时辅助他说“车”。 🎮 治疗室游戏库（第二阶段）：“透明罐寻宝”、“找找看在哪里”（老师指哪里，孩子看哪里）、“我要我要”拿卡换物游戏。 🏠 家庭指导（第二阶段）：减少“过度代劳”！\n1. 制造沟通机会：吃饭时“不小心”忘记给他勺子。等他看你、拉你、或者“嗯”的时候，立刻给他，并教他说“要”。\n2. 图片交换（PECS初级）：在家里贴上几张常用物品图（水、饼干、玩具），他需要拿图片给你来换取。这是避免他哭闹的有效方式。"}, {"name": "【第三阶段】模仿、认知与基础语言", "content": "精细教学顺序与具体内容： 精细动作模仿：串珠子、按压手指。 口型模仿：对着镜子吹气、张大嘴、发“a”。 命名与理解：通过卡片，理解常见名词和动词。 简单两步指令：“先拍手，再跺脚”。循序渐进。 BCBA教学回合实例（练：精细动作模仿）：\n1. 指令（Sd）：治疗师拿起珠子，“串珠子”（示范）。\n2. 辅助（Prompt）：全肢体辅助，先握着他的手帮他把珠子穿过去。\n3. 反应（Response）：穿好一个珠子。\n4. 结果（Consequence）：立刻给强化物（代币/零食），并表扬“串得真棒！”慢慢减少手部力量干预，直到他独立完成。 🎮 治疗室游戏库（第三阶段）：“奇妙百宝箱”（摸出物品并命名）、“卡片小火车”（把卡片接龙摆放）、“大嘴河马喂食”（练习口型）。 🏠 家庭指导（第三阶段）：把认知教学融入生活！\n1. 分类整理：让孩子帮忙把袜子放进抽屉，把玩具小车放进盒子（建立分类概念）。\n2. 绘本阅读策略：指读绘本，强调“这是XX”，让孩子跟着摸一摸，闻一闻，强化多感官输入。\n3. 避免高语速指令：对ASD孩子说话要短，要慢，口型要夸张，必要时搭配手势。"}, {"name": "【第四阶段】社交互动、规则与心智解读", "content": "精细教学顺序与具体内容： 轮流与等待：玩轮流掷骰子或轮流推小车，用视觉提示（红线、红点）表示“等待区域”。 情绪认知：通过夸张的表情卡片，学习高兴、伤心、生气。 简单的假想游戏：给娃娃喂饭，开车带小动物去公园（象征性思维）。 简单对话：“你叫什么名字？”“我叫小明。”配合“他人视角”训练，如“我的积木和你不一样”。 BCBA教学回合实例（练：轮流等待）：\n1. 建立规则：玩具在中间，一个红垫子，一个蓝垫子。\n2. 指令（Sd）：治疗师指自己说“我的回合”，推车过去；然后指孩子说“你的回合”。\n3. 辅助（Prompt）：推过去后，把孩子的手按在垫子上，辅助他等待。\n4. 结果（Consequence）：孩子没有抢玩具，就立刻给他极大的夸赞和强化。如果他抢了，立即把玩具收走（自然惩罚：等待时间重置），并告诉他“没轮到”。 🎮 治疗室游戏库（第四阶段）：“木头人”（规则游戏）、“抢椅子”（社交竞争）、“情绪脸谱配对”、“医生和病人”（高级假想）。 🏠 家庭指导（第四阶段）：从“一对一”走向“小群体”！\n1. 创造同伴互动机会：每周邀请一个同伴来家里玩，玩最简单的互相传球游戏，家长在旁边引导，解决冲突。\n2. 过家家游戏：父母轮流扮演角色，让孩子充当导演，鼓励他发号施令。\n3. 情绪卡片贴墙：每天晚上指着一个情绪卡片问：“今天你是开心还是生气？”练习表达内心感受。"}, {"name": "【第五阶段】社交对话与高阶泛化", "content": "精细教学顺序与具体内容： 多轮对话：能进行5轮以上的简单日常对话（如今天做了什么）。 理解高阶社交规则：理解“开玩笑”、“讽刺”、“善意的谎言”。 同理心与换位思考：别人哭了，他能理解并递纸巾；别人想要某个玩具，他能理解并分享。 融入集体生活：能在幼儿园遵守集体指令，不扰乱课堂秩序，能独立完成常规任务。 BCBA教学回合实例（练：自我情绪表达）：\n1. 场景设定：孩子正在搭积木，突然被别的小朋友推倒了。\n2. 使用社会故事（Social Stories）：用绘本或图片，描述遇到这种事情该怎么说：“别推我，我会生气。”\n3. 角色扮演（Role Playing）：治疗师扮演推他积木的小朋友，孩子练习用语言表达拒绝（“我不喜欢这样”），成人立刻尊重他的表达（这是他最需要的社交支持）。\n4. 在真实生活场景中，一旦孩子用恰当方式表达情绪（而不是大发脾气），立刻给予极强强化物（拥抱、零食、口头肯定），将新技能牢牢泛化。 🎮 治疗室游戏库（第五阶段）：“小导演排话剧”、“模拟幼儿园课堂”、“情感角色互换”（你当爸爸妈妈，我当小孩）。 🏠 家庭指导（第五阶段）：多使用“视觉化故事”！\n1. 社交故事：拍下孩子玩滑梯或吃饭的照片，编写成简单的故事集，包括他遇到困难怎么办，帮助他提前预演社交场景。\n2. 家庭会议：每天睡前3分钟问问他：“今天遇到了什么事？开心吗？难过吗？”用绘本书和贴纸做心情记录。\n3. 教导概念是“内在的”：不要让他背社交规则，而是要在真实的生活情境中，随时讨论当下的感受，让他真正体验并理解。"}], "ages": [{"age": "1-2岁", "standard": "能回应呼名，能与大人来回玩弄同一个玩具（轮流基础），会指认想要的东西，会有意义地看大人的脸（共同注意）。", "focus": "重点训练：呼名眼神、目光追踪、模仿声音、基础指认。防止严重的逃避行为和哭闹。"}, {"age": "2-3岁", "standard": "能主动拉大人手表达需求；能模仿拍手、跺脚等大动作；能进行简单配对；懂得说一些单字或双叠词。", "focus": "重点训练：提要求（PECS初期）、物品配对、执行一步指令、建立安坐规范。"}, {"age": "3-4岁", "standard": "具备基础的回合式对话；能理解简单情绪（笑/哭）；能在指导下轮流；开始说短句（我要苹果）。", "focus": "重点训练：语言扩展（短语），简单的规则遵守，分享与轮流，降低刻板行为频率。"}, {"age": "4-5岁", "standard": "能假扮角色玩游戏，能在引导下和同龄人共处；能回答“什么、哪里”；开始表达羡慕、得意等复杂情绪。", "focus": "重点训练：心智解读（理解别人的想法），假想游戏，情绪管理和表达，融入普通班集体常规。"}, {"age": "5-6岁", "standard": "能进行多轮回合对话；理解基本逻辑推理；能识别他人的社交意图，能适应集体环境，有较为明显的同理心萌芽。", "focus": "重点训练：高阶心智（理解讽刺、玩笑），问题解决能力（遇到冲突怎么办），高度泛化到幼儿园和小学。"}]}, {"key": "口吃与流畅性障碍", "desc": "BCBA核心心法（必读）：\n1. 口吃绝不是“紧张”那么简单，而是**大脑语言处理系统和运动输出系统出现了节律断层**。治疗师绝不能对他说“别着急，想好了再说”，这反而会加重心理压力。\n2. 口吃的核心是**“预期性焦虑”与“逃避行为”**。BCBA认为，除了要训练他“说话流畅”，更核心的是要“无错化”：**允许他“轻松地不流畅”，而不是让他“费力地完美”。**\n3. **正向指令原则：** 当孩子口吃时，不要打断、不要代答、不要眉头紧锁。保持自然和从容，给他充足的时间。\n4. 我们的目标不是让他变成一个“永远不口吃”的人，而是变成一个**“即使口吃也能自信交流的人”**，这是BCBA行为主义干预的终极目标！", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师不强调说话，拿出一个有趣的玩具（如会打鼓的猴子）逗他，和他进行无压力的自然玩耍。", "observe": "语言节奏：他在自言自语或放松状态下口吃吗？ 逃避行为：有没有眨眼、摇头、跺脚、左顾右盼来逃避说话？", "intervene": "无压力对话：治疗师说话故意放慢速度，用夸张、温柔、平稳的语气，营造一个“安全说话”的氛围。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：让他唱一首熟悉的儿歌。比如“小兔子乖乖”。", "observe": "唱歌测评：唱歌时是否完全不口吃？（这是常见的现象，因为右脑参与了歌唱）。", "intervene": "建立自信：用歌唱培养流畅性，大声夸奖他的歌声，让他觉得“我说话也是可以的”。"}, {"time": "5-15分钟 结构化测查期 (评估口吃类型与重度)", "steps": "图片命名（单字/词语）： 拿出词卡，问他“这是什么？” 对话描述（长句）： 问他“你昨天去哪里玩了？”引导说长句子。", "observe": "核心性口吃：是否在起首音上重复（如“b-b-b-爸爸”）？是否延长音（如“ma——妈”）？是否卡住发不出音（Block）？ 频率：每100字出现多少次口吃？", "intervene": "记录触发点：判断在哪种场景下口吃最严重（着急时？新词时？还是被催促时？）。同步示范“缓慢且柔软”的发音方式。"}, {"time": "5-15分钟 结构化测查期 (评估口吃类型与重度)", "steps": "易感性检查：和他比赛快速说“西红柿”，或者同时说。", "observe": "运动失调：语速是不是特别快，导致漏字、语音混淆？（容易和口吃混淆）。", "intervene": "节奏干预：用手敲桌子打节拍，让他按照节拍缓慢说词，让他体会“有节律的语言是流畅的”。"}, {"time": "5-15分钟 结构化测查期 (评估口吃类型与重度)", "steps": "回避检查：观察他遇到难发音的词时，是不是不说了，或者换一个词。", "observe": "负面情绪：有没有因为结巴而感到害羞、捂脸？对说话是否有极度抗拒？", "intervene": "重构认知：立刻说：“这个字有点难，没关系，慢慢说。”不准批评，只肯定他“愿意说话”的行为。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：和他玩“缓慢节奏游戏”。治疗师用极慢的速度读绘本，让他接一句。", "observe": "模仿力：他能不能轻松地模仿治疗师慢速、柔和的发音模式？", "intervene": "引入“弹跳说话法”：让他像青蛙一样“蹦-蹦-蹦”地说话，降低语速，防止紧张导致肌肉紧绷。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：询问：“家人有口吃史吗？孩子是什么时候发现的？是不是最近变严重了？你们平时有没有打断他说话？”", "observe": "家庭环境：家长是否关注过度？是否经常催促？家里说话是否太快？", "intervene": "重塑家长反应：教家长：当孩子口吃时，保持微笑，抢着说“没事，我等你”，或者说“刚才这个字确实有点难，你说得很勇敢”。**严禁**说“别结巴”、“想好了再说”。"}, {"time": "35-40分钟 收尾期", "steps": "操作：以一首拍手歌结束治疗，告诉孩子：“你说话很好听，老师很喜欢听你说。”", "observe": "情绪状态：结束时的情绪是开心、放松，还是疲惫、紧张？", "intervene": "给足安全感：给他一个强化物，并告诉他，下次老师还在这里听他慢慢说。"}], "stages": [{"name": "【第一阶段】建立安全说话环境和心理抚慰", "content": "精细教学顺序与具体内容： 呼吸与放松训练：用深呼吸放松腹肌。躺下，肚子放个轻沙包，吸气时肚子鼓起，呼气时肚子瘪下。 “弹跳说话法”（轻度重复）：“我-我-我- 是-是-是- 小明”，允许他重复，但要求他轻柔、不卡壳。 减缓语速：治疗师做慢速示范，并用手在桌面上长划“一”字表示拖长音，让他跟着模仿。 录音回放与认同：录一段他轻松说话的声音，放给他听，让他发现“原来我也有说话流畅的时候”。 BCBA教学回合实例（练：安全环境与节律）：\n1. 设置氛围：治疗师拍着膝盖打节拍（慢速）。“我们来玩拍手歌！”\n2. 指令（Sd）：拍一次手，读一个词。拍，苹果；拍，香蕉。治疗师用最慢的速度唱出来。\n3. 反应：孩子跟着节奏缓慢说话。\n4. 结果：只要在节拍下说出词，立刻给予热烈的掌声和强化物（告诉他“节奏很好听”）。 🎮 治疗室游戏库（第一阶段）：“木头人绕口令”（慢慢说话）、“拍手节奏读绘本”、“深呼吸吹气球比赛”（放松）。 🏠 家庭指导（第一阶段）：家长去口腔科/耳鼻喉科确认无生理异常后，家长调整反应——每次孩子说话时，家长先喝口水或者点头，强行给自己“反应延迟”的机会。\n家长绝对不可以打断，可以说“宝贝，你慢慢说，妈妈在听”。每天保证10分钟的“慢速亲子时光”（妈妈慢速说话，带动孩子慢节奏交流）。"}, {"name": "【第二阶段】流畅性塑造（掌握轻松说话技巧）", "content": "精细教学顺序与具体内容： “轻启动”：训练开头的“母音轻触式发音”。先轻轻吸一口气，然后非常轻柔、平缓地发出第一个音（不要爆破）。 连续发音（延长音）：把说的第一个音故意拉长，让气流平缓流出（如：妈——妈—— ）。 韵律训练：用熟悉的旋律（如小星星）来训练长句子，将句子按音节唱出。 BCBA教学回合实例（练：轻启动）：\n1. 指令（Sd）：准备一张妈妈的照片，“看，这是什么？用最温柔的声音叫出来。”\n2. 辅助（Prompt）：治疗师用手势比划一个平滑的曲线，“用你的长音叫，妈——妈——”。\n3. 反应：孩子平稳地发出声音。\n4. 结果：立刻给予极大的强化，告诉他“你说话的声音像小河流水一样好听”，巩固这种说话模式。 🎮 治疗室游戏库（第二阶段）：“大怪兽语速”（故意放慢一百倍说话）、“唱歌接龙”、“长音拖火车”。 🏠 家庭指导（第二阶段）：家长要起到榜样作用！家长在家里放慢语速，拉长尾音说话。在日常生活（如吃饭时）玩“慢慢说”游戏，谁说得最慢谁赢。每天坚持5分钟。"}, {"name": "【第三阶段】减少逃避与脱敏训练（面对难发音的字）", "content": "精细教学顺序与具体内容： 确立“安全词”：找出他最害怕的词（比如“b”开头的词），先在安全和轻松的环境中，用弹跳法（b-b-b-宝）艰难地通过。 接纳口吃：告诉他，口吃没什么大不了，它只是“说话时有点小疙瘩”。教他，遇到疙瘩时，可以低头停一下，然后继续。 故意在游戏中制造“口吃机会”：治疗师自己也假装结巴一下，然后笑着说“哎呀，我也结巴了”，打破口吃的神秘感。 BCBA教学回合实例（练：脱敏）：\n1. 设置场景：孩子不喜欢说“飞机”，每次说都会卡住。\n2. 辅助：治疗师拿了一个飞机模型，说：“我们一起玩‘小飞机飞’！这里的词很难，我们用‘波浪音’说：飞——飞——飞机！”\n3. 反应：孩子吃力地、缓慢地说出“飞——飞——飞机”。\n4. 结果：立刻表扬他：“虽然那个词很难，但你勇敢地说出来了，还使用了我们的魔法速度，真厉害！奖励你玩飞机！”（通过奖励行为本身，而不是奖励完美发音，消除他的逃避心理）。 🎮 治疗室游戏库（第三阶段）：“挑战魔鬼词”（把难词打怪通关）、“模仿小乌龟”（遇到难词就放慢）、“结巴说话比赛”（谁结巴得最“可爱”）。 🏠 家庭指导（第三阶段）：当孩子出现“魔鬼词”卡壳时，家长要配合他一起使用“波浪音”。例如：“宝、宝、宝、宝、宝……贝”。家长示范正确的降噪方法。绝不能责怪他“怎么又说不好了”。"}, {"name": "【第四阶段】泛化与自信重建（迎接社会环境）", "content": "精细教学顺序与具体内容： 陌生环境练习：约上熟悉的朋友，在儿童乐园、超市里，用缓慢的语速向别人问路或买零食。 “同伴教育”：向孩子解释，有些人说话快，有些人说话慢，他只是“说话特别慢的人之一”，并训练他如何应对别人的嘲笑（微笑不说话，或者告诉老师）。 角色扮演：让他扮演“故事大王”或者老师，给我们上课，在充满掌控感的氛围里练习长句的流利度。 BCBA教学回合实例（练：泛化与人际处理）：\n1. 设置场景：和另一个小朋友进行1分钟的“玩具分享”。\n2. 辅助：治疗师在旁边鼓励他使用“慢慢说”的策略，并在他说完后，对小朋友说：“他刚才说得非常好，是不是？”\n3. 反应：孩子虽然有小口吃，但完成了沟通。\n4. 结果：治疗师悄悄在背后给他代币，并告诉他：“你刚才真勇敢，即使有点小疙瘩，也和好朋友玩得这么开心！”\n5. 老师心理课：如果遇到嘲笑，教他回答：“我是说话有点慢，但我很会玩这个玩具，你要一起玩吗？”（巧妙转移话题，建立自尊）。 🎮 治疗室游戏库（第四阶段）：“小小播音员”（在家人面前播报天气）、“商店购物”（在外面买一瓶水）、“我当小老师”。 🏠 家庭指导（第四阶段）：家长不要过度保护。带孩子去人多的地方，鼓励他说话。当他被嘲笑时，家长要做出淡定的榜样，告诉孩子：“他们不懂，不是你的错。”持续给予陪伴支持。"}], "ages": [{"age": "2-3岁", "standard": "会有词汇寻找困难或重复，常称为“发育性不流利”，通常只有2-3个月。", "focus": "除非反应强烈、脸部扭曲、家人焦虑，否则只需“等待和观察”，不需要直接训练！重点是缓解家长焦虑。"}, {"age": "3-4岁", "standard": "正常的句法快速增长期，可能出现整个句子的重复。", "focus": "若持续加重且伴眨眼、跺脚等紧张行为，建议开始语言环境干预（慢速示范，延缓反应）。"}, {"age": "4-5岁", "standard": "如果仍有明显的起始音重复（如 b-b-b-）且持续超过半年，则需要正式干预。", "focus": "重点干预：消除心理压力，建立慢节奏说话习惯。"}, {"age": "5-6岁", "standard": "此年龄段如果还存在明显口吃，需全面评估，且大概率会持续到成人期，必须进行系统的“流畅性塑造”治疗。", "focus": "重点干预：高度脱敏训练、面对同伴压力、重建自信，兼顾发音技巧。"}]}, {"key": "吞咽障碍与进食困难", "desc": "BCBA与ST联合核心心法（必读）：\n1. 生命安全第一：如果孩子存在严重呛咳、憋气、面色发紫等现象，必须立即停止训练，先由耳鼻喉科/消化科医生进行全面医学评估，排除器质性和病理性病变！\n2. 挑食的本质是“感觉防御”与“逃避行为”：孩子拒绝食物，不是因为“不听话”，而是因为食物带来的口感、气味让他感到极度不舒服（甚至恐惧）。强迫进食会严重破坏亲子关系并加重逃避行为。\n3. 绝对的“无错教学”：不设定“必须吃下去”的目标，目标极其微小化（从看一眼→摸一下→闻一下→舔一下），每一步成功都给强化物。绝对不允许给孩子贴“挑食”的负面标签。\n4. 阶梯式脱敏（食物梯度表）：按质地（糊状→碎末→软烂→固体）、颜色、气味、温度，对孩子进行小步子、渐进式的“食物暴露训练”，并伴随高强度的正向强化（如吃下一口，奖赏最喜欢的贴纸或允许玩一会儿）。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：让孩子在安全、安静的环境中坐着，家长拿一个平时他最喜欢的食物（不强迫，只是放在旁边）。", "observe": "进食姿势：坐姿是否端正？头部是否有后仰或前倾？ 口腔外围：嘴角是否长期有口水？是否有明显的嘴唇闭合不全？ 情绪状态：看到食物时是兴奋、回避（躲开、皱眉）还是大哭？", "intervene": "建立安全感：不急于喂食，先观察。如果孩子看着食物或靠近，立刻给一个极其夸张的微笑和语言鼓励（“宝宝看着啦！真棒！”），但不逼他吃。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：治疗师拿出一个质感柔软的硅胶牙胶或指套，轻轻放在孩子手心里，让他自己拿着玩。", "observe": "手部触觉：是否愿意触碰？是排斥（扔开）还是好奇地塞进嘴里？ 口腔触觉敏感度：愿意轻易含入异物吗？", "intervene": "无压力接触：如果他不排斥，让他自己探索放进嘴里（不强迫），并在旁边配合夸张的咀嚼动作，激发模仿。"}, {"time": "5-15分钟 结构化测查期 (口腔运动与感知)", "steps": "口腔内部触觉测试： 用干净的指套，轻轻按摩孩子的牙龈、脸颊内侧、舌头表面。", "observe": "防御反应：是否有干呕、紧闭嘴巴、头向后缩等强烈的抗拒行为？ 面颊肌肉：触摸时肌肉是否僵硬？（高肌张力）", "intervene": "触觉脱敏：如果强烈抗拒，退回到“仅触碰嘴唇”或“仅碰触脸颊”，用极其轻柔的力道，做完立即给大强化物（玩具），建立“触碰≠痛苦”的认知。"}, {"time": "5-15分钟 结构化测查期 (口腔运动与感知)", "steps": "下颌与舌头运动： 让他咬咬胶（牙胶）；拿出酸奶，让他用舌尖舔盘底。", "observe": "下颌力量：咬肌有无力量？咬胶是否能闭紧？ 舌部运动：舌头能否左右移动？能否主动前伸？", "intervene": "趣味练习：用“大鲨鱼咬咬”游戏，训练下颌力量；用“小猫舔酸奶”游戏，诱导舌头灵活运动，完成后给奖励。"}, {"time": "5-15分钟 结构化测查期 (口腔运动与感知)", "steps": "味觉与质地接受度测试： 用棉签分别蘸取一点点甜的、酸的、苦的液体，涂在舌尖上，观察反应。", "observe": "味觉偏好：是否对某种味道极度抗拒？ 吞咽观察：吞咽时是否有异常动作？颈部是否有明显肌肉用力？", "intervene": "安全第一原则：对于刺激性味道，只做极微量测试。如果强烈干呕，立刻停止，记录他的“高压食物名单”，作为后续训练的重点避开项。"}, {"time": "15-25分钟 实操试水期", "steps": "操作：用他平时最爱的零食（如纯白米糊或他喜欢的水果泥），用小勺喂一口；再尝试混入一点点新食物的泥。", "observe": "逃避行为分析（ABC）：他拒绝时，具体做了什么？（转头、推开、哭闹、含在嘴里不咽？） 口腔处理能力：咀嚼和吞咽的协调性怎么样？", "intervene": "设定极小目标：如果新食物连碰都不碰，只让他坐在旁边看我们吃一口，然后立刻奖励他一下。让他坐在餐椅上的行为被强化（远离食物厌恶），而不是强迫进食。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：询问家长：“孩子目前能吃哪些食物？有没有呛咳或呕吐史？一餐饭要喂多久？是不是追着喂？有没有强迫进食过？”", "observe": "喂养环境：是否在电视声中追喂？是否允许他自主抓握进食？ 营养摄入：目前的饮食结构是否单一？体重是否低于正常标准？", "intervene": "制定新的喂养规则：明确告知家长，“追喂”和“强迫”会加重挑食。要求家长下一步改变：固定吃饭时间和位置（儿童餐椅），不追喂，不吃就饿一餐，绝不给零食替代正餐（自然结果惩罚）。"}, {"time": "35-40分钟 收尾期", "steps": "操作：用一次极低难度的成功尝试收尾（比如只触碰一下熟悉的食物）。", "observe": "愉悦感建立：整个进食评估过程，孩子最终是带着满足还是惊恐结束的？", "intervene": "正向体验：给予最高级别的强化物，并明确告诉他“你今天做得太棒了！”哪怕他今天一口饭都没吃，但他“坐好”并“尝试摸了”勺子，就是巨大胜利。"}], "stages": [{"name": "【第一阶段】口腔感知觉脱敏（让脸部和口腔变得友好）", "content": "精细教学顺序与具体内容： 外部脱敏：用柔软的手指、毛刷、海绵轻轻抚摸脸颊、嘴唇周围、下巴。 内部脱敏：使用专业的指套刷，轻轻在牙龈、舌面、脸颊内侧摩擦（以不引起呕吐反应为准）。 材质引入：引入不同质地的牙胶（硬的、软的、带凸点的），让他咬。 气息与吸吮：用吸管喝浓稠的酸奶，利用吸吮动作锻炼口腔肌肉。 BCBA教学回合实例（练：脸颊脱敏）：\n1. 指令（Sd）：拿着毛绒玩具在脸颊蹭一下，笑着说：“轮到你啦！”\n2. 辅助（Prompt）：治疗师用指腹极其轻柔地在他右侧脸颊画圈。\n3. 反应（Response）：孩子没有躲避，接受触碰1秒。\n4. 结果（Consequence）：立刻把一个小玩具塞到他手里，大声夸奖“你让老师碰脸了，太勇敢了！”\n绝对禁止：强行掰开嘴巴塞东西！如果孩子躲避，停止操作，先建立安全感。 🎮 治疗室游戏库（第一阶段）：“小刷子洗澡”（刷脸）、“大口吃果泥”（假吃）、“大鲨鱼咬咬”（咬不同质地的牙胶）。 🏠 家庭指导（第一阶段）： 洗澡时的脱敏练习：给宝宝洗脸时，多揉揉脸颊和嘴巴周围，边洗边说“洗香香”，让孩子习惯被触碰。 用牙胶玩“咬咬”游戏：准备几种不同质地的牙胶，放在冰箱里冷藏一下，让他咬，缓解口腔过敏，增加口腔觉知。"}, {"name": "【第二阶段】接受新味道与新质地（大胆“混搭”）", "content": "精细教学顺序与具体内容： 微距暴露（看一眼/摸一下）：把新食物放在餐盘最边缘，只要他看一眼，就给奖励。 混合掺入法：将1%的新食物（极微小颗粒）混入他最喜欢且熟悉的食物（95%的旧食物）中，让他不知不觉地吃下去。 味道变化：由淡到浓，逐步改变质地（从糊状→碎末→软烂→颗粒）。 改变呈现方式：用有趣的动物模型把食物摆成小动物，或切成小星星，增加视觉吸引力。 BCBA教学回合实例（练：掺入法引入新食物）：\n1. 设置动机（EO）：孩子非常饿（或在饭点）。\n2. 指令（Sd）：在勺子里放99%的酸奶和1%的香蕉泥。\n3. 辅助（Prompt）：先带孩子看到含有旧食物的勺子，他自己张嘴吃下。\n4. 反应（Response）：吃下了新旧混合的食物（含有一点新味道）。\n5. 结果（Consequence）：立刻给极高强度的奖励（如平时吃不到的零食，或者允许玩3分钟手机），并夸张惊喜：“你吃下魔法香蕉了！太厉害了！” 🎮 治疗室游戏库（第二阶段）：“彩虹泥画画”（画在餐盘上），用食物蘸颜料（酱）吃，“给小宝宝喂饭”（假装喂娃娃）。 🏠 家庭指导（第二阶段）： 只负责准备，不负责塞：家长把食物摆上桌，不催促，不吃就算了，吃完就收走。只要孩子碰了新食物，哪怕只是闻一闻，都要立刻表扬“你愿意闻闻它了，真棒！” 轮流品尝：和孩子比赛“尝一口新的”，大人先夸张地吃一口，然后递给他一小口，他吃了就鼓掌。"}, {"name": "【第三阶段】口腔运动与咀嚼吞咽技能强化（建立进食能力）", "content": "精细教学顺序与具体内容： 下颌力量与咀嚼：从糊状过渡到碎末状，逐步增加硬度（如咬苹果条、胡萝卜条）。 舌头灵活性：练习将食物放在口腔左右两侧交替咀嚼，避免食物长时间堆积一侧。 嘴唇闭合与吸吮：使用会漏水的吸管，锻炼嘴唇的包绕力和吸吮能力。 安全吞咽姿势：保持头部中立（下巴微收），确保食道通畅，避免呛咳和误吸。 BCBA教学回合实例（练：咀嚼能力）：\n1. 指令（Sd）：拿出一根小孩专用的蔬菜棒，大声示范：“咔嚓咔嚓，大老虎吃菜！”放进自己嘴里嚼。\n2. 辅助（Prompt）：放进他的嘴里，同时用手轻轻托住他的下巴，帮助他用两侧牙齿咀嚼。\n3. 反应（Response）：孩子开始出现明显的咀嚼动作。\n4. 结果（Consequence）：立刻给强化物（贴纸），并现场表扬，让他体验“咬东西”是非常有成就感的事情。 🎮 治疗室游戏库（第三阶段）：“吹风机”（气息）、“吸管大力士”（吸酸奶比赛）、“大牙齿咬咬乐”（咬硬一点的食物）。 🏠 家庭指导（第三阶段）： 增加咀嚼机会：不要因为孩子吃得慢就永远给他打成泥。尝试给一些安全的条状食物（如蒸红薯条），让他自己拿着啃，以此锻炼咬肌。 保持口腔卫生：吃完后，用小牙刷轻轻刷舌面和牙齿，既是清洁也是进一步的口腔脱敏。"}, {"name": "【第四阶段】建立自主进食与餐桌常规（终极挑战）", "content": "精细教学顺序与具体内容： 固定进餐程序：建立“洗手→坐餐椅→系围兜→吃饭→漱口”的视觉流程卡。 自主进食能力：从手抓（拿块状食物），到使用勺子（先学握勺，再学舀），再到使用叉子。 接受“不喜欢”的食物：学习用语言表达“我不想吃”，用“自然结果”管理挑食（不吃就没有零食，只能等下一餐）。 全家上桌原则：让孩子和全家人一起吃饭，在餐桌上感知大人的咀嚼动作、交谈声音，自然的同伴示范是最好的促进剂。 BCBA教学回合实例（练：手抓进食与餐桌常规）：\n1. 设置环境：将孩子固定坐在餐椅上，面前放一个小碗，里面有切成条状的软烂胡萝卜和土豆。\n2. 辅助（Prompt）：治疗师先自己拿起一根塞进嘴里，夸张咀嚼；然后辅助孩子的手去抓一根，递到他自己嘴边。全程坐在椅子上，不追喂。\n3. 反应（Response）：孩子自己拿着吃了。或者他放下了，表示不吃了。\n4. 结果（Consequence）：孩子吃了，立刻鼓掌“你会自己吃了！”；孩子放下不吃，绝不强迫，大人平静吃完，直接收碗，绝对不给其他零食（自然结果惩罚）。 🎮 治疗室游戏库（第四阶段）：“外卖员送餐”（给娃娃送饭）、“上菜啦”（自己用勺子舀到盘子里）、“小帮厨”（帮忙揉面团、摘菜叶，增加对食物的亲密度）。 🏠 家庭指导（第四阶段）： 拒绝追喂：全家约定，吃饭时间20-30分钟。时间一到，就把饭收走。如果他饿了，那是他自己的选择，不能给饼干等零食充饥。偶尔饿一顿会让他明白规则，且不会影响长远健康。 尊重孩子的“进食权”：他说“吃饱了”，大人就要相信，并抱他下桌。给孩子足够的掌控感，是打破挑食心理防线的关键。"}], "ages": [{"age": "0-6个月", "standard": "吸吮吞咽反射协调，靠奶瓶或母乳喂养，舌部有蠕动样动作（吞咽全糊状物）。", "focus": "评估吸吮反射是否正常。若存在呛奶，需检查奶孔大小及喂养姿势（保持仰头，头高位）。"}, {"age": "6-12个月", "standard": "开始引入辅食（泥糊状），能在大人帮助下用杯子，开始用牙龈咬（咀嚼反射）。", "focus": "重点训练口腔感觉接受（除了奶以外的味道和质地），引入指套刷牙和婴儿牙胶脱敏。"}, {"age": "1-2岁", "standard": "能熟练吃碎末状食物，开始吃小块软烂食物。能自己拿饼干啃，会用手抓握食物送入口中。", "focus": "引入自主进食训练（手抓），锻炼下颌力量，允许吃得乱，不要过度干预。"}, {"age": "2-3岁", "standard": "能吃大部分家庭食物（如软饭、碎肉块），能自己用勺子舀饭（会漏），开始学用杯子喝水。", "focus": "重点是引入训练勺，固定就餐位置（餐椅），建立20-30分钟进餐界限。"}, {"age": "3-4岁", "standard": "能熟练用勺子，会自己用牙咬苹果等硬度适中的水果，开始接受略微粗糙的青菜口感。", "focus": "进行基础的“餐桌礼仪”训练（如吃饭不离开座位）。解决“吃了就吐”的问题（鼓励吞咽，不逼迫）。"}, {"age": "4-5岁及以上", "standard": "能用筷子（初步），饮食习惯基本定型，能接受大部分质地和味道的食物。", "focus": "如果是严重的神经性吞咽困难，需配合专业的吞咽康复手法；如果是顽固性挑食，需引入完整的“代币制”和“自然结果惩罚”，坚决切断零食供应。"}]}, {"key": "听力障碍", "desc": "BCBA核心心法（必读）：\n1. 听障儿童的语言康复，首要前提是“听得到”，其次才是“听得清”和“说得出”。未经精确验配（助听器或人工耳蜗）而强行进行语训，效果往往事倍功半[citation:1]。\n2. 听力训练有严格的进阶逻辑：从“听觉察知”（听声音有反应）到“听觉分辨”（能区分不同声音），再到“听觉识别”（能听懂是什么声音），最后到“听觉理解”（明白声音背后的含义）[citation:2][citation:5]。\n3. 坚持“多感法结合”：在听力训练初期，通过视觉（看图）、触觉（摸实物）等多感官与听觉同步，加深对声音意义的理解；后期减少视觉辅助，实现纯听觉的捕捉[citation:2]。\n4. 寓教于乐，生活康复：听障儿童的注意力极易疲劳，训练必须“玩中练、练中玩”[citation:3]。BCBA要求辅助要及时、强化要密集，并在自然家庭场景（如吃饭、出门）中持续泛化[citation:7][citation:10]。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师不主动搭话，在背后突然拍手或发出轻响，观察孩子是否回头寻找声源[citation:4][citation:11]。", "observe": "声音察知：对响声有反应吗？是否会转头寻找声源？ 设备佩戴：是否佩戴助听器或人工耳蜗？佩戴状况良好吗？", "intervene": "建立关系：无论他是否听到，只要他看过来，就用夸张表情迎接他。确保他佩戴好助听设备，并在安静环境下测试。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：拿出能发声的玩具（如小铃铛），在他视线内摇响，然后移到视线外再摇响。", "observe": "听觉定位：在视线外摇铃，他能否准确找到声音方向？ 听觉习惯：是否习惯利用残余听力去搜索声音？", "intervene": "听觉刺激输入：利用声音玩具做“声音游戏”，让他体验“听到声音就有好事发生”（如给玩具或零食）[citation:7]。"}, {"time": "5-15分钟 结构化快测期 (听觉辨别与口语基础)", "steps": "声音辨别测试： 准备两种截然不同的声音（如鼓声和铃声），治疗师分别敲击，让孩子指出是哪一个在响[citation:2]。", "observe": "听觉分辨：能区分完全不同的声音吗？ 基本指令：在无视觉提示下，能否完成“坐下”、“给我”等一步指令？", "intervene": "无错教学：如果听不清，治疗师将声音极度放大并配合手部动作，完成“听觉+视觉”的双通道输入[citation:2]。"}, {"time": "5-15分钟 结构化快测期 (听觉辨别与口语基础)", "steps": "语音辨别测试： 出示“妈妈”和“爸爸”的图片，治疗师大声说出其中一个词，看孩子能否指对。", "observe": "听觉识别：能否辨别熟悉的人声或称呼？ 借助唇读：是否高度依赖看嘴型来理解？", "intervene": "听觉优先原则：先遮挡嘴部，用纯听觉刺激让他辨认；如果失败，再露出嘴型作为辅助[citation:7]。"}, {"time": "5-15分钟 结构化快测期 (听觉辨别与口语基础)", "steps": "表达测试： 与他进行简单对话，“你几岁啦？”“这是什么？”观察他口部肌肉的运用与发音清晰度。", "observe": "语音产出：能发出清晰的音吗？是否存在发音部位错误、气息不足等构音问题[citation:1]？", "intervene": "同步口腔训练：发不准的音，立即辅助他摆好口型（如吹气、顶舌），让他摸喉部的震动感，通过触觉辅助发音。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：玩“听声抢玩具”游戏。治疗师先不出声，只做动作；再配合声音，看孩子对听觉信号的捕捉是否敏锐。", "observe": "听觉注意力：在嘈杂环境（模拟背景音）中，还能否准确捕捉到目标声音？", "intervene": "强化听觉敏感：建立“听到特定声音就行动”的规则，成功一次给一次强化，拉长听觉注意的持续时间。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：询问家长：“孩子佩戴设备的情况？每天佩戴多久？在家里会主动寻找声音吗？对别人的呼唤有反应吗？”", "observe": "听能管理：家长是否坚持全天佩戴？设备是否定期维护（电池、耳模）？ 家庭听力环境：家里说话距离是否太远？背景噪音是否太大？", "intervene": "强调听能管理：嘱咐家长必须坚持全天佩戴，并辅导家长如何在家做简单的“听放”训练[citation:3][citation:10]。"}, {"time": "35-40分钟 收尾期", "steps": "操作：鼓励他做最后一步（如把小玩具放回筐里），然后立刻给予强烈的强化物（零食）。", "observe": "沟通意愿：即使听不全，他是否仍愿意尝试用声音或眼神交流？", "intervene": "注入信心：告诉他“你听得很棒！”并给予最高级别的物质奖励，让他明白交流是件快乐的事。"}], "stages": [{"name": "【第一阶段】听觉察知与听觉习惯（建立声音意识）", "content": "精细教学顺序与具体内容： 觉察环境声：播放喇叭声、狗叫声等差异极大的声音，要求他在听到时做出反应（拍手、举手）。 感受声源：利用鼓、铃、沙锤等乐器，在他背后敲响，引导他寻找声源。 多感法结合：在听声音的同时，让他看图片、摸实物，理解“声音是有意义的”[citation:2]。 初步听放：听到声音信号，完成一个固定动作（如将积木放进筐里）。 BCBA教学回合实例（练：听觉察知）：\n1. 指令（Sd）：治疗师在桌下敲鼓，不说话。\n2. 辅助（Prompt）：敲响后，治疗师立刻夸张地做“听见啦”的表情，并辅助他拍手。\n3. 反应（Response）：孩子跟着拍手。\n4. 结果（Consequence）：立刻给强化物，并告诉他：“你听到鼓声啦，真棒！”绝不因没听到而惩罚，只要辅助够快，他就体验了成功。 🎮 治疗室游戏库（第一阶段）：“声音躲猫猫”、敲鼓抢糖果、“听声放物”等听放训练[citation:9]。 🏠 家庭指导（第一阶段）： 坚持设备佩戴：确保每天佩戴时长，养成良好的听觉习惯[citation:3][citation:10]。 家庭“听放”游戏：妈妈敲桌子，孩子听到就捏一下小鼻子。在自然气氛中训练声音觉察[citation:3]。"}, {"name": "【第二阶段】听觉分辨与辨听（分辨不同声音）", "content": "精细教学顺序与具体内容： 分辨音色：分辨鼓和铃等音色差异大的声音。 分辨声调：分辨相同发音但不同声调的字（如“妈”和“马”）。 分辨词语：在2-3个物品中，听辨出目标词[citation:2]。训练初期物品差异要大，逐渐减小。 遮盖视觉：逐渐减少视觉辅助（如不看口型），增加纯听觉辨听难度[citation:2]。 BCBA教学回合实例（练：词语辨听）：\n1. 指令（Sd）：桌上放“苹果”和“香蕉”卡片。治疗师说：“苹果。”\n2. 辅助（Prompt）：如果孩子犹豫，治疗师半遮口型重复一次，并用手势指向苹果。\n3. 反应（Response）：孩子正确指出卡片。\n4. 结果（Consequence）：立刻给予强化。随后撤除手势，单独靠听觉让他完成辨听。 🎮 治疗室游戏库（第二阶段）：“听声找图片”、“听声分类”、“我说你选”辨听游戏[citation:6]。 🏠 家庭指导（第二阶段）： “听觉优先”输入：吃饭时，先不给孩子看菜，问他“吃鱼还是吃肉？”让他先用耳朵分辨，再让他看[citation:7]。 多感官联动：引导孩子闻一闻、摸一摸再听一听，巩固对物品声音的认知[citation:7]。"}, {"name": "【第三阶段】听觉识别与语音产出（听懂并模仿说）", "content": "精细教学顺序与具体内容： 识别熟悉词：在没有视觉线索的情况下，能理解日常词语（如“喝水”、“出去”）。 构音与气息：通过吹纸条、吹泡泡训练气息，通过模仿口型纠正发音[citation:9]。 语音诱导：利用他已有听觉经验，诱导他模仿发出这个音（尽管音质可能不完美），只奖励“发声”行为，不急于纠正。 初步对话：训练他回答“叫什么名字”，练习简单的双向交流[citation:9]。 BCBA教学回合实例（练：语调识别）：\n1. 指令（Sd）：治疗师用夸张的高音（笑脸）说“上”，用低音（哭脸）说“下”。\n2. 辅助（Prompt）：引导他听清楚声调差异，并摸治疗师喉部的震动。\n3. 反应（Response）：他能正确区分“上”和“下”。\n4. 结果（Consequence）：表扬他耳朵灵敏，“你听到不一样了！”，强化他的听辨成就感。 🎮 治疗室游戏库（第三阶段）：“摸喉咙猜音”（感受震动）、“听指令做动作”、“读卡片模仿发音”[citation:9]。 🏠 家庭指导（第三阶段）： 不断地说，反复地说：在家庭中反复输入词汇，巩固听觉记忆[citation:9]。 创造良好语言环境：多带孩子接触不同人，鼓励他主动用声音打招呼，即使发音不清也先鼓励，慢慢纠正[citation:9]。"}, {"name": "【第四阶段】听觉理解与语言应用（理解大意、运用语言）", "content": "精细教学顺序与具体内容： 听短句理解：听“把红色的球给妈妈”等多项指令。 听故事理解：听简短的故事，回答“谁”、“在干什么”等问题。 自然对话：不仅听懂语音，还要透过语气、语速理解说话者的情绪和意图[citation:5]。 克服困难沟通：即便在嘈杂环境听不清，也要教他使用“请再说一遍”等策略，维护沟通自信[citation:9]。 BCBA教学回合实例（练：短句理解）：\n1. 指令（Sd）：治疗师不拿任何物品，直接说：“请帮老师把桌子上的杯子拿过来。”\n2. 辅助（Prompt）：如果未反应，辅助他看向桌子，并用口语强调“杯子”。\n3. 反应（Response）：完成指令。\n4. 结果（Consequence）：强化他听懂长句的能力，使他感受语言的便利性。 🎮 治疗室游戏库（第四阶段）：“你做我猜”、“情景模拟（超市买东西）”、“听故事找图片”[citation:7][citation:9]。 🏠 家庭指导（第四阶段）： 生活式康复：在“逛超市”时问“哪个是苹果？”训练他在自然情境中听懂并运用语言[citation:7]。 加强社交锻炼：有意识地让他多接触陌生人，培养语言交往能力[citation:9]。"}], "ages": [{"age": "0-3个月", "standard": "大声会惊动；听到父母声音会停止哭闹。", "focus": "发出咕咕声，看到父母微笑。"}, {"age": "4-6个月", "standard": "朝声音方向转头；关注有声音的玩具。", "focus": "咿呀声变得像语言；发出兴奋/沮丧声。"}, {"age": "7-12个月", "standard": "喜欢“躲猫猫”；能识别常见物品词汇[citation:11]。", "focus": "说出1-2个词（“爸爸”、“妈妈”），发音不一定清晰[citation:4]。"}, {"age": "1-2岁", "standard": "能指认身体部位；能执行一步指令；喜欢听儿歌[citation:4]。", "focus": "词汇量迅速增加；能说“要饼干”等双词句。"}, {"age": "2-3岁", "standard": "能听懂两步指令；理解“我的”、“你的”。", "focus": "词汇量继续爆发，能说出简单主谓宾句子。"}, {"age": "3岁+", "standard": "能理解简单故事，听懂因果关系。", "focus": "能进行多回合简单对话，发音基本清晰。"}]}, {"key": "构音障碍", "desc": "BCBA核心心法（必读）：\n1. 构音障碍不仅是“口部动作”问题，更是“感知觉”和“听觉辨别”问题。听不出，就发不准。\n2. 训练遵循顺序：口部感知与运动 -> 气流控制 -> 单音诱导 -> 音节拼合 -> 词语应用 -> 句子/生活泛化，严禁跳步。\n3. 采用“无错教学”。发音失败时，不批评，立即用压舌板、手指或勺子等物理辅助，帮他把音发对，并立刻给予强化。\n4. 把枯燥的“口肌训练”游戏化（如吹泡泡、咬饼干），保持孩子的动机。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：让孩子自己玩，治疗师观察其自发发音。家长可与孩子自然对话。", "observe": "自然发音：自言自语时，有没有出现目标音？常见错误音是替代、省略还是歪曲？ 口部状态：是否经常流涎？嘴巴是否常半张开（肌张力低的表现）？", "intervene": "建立关系：通过他喜欢的玩具互动。如果发错了音，千万不急着重演，先让孩子觉得课堂有趣。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：吹泡泡，“看，吹个大泡泡！”；或者递一根磨牙棒/咬咬胶给他吃。", "observe": "气息与咀嚼：能吹出泡泡吗（气息弱）？能用力咬吗（下颌力量弱）？吃东西时，舌头能左右移动吗？", "intervene": "寻找主强化物：如果孩子对吹泡泡无感，换咬饼干（容易诱导下颌力量训练）、酸奶（诱导舌前伸）。"}, {"time": "5-15分钟 结构化快测期 (口部运动+构音清晰度)", "steps": "口部运动（需发指令）： 1. 下颌：张大口、闭口。 2. 唇：撅嘴（u）、咧嘴（i）、闭唇。 3. 舌：伸舌、缩舌、左右舔嘴角、舌尖顶上门牙。", "observe": "配合度：能配合做口型吗？需要辅助（如用勺子压舌）？ 灵活性：舌头能否快速左右移动？", "intervene": "无错训练：做不到的，立即用手辅助（如辅助圆唇）。只要配合了，马上就给强化物，建立“做口型=有奖励”的快乐链接。"}, {"time": "5-15分钟 结构化快测期 (口部运动+构音清晰度)", "steps": "构音清晰度测试： 拿出“构音词表”的图片（从易到难：b, m, d, h -> p, t, g, k, n -> f, j, q, x -> l, z, s, r -> c, zh, ch, sh）。 问：“这是什么？”（哥哥、飞机、葡萄）。", "observe": "错误类型：是替代（如“哥哥”说成“得得”）、省略（“飞机”说成“飞一”）、还是歪曲？ 错误构音位置：记录孩子在哪些声母上出错（如舌尖音发不出来）。", "intervene": "音位诱导试探：如果“哥哥”发不出（g），立刻拿出一杯水，让他仰头喝水（利用舌头后缩），问“水是热的吗？好烫呀！热（re）~”。尝试诱导舌根音。"}, {"time": "5-15分钟 结构化快测期 (口部运动+构音清晰度)", "steps": "听觉辨别评估： 做出两张图片（如“兔”与“肚”），治疗师说：“请把‘肚’给我。”看孩子能不能听出区别，或者两张图都拿错。", "observe": "听觉识别：能不能分辨出“b”和“p”的区别？这是构音最容易被忽视的环节，听不出就仿说不出。", "intervene": "同步治疗：如果听不出，先练听。把耳朵捂起来听，或者把声音放大，将“水”和“嘴”的图片区分得更明显，加大音强对比。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：玩“送信”游戏，递给他卡片。玩到一半，故意发现某个发音，让他跟着发。", "observe": "泛化能力：在自然对答中，他的错误音是不是又出现了？能自我纠正吗？", "intervene": "强化正确音：在游戏中，他偶尔发对了一次，立刻惊喜地强化他：“哇！你说对啦！”，并给他最爱的小零食。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：了解家庭喂养史。问：“舌头系带短吗？”“是不是只吃软食，很少吃硬东西？”“家里人有没有说话不清楚的？”", "observe": "环境因素：是不是因为咀嚼少导致口腔肌肉弱？家人说话快不快？", "intervene": "调整家庭干预重点：如果咀嚼差，将“吃硬东西”作为首要家庭任务；如果口型错误，教家长做“口型游戏”。"}, {"time": "35-40分钟 收尾期", "steps": "操作：收教具，“下课啦，把卡片放进去”。给强强化物。", "observe": "转换能力：有没有因为发音困难引发逃避行为（不想说话）？", "intervene": "降低难度：如果孩子已经非常抗拒说话，这节课只要做到愿意模仿口型，就是巨大的胜利，要鼓励。"}], "stages": [{"name": "【第一阶段】口部感知与肌能训练（基础地基）", "content": "精细教学顺序与具体内容： 口部触觉刺激：用指套或按摩棒按摩牙龈、脸颊（脱敏）。用冰棒、酸甜食物刺激。 气息训练（吹）：吹纸条、吹乒乓球、吹羽毛（不同阻力）。 下颌骨力量：咬咬胶、咬大块苹果、咬磨牙棒。 唇部力量：圆唇（用吸管吸酸奶）、展唇（咧嘴做“i”）、闭唇（压舌板被夹住拔不出来）。 舌部力量：伸舌舔棒棒糖、舌尖顶脸颊、舌尖洗牙面。 BCBA教学回合实例（练：气息不足）：\n1. 指令（Sd）：递给孩子一张薄纸巾，示范吹气。“吹！”\n2. 辅助（Prompt）：先全辅助托住下巴；如气息弱，轻轻按压他腹部帮助气流呼出。\n3. 反应（Response）：纸巾轻微晃动。\n4. 结果（Consequence）：立刻给零食，夸张表扬“吹动了！”。保证孩子没有挫败感（纸巾吹动一点点就算胜利）。 🎮 治疗室游戏库（第一阶段）：“吹羽毛比赛”（比谁飞得远）、“咬饼干大比拼”、“吸管运小球”、“大怪物吃苹果”。 🏠 家庭指导（第一阶段）： 喂食训练：多吃质地硬的食物（苹果块、牛肉干、胡萝卜条），锻炼咬肌。 气息游戏：洗澡时玩水，让孩子用力吹水花；做饭时吹凉热汤。 家长禁忌：千万不要强迫孩子“张大嘴”，要用游戏引诱他，如学大老虎“嗷呜”张嘴。"}, {"name": "【第二阶段】音位诱导（攻克单音）", "content": "精细教学顺序与具体内容： 选择突破口：从最容易的声母开始（如b, m, d, h）。不要一开始就卡在“g、k”或“zh、ch、sh”上！ 视觉辅助与物理辅助：结合小镜子，对着镜子看口型。治疗师用小勺、压舌板直接摆放舌位。 音位诱导：如发“g”音，让孩子喝水仰头，利用重力迫使舌根抬起，顺势发出“ga”的声音，也就是“喝水音”。 从元音带辅音：如发“h”（呼气音），先发“a”，然后让他感受哈气的感觉（哈气）。 从动作过渡到发音：先做“打响舌”，再顺势“哒哒哒”，诱导舌尖音。 BCBA教学回合实例（练：诱导舌根音“g”）：\n1. 设置动机：拿他喜欢的“大公鸡”图片，或他想要的小玩具。\n2. 辅助：让他的头微微后仰，用压舌板把舌头中部往下压，同时治疗师发“ga”示范。\n3. 反应：孩子因为反射发出近似的“ga”音。\n4. 结果：立刻给他想要的玩具，并大声夸“你叫‘哥哥’啦！真棒！”。立即撤除压舌板，让他重复试一次。 🎮 治疗室游戏库（第二阶段）：“我是小司机”（练b,p）、“放鞭炮”（练p,噼里啪啦）、“学小动物叫”（鸭嘎嘎练g）、照镜子比赛。 🏠 家庭指导（第二阶段）： 生活口语强化：练“b”音时，每天让他多叫“爸爸”，练习“抱抱”。 家庭环境布置：家里买一套大嘴模型，用夸张表情做口型，让他模仿。 一定要“无错化”：孩子发错了不要嘲笑，家长亲自示范正确口型，可以允许孩子先用口型无声练习。"}, {"name": "【第三阶段】音位稳定与音节拼合（单音变词语）", "content": "精细教学顺序与具体内容： 单音节过渡：ga -> 大公鸡（三音节）-> 哥哥（双音节）。 同音双叠词训练：如“爸爸、妈妈、哥哥、婆婆”。叠词最容易建立词汇和发音的稳定性。 词语拼合（含目标音）：结合之前的词汇表，如“蛋糕、积木、青蛙、葡萄”。 长句子拼合：从词语到词组，“一个大苹果”、“小红花开了”。 BCBA教学回合实例（练：稳定“g”音）：\n1. 指令（Sd）：出示“哥哥”图片，“这是谁？”\n2. 辅助：如果发音不准，老师用手势提示（老师双手抬高指喉咙，示意舌根音）。\n3. 反应（Response）：正确说出“哥哥”。\n4. 结果（Consequence）：给予强力强化。用“随机轮换”的方法练（比如连续发5次，第6次换图片问）。确保90%以上的正确率后，再进入下一个音位。 🎮 治疗室游戏库（第三阶段）：“卡片蹦床”（跳一下，说一个词）、“钓鱼游戏”（钓起哪个卡片说哪个词）、“小厨师点菜”（我要吃“葡萄”）。 🏠 家庭指导（第三阶段）： 词卡游戏：每天挑10张目标音节卡片，和爸爸妈妈比赛说，抢答。 绘本指读：在绘本中寻找包含目标音的字，让孩子大声读出来，家长不做评判，只是示范。 耐心是第一要义：每一次发音的纠正，都伴随鼓励：“你刚刚那个‘哥’音很接近了！”"}, {"name": "【第四阶段】音位对比与听觉辨别（厘清混淆音）", "content": "精细教学顺序与具体内容： 最小对立词（Minimal Pairs）：“兔”与“肚”（t vs d），“胖”与“半”（p vs b），练习发音部位和清浊音的差别。 听辨先行：先让治疗师发“兔”和“肚”，让孩子指认图片。如果他分不清，绝对不能逼他说话，先练耳朵。 延长发音：治疗师夸张发音，增强听觉感知的差异（例如：将“p”的爆发音拖长）。 BCBA教学回合实例（练：区分送气音“p”和不送气音“b”）：\n1. 指令（Sd）：桌子上放“坡”和“波”两张卡片，治疗师拿出一张白纸放在嘴巴前。“看我吹纸，这是‘坡’（纸动了）。”\n2. 辅助：治疗师带着孩子的手放在嘴边，感受气流。\n3. 反应：让他把纸放在嘴边，自己发“坡”看纸有没有动。\n4. 结果：用纸动作为判断标准。纸动了就是送气音，加五角星奖励（代币系统）。集满5个换真强化物。 🎮 治疗室游戏库（第四阶段）：“神奇的手掌”（用手感受气流）、“猜猜我在说什么”（听音辨卡）、“爆米花”（练习p音时爆响）。 🏠 家庭指导（第四阶段）： 听声找物：在家里拿两张图（比如“狮子”和“柿子”），家长说一个词，让孩子拿。 借助道具感知：让孩子把卫生纸放在鼻子前，练习“h”音（哈气）。体会气流对发音的微小影响。"}, {"name": "【第五阶段】日常语流与生活泛化（最终目标）", "content": "精细教学顺序与具体内容： 短句语流：把目标音放入日常短句（如“我吃葡萄”、“哥哥喜欢小狗”）。 绕口令：简单绕口令（如“四是四，十是十”），注意不要急于求成，只要不掉音就是进步。 自然对话：在自由聊天中，提醒孩子关注发音；孩子说错时，治疗师用正确的句子复述一遍即可（重铸法），不强令其再次纠正。 BCBA教学回合实例（练：句子泛化）：\n1. 设置动机：孩子想喝酸奶。\n2. 辅助：治疗师递过酸奶，“你说‘我要喝酸奶’”。如果舌头卷不到位，先出声即可。\n3. 反应（Response）：孩子说出完整的句子（哪怕发音差一点）。\n4. 结果（Consequence）：立刻给他酸奶（自然强化）。核心是：沟通的成功比完美的发音更重要！ 🎮 治疗室游戏库（第五阶段）：“小主播播报”（念句子）、“角色扮演小卖部老板”、“讲故事比赛”。 🏠 家庭指导（第五阶段）：在孩子处于自然放松状态下，不要随时打断他纠正发音，保护他说话的欲望。每天花5分钟时间，一起说一段话，家长带头做榜样。"}], "ages": [{"age": "2.5-3岁", "standard": "b, m, d, h, 及单元音（a, o, e, i, u, ü）", "focus": "容易出现发音含糊，但能正确表达需求。如果此时连b/m都发不出，需重点排查听力或口部运动障碍。"}, {"age": "3-4岁", "standard": "p, t, g, k, n", "focus": "容易将送气音发成不送气音（如“兔子”说成“肚子”）。这是正常阶段，可重点练习气息（吹纸）。"}, {"age": "4-5岁", "standard": "f, j, q, x", "focus": "容易将舌面音发成舌尖音（如“鸡”说成“资”）。需要重点引导舌面抬起的动作，借助压舌板辅助。"}, {"age": "5-6岁", "standard": "l, z, s, r，以及 c, zh, ch, sh", "focus": "平舌音和翘舌音是最难掌握的，常有“十四”说成“四四”的情况。此阶段必须通过大量的听觉辨别（听音）和舌位摆放练习来突破。如果6岁后仍清晰度极低，需全面排查口腔结构。"}]}, {"key": "注意力不集中", "desc": "BCBA核心心法（必读）：\n1. 区分“不能”与“不为”：ADHD孩子有时是真的控制不住自己（神经发育因素），而不是故意捣乱。必须降低对“安坐”和“安静”的绝对期望值，训练的核心是“延长专注时间”和“冲动控制”。\n2. 高频强化是生命线：普通孩子10秒强化一次，ADHD孩子需要1-2秒强化一次。做对马上给，等不了。\n3. 环境管理重于言语说教：尽可能减少桌面干扰物（只留当前教具），物理隔离（坐在角落或挡板内），避免指令过长过杂。\n4. 运用“代币系统”和“普雷马克原理”（先做必须做的，再做喜欢做的）：用视觉化的奖励吸引他，比如“做完这个，马上玩小车”。\n5. 绝对禁止打骂和羞辱：这不仅无效，还会引发严重的对立违抗（ODD）。接纳他的多动，用“高密度的小步子”来“磨”他的专注力。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师不主动发指令，坐在一旁观察孩子进门后的活动状态。", "observe": "多动程度：是跑来跑去，还是小动作不断？能安静坐多久？ 冲动性：是否未经允许就翻看桌上的东西、抢治疗师的教具？ 注意广度：对单一玩具的持续专注时间是多长（几秒）？", "intervene": "寻找超级强化物：找出能瞬间吸引他的东西（例如动态的发光玩具、很特别的零食、能让他动起来的玩具），准备好随时奖励。此时不急于管教，先做观察。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：治疗师拿着一个会发光的弹力球，在他面前晃一下，“看这里！接住！”轻轻丢给他。", "observe": "反应速度与控制力：是否能接住？会不会砸回来？他接住后能不能看着你，等待下一步指令？", "intervene": "建立互动规则：如果他把球扔飞了，不要批评，马上跑过去捡起来递给他，说“给老师！”（建立“还给我”的概念），接到球后立刻给零食强化。"}, {"time": "5-15分钟 结构化快测期 (考验任务维持力)", "steps": "任务坚持度测试： 1. 一步指令：“坐下”、“把积木给我”。 2. 两步指令：“先拍手，再跺脚”。 3. 简单配对：给出一套积木让他分颜色。", "observe": "操作持续性：能独立完成几步？在做第二步时是不是忘了第一步？ 注意切换：是不是非常容易受外界声音或环境干扰而中断？ 冲动错误：是不是经常指令还没听完，就抢着做了（做错）？", "intervene": "立即降低任务难度：如果两步指令失败，退回一步指令。做任何一步都立刻强化。用“座位图”或“红绿灯”视觉提示物提醒他注意。一旦他犯错，马上辅助，不让他体验失败感。"}, {"time": "5-15分钟 结构化快测期 (考验任务维持力)", "steps": "延迟满足测试：拿出他喜欢的零食，放在透明盒子里。告诉他要等到“数到3”或者“拼好一块拼图”才能吃。", "observe": "冲动控制力：能忍多久？是马上抢，还是能听指令等一下？", "intervene": "初级代币系统尝试：给一个“代币”（一枚硬币），告诉他“拿着，数到3就可以换”。只要他坚持了2秒，马上数到3并夸奖他，完成第一次成功等待。"}, {"time": "5-15分钟 结构化快测期 (考验任务维持力)", "steps": "言语指令反应：给他一个简单的多步骤任务（比如去拿玩具车，然后放到箱子里）。", "observe": "指令处理：是否能理解并执行长句指令？还是只听到了后半句？", "intervene": "简化指令：把长句拆为两个短句。先“拿车”，再“放箱子”。每次成功后，给予极大的鼓励！"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：玩“轮流搭积木”或“轮流滚球”。必须等他，不准抢。", "observe": "遵守轮流规则：是否能克制住自己想插队的冲动？等待时候的表现是什么？（手到处乱摸？还是大声喊叫？）", "intervene": "进行“自我控制”训练：利用“手放膝盖”的视觉提示牌。等到他时，立刻让他操作，并给予双重奖励（物质+夸奖）。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：了解在家的行为模式。问：“写作业能坐住吗？”“是不是特别容易发脾气？”“在幼儿园是不是经常被告状？”", "observe": "执行功能评估：是否极度缺乏条理性？东西总是到处乱扔？对时间概念是否极差？", "intervene": "调整家庭管理策略：要求家长每天必须安排“高质量亲子游戏”时间，而且必须做到“少批评、多夸奖孩子安静的时刻”。布置任务：在家给孩子建立“强化版代币板”（集星星换奖品）。"}, {"time": "35-40分钟 收尾期", "steps": "操作：指令他“把小汽车放回盒子里，我们就下课了。”", "observe": "指令执行力：能不能在干扰下完成最后的指令？", "intervene": "积极告别：只要他完成了，哪怕动作很慢，立刻给予最高级别的强化，并告诉他“今天你表现超级棒！下次还来玩！”"}], "stages": [{"name": "【第一阶段】建立安坐与基础注意力（地基）", "content": "精细教学顺序与具体内容： 环境“断舍离”：桌面只放当前需要的1个玩具，其他全部收走。 安坐训练：坐好2秒，立刻给大强化物（安坐标准极低），逐步延长至30秒。 视觉注视：呼唤名字，看老师1秒，奖励。 高频重复简单指令：来回练习“给我”、“放”、“拍手”。 BCBA教学回合实例（练：安坐与注意唤起）：\n1. 指令（Sd）：拿着他最喜欢的零食放在眼前，“看老师”。\n2. 辅助（Prompt）：如果孩子动来动去，用轻抚肩膀使他转向自己（轻辅助）；如果仍不看，将零食放在额头上方吸引视线。\n3. 反应（Response）：眼神接触1秒。\n4. 结果（Consequence）：立刻把零食放进他嘴里，并夸张地惊呼“你有看老师！吃吧！”\n关键点：这个过程不能让他觉得枯燥。ADHD孩子在初期，配合时间可能只有几秒，那么治疗师就要在这几秒内完成教学闭环。 🎮 治疗室游戏库（第一阶段）：“抢拍铃鼓”（听到指令立刻拍，练听觉注意）、“夺宝奇兵”（视觉追踪玩具）、“木头人”（你能站几秒）。 🏠 家庭指导（第一阶段）： 桌面清理：在家写作业前，桌面只留这一科的作业本和笔，其他全部收掉。设立一个“屏蔽”区域（如小板凳固定位置）。 “一分钟”专注法：要求孩子画画或看书只看1分钟（用沙漏计时），只要做到了马上给奖励，然后休息2分钟。慢慢增加时间。 避免长篇大论：指令必须短！比如“坐好”、“放好”、“给我”，说多了孩子根本听不见。"}, {"name": "【第二阶段】延长任务时间与代币系统介入", "content": "精细教学顺序与具体内容： 代币板（Token Board）启动：连续完成3个任务（配对、指认、指令），每完成一个，奖励一个代币，集满3个兑换大奖励。 延长操作时间：从每次专注1分钟，拉长到3分钟，再到5分钟。 规则内的小动作：允许他手里捏一个“小捏捏”或咬咬胶（满足他多动的小动作需求，但不影响听讲）。 位置强化：让他坐在靠近老师的“主位”，减少他逃避的距离。 BCBA教学回合实例（练：代币与持续专注）：\n1. 指令（Sd）：拿出代币板（上面有3个空格）：“我们做任务啦！做完这个，贴一个小星星！”\n2. 辅助（Prompt）：给出一个最简单的配对任务（如两张一样的卡片），辅助他放好。\n3. 反应（Response）：完成任务。\n4. 结果（Consequence）：贴上一颗星星。“太棒了！再做一个就换大奖励！”\n5. 依次完成三个后，立刻兑换（如玩3分钟小车）！注意：代币系统的初期，标准要低，强化物要极度直接！ 🎮 治疗室游戏库（第二阶段）：“收玩具比赛”（边收拾边找指定的颜色）、“钓鱼达人”（钓起5条鱼，坚持训练专注力）、“我看见了什么”（记忆卡片）。 🏠 家庭指导（第二阶段）： 制定每日“任务清单”：用图片画出今天的任务（洗手、穿鞋、读绘本），每完成一个打勾，集满换电视时间。 设置“最优先”规则：告诉孩子：“先做任务，后玩”。不能让他先看动画片再做作业，否则他更坐不住。 允许“多动”学习：允许他站着看书，或者边走边背诗。只要他的脑袋在听，不要强行按头让他坐下来，那会适得其反。"}, {"name": "【第三阶段】冲动控制与延迟满足（攻克难点）", "content": "精细教学顺序与具体内容： 轮流与等待：使用视觉计时器（如沙漏或倒计时App），让他明确看到“还有多久轮到我”。 红灯停绿灯行：通过规则游戏，练习“当发号施令者说停时，身体要立刻停住”。 延迟满足训练：从“等待3秒”开始，慢慢提高至“等待30秒”、“等待1分钟”，并在等待期间给他发“代币”。 自我监督：完成一个任务后，问他“你刚才做对了吗？”（引导他进行自我评估）。 BCBA教学回合实例（练：抗冲动与轮流）：\n1. 设置规则：两人各选一个颜色的大积木，轮流往上搭。\n2. 指令（Sd）：治疗师搭了一个，指着孩子说：“你的回合。”\n3. 辅助（Prompt）：如果孩子直接抢，治疗师用手挡住，同时另一只手辅助孩子退后坐下，并给他一个代币：“忍耐住了，拿一个代币！”\n4. 反应（Response）：等待2秒后，开始搭积木。\n5. 结果（Consequence）：让他成功搭上积木，并极力夸奖！反复练习，逐渐拉长等待时间。 🎮 治疗室游戏库（第三阶段）：“123木头人”、“抢椅子”（必须等音乐停）、“红绿灯游戏”（红灯停，绿灯行）、“神奇遥控器”（按暂停键时他要变木头）。 🏠 家庭指导（第三阶段）： 无法忍耐时提供替代方案：当他大叫时，告诉他“你可以捏一捏手里的软球，但不能大声叫！”（提供合适的宣泄出口）。 建立“暂时隔离区”：如果孩子因为抢玩具而发脾气，带他到一个小角落（安全地带）坐2分钟（或按年龄加1分钟），时间到了再出来，绝不妥协。 少用“不要”，多用“要”：不要喊“别跑”，要引导“我们走过来”。指令越具体，他越容易执行。"}, {"name": "【第四阶段】自我监控与高阶行为管理", "content": "精细教学顺序与具体内容： 自我监控表：孩子自己记录自己是否完成任务（例如画笑脸或打叉），治疗师/家长负责监督，用表格建立规则感。 面对挫折：在任务中故意制造一点小困难，训练他的情绪调节能力。如果他不耐烦，教他表达“我累了，我需要休息”。 解决多步骤问题：将长任务切分成小段，每段完成后自我鼓励。 融入集体：引入同伴，玩两两合作游戏，利用同伴压力促使他保持专注，提升社交规则感。 BCBA教学回合实例（练：自我监督与挫折承受）：\n1. 指令（Sd）：给一个拼图任务，故意给错一块（比如拼图少了一块）。\n2. 反应（Response）：孩子因为找不到合适的拼图而烦躁想放弃。\n3. 辅助（Prompt）：老师马上引导，“是不是很难？跟老师说‘老师请帮我’”。\n4. 结果（Consequence）：当孩子用语言求助后，老师立刻帮他从盒子里找出隐藏的最后一块，帮助他完成拼图，并给予极大的赞扬：“虽然没有很难，但你学会请求帮忙了，这比拼图更棒！”\n核心目标：将“发脾气”的行为，替换为“语言求助”的行为。 🎮 治疗室游戏库（第四阶段）：“完成作业通关卡”（长任务拆分）、“老师说了算”（跟随指令按步骤完成小项目）、“双人合作运球”（需两人配合保持专注）。 🏠 家庭指导（第四阶段）： 建立家庭公约：家长和孩子一起商量每天的时间安排，并坚持执行，让孩子做“小监督员”帮助提醒家人。 情绪冷静角：在家设立一个“安全岛”，当他控制不住脾气时，让他去那里冷静，事后要鼓励他主动回来承认错误。 家长耐心提醒：对ADHD儿童，遗忘和半途而废是常态，家长要心如止水，接受孩子进步慢，多把注意力放在“孩子做得好的瞬间”，而不是只盯着他的问题。鼓励优于惩罚！"}], "ages": [{"age": "0-1岁", "standard": "注意力极短暂，对移动、声音强烈好奇，专注力几秒到十几秒。", "focus": "追视差，对呼唤反应少。干预重点：利用强感官刺激（光、声音、食物）训练对视和短暂追踪。"}, {"age": "1-2岁", "standard": "对有兴趣的物体可持续注意1-2分钟，容易被外界声音打断（主动注意萌芽）。", "focus": "坐不住，破坏性强。干预重点：桌面清理，采用“一分钟专注法”，高频强化。"}, {"age": "2-3岁", "standard": "单一任务维持约3-5分钟，能完成简单的两步指令，开始有初步的自我控制。", "focus": "极易分心，常不服从指令。干预重点：引入代币板（贴纸），建立简单规则。"}, {"age": "3-4岁", "standard": "对感兴趣的任务可持续约10分钟，能安静听故事，开始执行多步骤任务，能玩规则游戏。", "focus": "常在课堂上跑来跑去。干预重点：强化轮流和等待，利用计沙漏训练冲刺时间段。"}, {"age": "4-5岁", "standard": "有效注意力约12-15分钟，能遵守多人游戏规则，能完成简单拼图和涂色。", "focus": "容易中途放弃，做事没长性。干预重点：开始引入自我监控表，鼓励语言求助。"}, {"age": "5-6岁", "standard": "能维持集中注意力15-20分钟，能控制冲动，具备一定的问题解决能力。", "focus": "写作业极度拖延。干预重点：建立家庭公约，拆分长任务（如把写10个字拆成写2个字休息一下），辅助他建立学习自信心。"}]}, {"key": "社交语用障碍", "desc": "BCBA核心心法（必读）：\n1. 语用障碍≠不会说话。他们的词汇、语法通常很好（甚至很“学霸”），但在真实社交中却“格格不入”。他们常听不懂反话，不会看人脸色，容易长篇大论自顾自讲，不注意对方的反应。\n2. BCBA视角：社交语用能力本质上是“可被强化的社会行为”。我们要做的是将“察言观色”拆解为极其具体的行为（如：别人皱眉时要停止说话），并用强化物去奖励这些行为。\n3. 不要强行“共情”：对他们说“你应该感到难过”是无效的。要用“行为主义”的语言：“他哭了，你递给他纸巾，他就会觉得你很好，下次还会找你玩。”（用因果关系和结果导向去教）。\n4. “脚本”与“角色扮演”是首选武器：模拟真实场景，通过多次反复扮演，把社交规则转化成肌肉记忆。绝对禁止在真实社交现场大声指责他们的“错误”，那只会导致社交焦虑和逃避。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师和孩子进行无压力的一起玩（比如拼图），观察他会如何和你交流。", "observe": "互动发起：会主动和你说话吗？还是等你先开口？ 目光接触：说话时会看着你的眼睛吗？还是盯着地板或你的衣服？ 身体距离：是否站得极近，或者躲在远处根本不敢靠近？", "intervene": "建立舒适感：如果他靠近你，你微笑着点头；如果他离得远，你主动把玩具推过去。保持眼神平和，不要施加压力。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：治疗师故意在玩玩具时“犯错”（比如假装把积木搭倒了），观察他的反应。", "observe": "共同注意与分享：会不会看着你笑，指着说“倒了”？会不会主动分享他看到的趣事？", "intervene": "捕捉互动瞬间：如果他看了你一眼，或者笑了起来，立刻夸张地回应他“哇！倒了！”，诱导他进入互动状态。"}, {"time": "5-15分钟 结构化测查期 (专门测语用，不测词汇！)", "steps": "轮流对话测试：治疗师抛出一个话题：“我昨天去动物园了，看到了大象，你最喜欢什么动物？”然后观察他是否能接着你的话题说。", "observe": "话题维持：是否能围绕当前话题对话，还是立刻跳到他自己最沉迷的话题（如变形金刚）？ 倾听回应：能不能对你的问题做出相应的回答？", "intervene": "侧向引导：如果他跑题了，立刻将话题拉回：“我也喜欢大象，但是昨天我还看到猴子了，你猜它在干嘛？”用这种半结构化提问来测试他能否跟上你的节奏。"}, {"time": "5-15分钟 结构化测查期 (专门测语用，不测词汇！)", "steps": "非言语沟通测试：治疗师不说话，仅仅用夸张的表情（皱眉、叹气、微笑）表达态度，看他能不能察觉。", "observe": "面部表情解读：能识别他人的喜怒哀乐吗？会不会根据别人不高兴的表情调整自己的行为（例如停止吵闹）？", "intervene": "即时训练：当他犯错时（比如拿走了你的笔），你立刻皱眉不说话。看他能不能察觉到。如果他察觉到了，立刻给他正向强化：“你看到我不高兴了，你停下来了，真棒！”"}, {"time": "5-15分钟 结构化测查期 (专门测语用，不测词汇！)", "steps": "比喻与反话测试：对他说：“你真是个捣蛋鬼！”（用开玩笑的语气），然后马上笑着摸摸他的头。问他：“老师在夸你还是批评你？”", "observe": "语用误解：是否对“反话、讽刺、隐喻”非常刻板？比如听到“你真坏”，会不会立刻大哭或者生气？", "intervene": "辅助解释：立刻告诉他：“老师笑的时候说坏，是和你开玩笑！”多举几个例子，帮他突破语用瓶颈。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：玩需要高度配合的双人游戏（比如两人三足、或者互相传球）。", "observe": "合作能力：是否懂配合？会不会只顾自己赢而破坏规则？是否能接纳同伴的意见？", "intervene": "立标杆：在游戏里强化“当别人说话时，你要停下来听”，只要他做到了，立刻奖励。（正向强化）"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：询问家长：“他是不是经常和小朋友玩不到一块儿？是不是总是不懂别人的意思惹别人生气？在家是不是整天叨叨不停的说话，但完全不听别人的话？”", "observe": "社交功能受损情况：被拒绝的频率高吗？在学校有没有好朋友？他是否因此变得自卑或易怒？", "intervene": "教家长避坑：嘱咐家长，当孩子跑题或不会聊天时，不要当面揭穿他“你怎么又不懂规矩了”，而是回家后和他“复盘”，告诉他下次这样说会更好。"}, {"time": "35-40分钟 收尾期", "steps": "操作：让他帮忙把玩具收起来，并说“谢谢你帮老师收玩具，欢迎下次再来找我玩”。", "observe": "礼貌应对：能否回应“再见”和告别仪式？会不会跟随大人的指示结束游戏？", "intervene": "制造美好回忆：强化他，让他带着愉快的心情离开（他需要体验到：社交是一件愉快的事情，哪怕一开始不懂得怎么配合）。"}], "stages": [{"name": "【第一阶段】共同注意与情感解读（基础地基）", "content": "精细教学顺序与具体内容： 目光追踪与共同注意：练习跟着别人的视线走（“看我！看那边！哇！”）。 认识基础表情：识别人物照片上的喜怒哀乐（用夸张的真人照片和简笔画）。 动作配合：当别人伸手时，知道递东西过去；当别人招手时，知道靠近。 情感体验：用实物场景直观教学：“你摔倒了会疼，他摔倒了也会疼。”提升同理心。 BCBA教学回合实例（练：识别表情）：\n1. 指令（Sd）：拿出两张大图，一张笑，一张哭。“指出哪个是开心的？”\n2. 辅助（Prompt）：如果孩子选错，老师用手指指着笑的人的脸颊说：“嘴巴弯弯的是开心的，他也想要吃糖。”\n3. 反应（Response）：正确指出笑的表情。\n4. 结果（Consequence）：立刻给一个大大的笑颜拥抱，或者给他一个他喜欢的零食，并夸他“你指对了开心的表情，这也让你很开心对不对！” 🎮 治疗室游戏库（第一阶段）：“表情传真机”（妈妈做表情，孩子模仿）、“照镜子”（模仿对方动作）、“找不同表情卡片”。 🏠 家庭指导（第一阶段）：在家看动画片时暂停，问他：“小猪佩奇现在怎么了？是不是开心？”引发他对他人情绪的思考和关注。"}, {"name": "【第二阶段】会话规则建立（发起、维持与轮流）", "content": "精细教学顺序与具体内容： “说话球”规则：拿到球的人说话，说完了把球传给下一个人。谁没拿到球谁就闭嘴听。 对答练习：教他怎么回应别人。比如别人问：“你好吗？”要学会回答：“我很好，你呢？”（双向对答）。 话题搭桥：在别人说话时，必须至少回应一句话（“哦，原来是这样啊。”），才能转入自己的话题。 恰当的请求：想要别人的玩具，一定要说“我可以借一下吗？”得到允许后再说“谢谢”。 BCBA教学回合实例（练：轮流说话）：\n1. 建立动机（EO）：准备两个孩子最爱的贴纸。\n2. 指令（Sd）：拿出一个彩色毛绒球：“我们现在玩说话球。球给谁，谁才可以说。”治疗师拿到球说：“我喜欢吃苹果，你呢？”（递球）。\n3. 辅助（Prompt）：如果孩子还没接过球就想抢话，老师轻轻挡住他的嘴：“还没轮到你，轮到我说。我开始了……”然后迅速把球递给他。\n4. 反应（Response）：孩子接过球，说出他想说的话。\n5. 结果（Consequence）：立刻夸奖“你等到球了才说话，说得真好！给你贴纸奖励！” 🎮 治疗室游戏库（第二阶段）：“神秘话筒采访”（轮流问问题）、“传话游戏”和“我发指令你执行”。 🏠 家庭指导（第二阶段）：每天睡前设立“聊天时间”。在3-5分钟内，轮流说今天发生的一件小事。孩子说话时，家长认真听；家长说话时，要求孩子必须认真听完并点头，然后才能说。建立严格的“听-说”闭环。"}, {"name": "【第三阶段】理解隐含意义与语境适应（攻克高级语用）", "content": "精细教学顺序与具体内容： 理解比喻和双关：教学“心里像揣着一只小兔子”（形容紧张）。先解释真实场景，再比喻。 听懂“弦外之音”：教他们听懂委婉的拒绝（比如别人说“我很忙”，意思就是“不要打扰我”）。 识别讽刺与玩笑：用角色扮演明确告诉孩子：“当别人笑着说‘你真笨’时，有时是在开玩笑，有时是真的生气，你要看他当时是不是皱着眉。” 调整语域：学会对老师用敬语，对小朋友用简单口语，对长辈用礼貌用语。（如：“我要喝水”比“给我水”更得体）。 BCBA教学回合实例（练：理解暗示与委婉拒绝）：\n1. 场景设定：绘本故事中，小兔子问小猫要玩具，小猫说：“我想睡觉了。”（其实小猫不想借）。\n2. 提问（Sd）：老师问：“小猫是真的很困吗？”\n3. 辅助（Prompt）：老师解释：“小猫不想借玩具，但不好意思直接说，就用想睡觉来委婉拒绝。这叫‘不好意思拒绝’。”\n4. 反应（Response）：孩子尝试理解并回答。\n5. 结果（Consequence）：一旦孩子理解了委婉拒绝的逻辑，立刻表扬他：“你真聪明！以后别人对你说他忙，你就可以说‘好，不打扰你了’，他会觉得你很懂事！”\n（注：这是帮他们破译“社交密码”，需要大量一板一眼的解密练习）。 🎮 治疗室游戏库（第三阶段）：“看图猜谜语”、“反话大挑战”（你说反话让他猜真实意思）、“我该怎么办？”（遇到情景卡，让他选最优解）。 🏠 家庭指导（第三阶段）：家长要帮助孩子“做翻译”。在生活中，如果孩子听不懂别人话里的意思，家长要第一时间帮他翻译，“他刚才那么说，其实就是不想给你，你可以再问他，什么时候方便给我玩一会儿？”"}, {"name": "【第四阶段】解决问题与同伴互动（泛化与融合）", "content": "精细教学顺序与具体内容： 同伴介入训练：找一个性格温和、包容的小玩伴一起上课。老师定好规则，鼓励孩子对小玩伴发起互动。 解决冲突脚本：教他应对“别人抢他玩具”、“别人嘲笑他”的万能公式：第一步大声说“不要”；第二步寻求老师帮忙；第三步自己走开。 情绪调控：当被拒绝时，学会说“没关系，我找别人玩”，而不是发脾气或大哭。 自我反思：用录像回放（视频反馈法），看自己刚才和小玩伴玩得怎么样，哪里做得好，哪里不够好，然后表扬他的进步。 BCBA教学回合实例（练：解决冲突）：\n1. 设定情境：找来同伴故意抢走他的玩具。\n2. 反应：孩子发脾气或愣住。\n3. 辅助（Prompt）：老师立刻在旁边提示剧本：“大声说：不要抢！请还给我！”\n4. 反应：孩子照做。\n5. 结果：同伴还回玩具，老师立刻给予双倍奖励（给孩子，也给同伴），并夸奖他：“你看，你大声说话，他就不敢抢了，你真有办法！”通过多次情景演练（故意安排“坏人”角色），让他体验到成功解决问题的快感，从而建立自信。 🎮 治疗室游戏库（第四阶段）：“小剧场”（大家扮演不同角色演情景剧）、“带娃记”（请小玩伴来玩玩具）、“我的社交故事书”（把他经历的情景画成小书，帮助复盘）。 🏠 家庭指导（第四阶段）：给他提供“社交安全试点”。比如由妈妈陪着，去楼下和一个固定的小朋友玩15分钟。家长不干预，只在旁边看着，回家后给予正向反馈：“你今天知道邀请别人玩滑梯了，进步超级大！奖励全家周末去游乐园！”"}], "ages": [{"age": "0-1岁", "standard": "能通过眼神和哭声与大人交换信息，会“咿呀”回应大人的逗弄，懂得“轮流”发出声音。", "focus": "若出现不看人、不应名，需要立刻排查自闭症。干预重点：用强烈的视觉和听觉刺激建立共同注意。"}, {"age": "1-2岁", "standard": "会主动用手指向想要的东西，会用眼神示意（指一下看你一眼），会把玩具拿给大人“炫耀”。", "focus": "若不会指物或不会追随大人手指看东西，需重点干预。干预重点：跟随指示（看我指的地方）、物品分享（给我看）。"}, {"age": "2-3岁", "standard": "能进行简单的一问一答，会叫妈妈，会说“我的”，会表现出嫉妒、高兴等复杂情绪，并能看懂大人的表情。", "focus": "如果对大人的表情无感（如大人皱眉他还继续闹），干预重点：认识表情与简单情绪的表达。"}, {"age": "3-4岁", "standard": "能围绕一个话题说2-3句，会主动和小朋友打招呼，在提示下能说“对不起/谢谢”。", "focus": "若经常跑题、自顾自说话，需要干预重点：单回合轮流对答训练，用“说话球”等方法建立对话规则。"}, {"age": "4-5岁", "standard": "能理解简单的幽默，喜欢玩假想游戏，能在角色扮演中配合别人，能根据听众（老师/孩子）调整说话方式。", "focus": "若经常把玩笑当真，不理解别人的弦外之音，干预重点：比喻、双关语的理解训练，以及“语境”判断。"}, {"age": "5-6岁", "standard": "能解决简单的冲突（如轮流玩），能听懂反话，能把握社交距离，能在集体中根据环境要求控制音量。", "focus": "若在幼儿园经常被孤立或告状，需要干预重点：解决冲突剧本演练，同伴互动泛化训练。"}]}, {"key": "规则意识差", "desc": "BCBA核心心法（必读）：\n1. 规则意识差，本质上是“指令控制力弱”和“耐受挫折能力差”。BCBA的原则是：不发不能100%执行的指令。一旦发出指令，无论孩子怎么哭闹，都必须通过辅助让他完成。这叫“指令的不可妥协性”。\n2. 用清晰明确的行为界定代替模糊的“听话”：不说“你要乖”，而说“手放好，脚放好，眼睛看老师”。\n3. 绝不在孩子哭闹/撒泼时妥协！哭闹是无效沟通，只要他在哭闹时得到了想要的，这个行为就会被长强化。只有当他安静2秒时，才开始安抚并给他任务。\n4. 规则必须“可视化”和“预兆化”：使用视觉时间表（接下来干什么）、代币板（干完有什么奖励）、沙漏（要等多久），让孩子清楚规则，降低对未知的恐惧。\n5. 奖励“遵守规则的瞬间”：不要等他有大进步才表扬。抓到他安静坐好时、东西放回去时，立刻给强化，告诉他为什么被表扬。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师不主动搭话，观察孩子进入房间后是否乱翻抽屉、乱扔玩具、往窗外扔，或者无视治疗师的存在。", "observe": "挑战底线：是否未经允许就动别人的东西？ 服从基线：对“不”和“停下”有没有反应？ 情绪控制：遇到不顺时（如玩具没拿到），是发脾气、躺地，还是能等待？", "intervene": "划定物理边界：温和但坚定地用手挡住他乱翻的手，说“不可以”。如果他停止2秒，立刻递给他一个玩具，说“你可以玩这个”。（替换行为的强化）"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：治疗师拿着一个玩具说：“这是老师的，放好。”轻轻把玩具收回。", "observe": "所有权意识：是否理解“别人的”和“自己的”？是否因为玩具被拿走而马上大哭？", "intervene": "建立边界感：拿一件他最喜欢的东西，趁他不注意拿走，观察反应。等他看老师时，马上说“给我！”，让他交回来，交回后立刻奖励。测试他的服从性。"}, {"time": "5-15分钟 结构化快测期 (服从力与规则测试)", "steps": "指令服从测试： 1. 发出口头指令：“坐下。” 2. 等待5秒。如果不动，说：“老师帮你。”直接用手按压他的肩膀强迫坐下，并立刻夸奖“坐好棒！” 3. 进阶指令：“把积木放盒子里。”", "observe": "绝对服从力：听到指令的第一反应是执行，还是故意唱反调，或者像没听见一样？ 任务完成度：能坚持执行完指令吗？还是做一半就跑了？", "intervene": "无妥协原则：如果孩子躺地耍赖，绝不拉他起来，也不说话。等他安静2秒，立刻发指令：“坐好！”并辅助他坐好，成功后马上给吃的。让他明白哭闹没用，听指令才有大奖励。"}, {"time": "5-15分钟 结构化快测期 (服从力与规则测试)", "steps": "规则游戏测试：拿出一个简单的颜色配对玩具，示范一次说：“只拿红色的。”让他按规则挑出来。中间故意放错一个，看他会不会发现。", "observe": "规则理解力：能听明白规则吗？能随着玩法改变规则吗？ 自我监控：放错时，是因为粗心没看，还是故意作对？", "intervene": "引导复盘：如果他弄错了，指着错误的红色说：“不对，规则是拿红色。”辅助他拿对，然后立刻给予奖励。不要批评他做错，而是教他“怎样做才是对的”。"}, {"time": "5-15分钟 结构化快测期 (服从力与规则测试)", "steps": "延迟满足/接受失败测试：和他玩一个简单的猜拳游戏，故意让他输。或者把糖放在盒子里说：“等一分钟再吃。”", "observe": "输不起：输了之后是生气、打人、还是哭闹？ 冲动控制：能不能忍住不吃（哪怕只有几秒）？", "intervene": "教导“输赢规则”：如果他生气了，平静地说：“你输了，没关系。”然后把糖给他：“这是奖励你耐心等待的。”让他体验，遵守规则（等待）和接受失败也能得到奖励。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：玩“轮流搭积木”游戏。明确规定“你搭一块，我搭一块”。", "observe": "轮流意识：能否克制住插队的冲动？ 领地意识：会不会霸占积木，把老师的积木抢走？", "intervene": "执行“自然结果”：如果他不轮流抢积木，立刻停止游戏，把积木收走。“没轮到你，游戏就停了。”等他安静并说“我轮流”，再重新开始。用“失去游戏”作为自然惩罚。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：详细询问家长：“在家吃饭、出门、睡觉前是不是特别困难？是不是非要按他的规矩来，不然就闹？家长是不是妥协过很多次？”", "observe": "家庭规则现状：家长是否言行一致？是否经常被孩子的哭闹“拿捏”？ 核心破坏行为：最让家长头疼的“突破底线”的场景是什么？", "intervene": "指令一致性教育：家长必须统一口径。坚决告诉家长：“你们以前只要孩子一哭就妥协，这恰恰强化了他的哭闹。下周我们要练习‘狠下心’让他哭5分钟不妥协，哭完后马上表扬，任务完成后给奖励。”"}, {"time": "35-40分钟 收尾期", "steps": "操作：提前预告：“还有1分钟就下课了，我们把玩具放回盒子里，然后去拿贴纸。”给强化物。", "observe": "转换规则：是否能接受游戏结束？面对“收玩具”是否哭闹抗拒？", "intervene": "平稳过渡：如果哭闹，让他哭2分钟（不关注），然后拉着他的手辅助收玩具，收完第一件立刻给奖励。教他建立“转换环节的规则”。"}], "stages": [{"name": "【第一阶段】无条件服从与指令执行（建立底线）", "content": "精细教学顺序与具体内容： 环境控制：桌面只留一个玩具，减少分心；座椅固定。 无错指令：发出指令（如“坐下”），暂停5秒，如果不做，必须用全辅助（按肩膀）完成。完成后立刻给奖励，并告诉他“你坐下啦，真棒！” 关联词训练：建立“先…后…”。先说“先收玩具，后吃糖”，让规则在脑子里建立。 强化服从：给指令时，只要孩子眼神看向你，或者小声嘟囔着说“好”，立即给予大幅度夸奖和零食。强化“顺从意愿”而不是“圆满完成”。 BCBA教学回合实例（练：指令服从）：\n1. 指令（Sd）：坐在孩子对面，“把球给我”。\n2. 辅助（Prompt）：孩子不动，治疗师不说话，直接握住孩子的手，把球拿起来递给自己。（全程无对话，不废话！）\n3. 反应（Response）：球被递到老师手里。\n4. 结果（Consequence）：立刻把球还给他，并给予极大的强化：“哇！你给老师了！太棒了！”\n核心要点：绝对不要说“快点给我！”等乞求或求饶的话，指令就是不可逆转的。 🎮 治疗室游戏库（第一阶段）：“123木头人”培养抑制力、“我是大狮子”练习发指令和服从、“整理大比拼”学习听指令放回原位。 🏠 家庭指导（第一阶段）： 少说多做：不要长篇大论讲道理。直接发指令：“穿鞋！”辅助他穿，穿好了给奖励。 不许妥协：孩子在地上打滚哭闹绝对不给东西。等他安静了2秒，再重复刚才的要求：“先穿鞋，再吃饼干”。 全家统一战线：爷爷奶奶不能宠溺。孩子哭闹时，全家退到另一房间，不看他，让他自己冷静。"}, {"name": "【第二阶段】规则可视化与代币系统（让规则可预期）", "content": "精细教学顺序与具体内容： 代币板（Token Board）上线：每天设定3-5个简单任务（吃饭、收玩具、穿鞋）。完成一个，贴一个星星，集满换最喜欢的奖励。 视觉时间表：用图片贴出一天流程：书包→洗手→玩积木→睡觉。每次转换前，带他看时间表，大大减少抵触情绪。 建立“暂停区”：不把暂停当成惩罚，而是“冷静角”。里面放几本书，不吵不闹，安静了就可以出来（计时2分钟）。 奖励“好行为瞬间”：抓拍孩子正在做正确的事情（如安静画画），立刻过去给他代币，说：“因为你安静画画了，奖励一颗星星！” BCBA教学回合实例（练：代币系统）：\n1. 设置规则：准备一张代币板（有3个框）和强化物（玩具车）。\n2. 指令（Sd）：发指令：“先把积木放进篮子。”\n3. 反应：孩子完成。\n4. 结果：立刻贴上一枚星星，说：“第一枚！再完成两次就能玩小车啦！”（中间绝不拖延，兑现承诺）。\n核心要点：刚开始代币不要太难赚，不要让他经历失败。代币一定要在行为发生后1-2秒内立即给。 🎮 治疗室游戏库（第二阶段）：“小管家”（做完任务马上给贴纸）、“魔法时钟”（用沙漏看时间）、“我是大老板”（孩子当老板发代币）。 🏠 家庭指导（第二阶段）： 家庭公约上墙：和孩子一起画表格。做一件好事贴一个笑脸，贴满换心愿。（如多玩15分钟平板）。 清晰的指令短语：把“不要乱跑”换成“慢一点走”。把“不要抢弟弟玩具”换成“你可以和弟弟轮流玩”，给规则一个明确的方向。 正面提醒优于事后惩罚：开始任务前提醒：“我们要玩5分钟，现在开始。”给一个可被预期的时间界限。"}, {"name": "【第三阶段】接受拒绝与挫折耐受（攻克“输不起”和“得不到”）", "content": "精细教学顺序与具体内容： 故意提要求：在游戏中故意说：“把红色的给我，你要蓝色的。”练习接受“不”，为缺乏规则感的行为做脱敏训练。 教“我输了”：玩比赛游戏，故意让他输，反应是教他说：“你赢了，我输了！”然后马上给安慰奖励：“虽然你输了，但你表现很勇敢，给你吃糖！” 情绪爆发时的规矩：如果因为输而崩溃，家长/老师不关注，直到他安静，再重新开始。用这种方式告诉他，发脾气是无效的。 替代行为：教他“我很生气时，可以跺脚”或“可以找老师抱抱”，替代“打人”、“摔东西”。 BCBA教学回合实例（练：接受失败与替代行为）：\n1. 设置情景：玩两人飞行棋，孩子快赢时，治疗师故意往前几步，“赢”了游戏。\n2. 反应：孩子生气，想砸棋盘。\n3. 辅助：治疗师挡住他的手，说：“没有赢，你可以说‘我生气了’。”\n4. 结果：只要他说“我生气了”，或者只用语言抱怨了，立刻给积极的反馈：“谢谢你告诉我感受，你很勇敢。我们可以再玩一局，这次你先走！”（让他体验到：表达感受后，事情变好了）。 🎮 治疗室游戏库（第三阶段）：“抢答游戏”（故意输给他几次，再故意赢他一次）、“情绪大转盘”（转到生气，模仿生气的表情，但身体不能动）、“冷静角练习”。 🏠 家庭指导（第三阶段）： 提前打预防针：去超市前说：“今天我们只买一样东西。”如果他看到别的非要买，坚决不买。他哭了，就带他走到安静的角落，等他不哭了再带回家。永不妥协。 接纳负面情绪：当孩子生气时，搂着他：“我知道你很生气”，但不满足他的要求。先共情，再执行规则。 不要滥用表扬“你真聪明”：要表扬“你刚刚虽然很生气，但没有打人，你真棒！”，将焦点集中在他控制了自己的行为上。"}, {"name": "【第四阶段】泛化到集体与社会环境（同伴规则）", "content": "精细教学顺序与具体内容： 同伴介入：邀请一位小客人（或同伴）一起玩。教导“排队”、“轮流”、“借还”等社交规则。 社会故事：用图画书或小卡片讲述在幼儿园的场景（如：老师叫名字时要起立；小朋友排队洗手时不能插队）。提前预演规则。 设立“小组长”角色：赋予孩子“发牌”、“当裁判”的角色。让他体验执行规则的过程，从而更好地理解规则、遵守规则。 长任务分解：针对规则差导致任务拖延的问题，写作业时用计时器：“写10分钟休息5分钟”，降低执行难度。 BCBA教学回合实例（练：轮流的集体规则）：\n1. 设置环境：三个小朋友（或大人）排队滑滑梯。\n2. 规则说明：“大家排队，你站这里，他站这里。轮到谁，谁去滑。”\n3. 反应：孩子向前挤。\n4. 结果：大人立刻拦住他，让他退回原位：“没轮到你，请等待。”等后面小朋友滑完，放他去，并表扬：“你排队了，做得很好！”\n核心要点：用“自然逻辑后果”教会他规则，比口头教育有效得多。 🎮 治疗室游戏库（第四阶段）：“开小火车”、“幼儿园模拟”、逻辑狗（按图找规律）、大富翁。 🏠 家庭指导（第四阶段）： 鼓励参加集体活动：参加早教班、兴趣班，让他置身于有具体规则的集体环境中，配合老师，逐步融合。 扮演“小老师”：在家里，让孩子当小老师，妈妈当学生。如果小老师乱发脾气，妈妈也要严肃地说：“老师不发脾气，我不听啦！”让他体会违反规则的后果。 允许犯错，及时反思：规则差的孩子会经常犯错。不要等他犯错后再发脾气，应该在他犯错后，带他重新做一遍正确的流程，并告诉他：“下次要这样做。”"}], "ages": [{"age": "0-1岁", "standard": "只受本能驱动，没有规则意识，听不懂“不”字。", "focus": "此阶段不强求服从，用安全的环境保护他；关键是建立安全的依恋关系。"}, {"age": "1-2岁", "standard": "能理解简单的“不行”、“停”，能执行一步指令（如“拿杯子”），能短暂满足“等一下”。", "focus": "出现反抗是正常的，但必须设定安全底线。干预重点：用短指令建立初步配合。"}, {"age": "2-3岁", "standard": "意识到“我的”与“别人的”，能在提示下遵守排队等简单规则，但常因自我中心而不愿分享。", "focus": "对“所有权”极度敏感。干预重点：引入物归原主、轮流意识；利用“代币”建立规则。"}, {"age": "3-4岁", "standard": "能基本遵守轮流规则，在成人的提醒下能收拾玩具，能分清对错，并开始会“告状”（道德感萌芽）。", "focus": "挑战成人底线的行为增多。干预重点：利用代币板和“暂停区”，坚定执行规则，不妥协。"}, {"age": "4-5岁", "standard": "能遵守多人游戏的规则，能排队等待。虽然有输赢，但能逐渐接受失败，具备一定的自我控制力。", "focus": "同伴冲突增加，输不起。干预重点：刻意练习“接受不”和“社交故事”预演，教导情绪控制。"}, {"age": "5-6岁", "standard": "能很好理解集体规则，能自我监督，按课表完成活动，具备较强的问题解决能力，能理解“公平”的概念。", "focus": "容易出现不按规则完成作业。干预重点：长任务分解，自我监督表，自然逻辑后果的应用（如故意超时导致去不了游乐场）。"}]}, {"key": "认知理解弱", "desc": "BCBA核心心法（必读）：\n1. 认知弱不等于什么都不懂，而是学得慢、忘得快。必须把任务拆解到极其微小的步骤（小步子原则），并且进行大量的重复练习（高密度、高重复）。\n2. 必须从“具体”走向“抽象”。先摸真实的苹果，再看苹果的图片，最后才认识“苹果”这两个字。绝对不能跳过实物阶段直接教抽象概念（如数数）。\n3. 指令必须极简。认知弱的孩子很难处理长句信息，指令需控制在1-2个字（如：“放”、“拿”、“大”）。\n4. 多感官协同。视觉（看实物/图片），听觉（夸张指令），触觉（摸形状），动觉（操作积木）同步进行，大脑才能建立链接。采用“无错教学”，永远给予极强的即时强化（高频，且用最直接的实物奖励）。", "flow": [{"time": "0-5分钟 自然观察期", "steps": "操作：治疗师不主动搭话，观察孩子如何探索环境。拿一个发光发声的玩具逗他，试探反应。", "observe": "基础反应：对光线、声音敏感吗？能安坐吗？有没有眼神注视？ 探索能力：是放进嘴里咬，还是拿着敲，还是扔？", "intervene": "寻找强动机：认知弱的孩子往往对感官刺激（如转动的轮子、发光玩具、触觉软毛刷）更敏感，找到它作为强化物。不干预他，让他先熟悉环境。"}, {"time": "0-5分钟 自然观察期", "steps": "破冰测试：递给他两块积木，他自己玩一会。然后你拿一块轻敲你的积木，“咚！”", "observe": "模仿操作：他会不会模仿你敲击的动作？（因果逻辑）", "intervene": "建立关系：如果他推倒了积木，你立刻夸张地笑，让他觉得这个动作能引起你的注意。"}, {"time": "5-15分钟 结构化快测期 (无需语言，考查纯理解)", "steps": "基础指令与模仿： 1. 一步指令：“给我”、“坐下”（动作辅助下完成）。 2. 模仿：“拍拍手”、“摸摸头”。", "observe": "依从性：能听懂指令吗？需要手把手辅助吗？ 模仿意识：有没有模仿动作的意愿？", "intervene": "定基线：完全没反应？做不出？立刻全肢体辅助他做“拍手”，做完马上给零食（全辅助无错教学）。"}, {"time": "5-15分钟 结构化快测期 (无需语言，考查纯理解)", "steps": "配对与分类： 1. 实物对实物：两个一样的杯子放一起。 2. 图片对图片：相同的卡片放一起。 3. 同一类物品：把吃的全放一个碗里，把玩具放另一个。", "observe": "认知起点：是否理解“相同”的概念？认知处于实物期还是图片期？是否能按类别（功能）分类？", "intervene": "即测即教：如果不会分类，就只放一个苹果和一个梨，手把手把苹果放到苹果旁边，然后马上表扬。难度降到最低点。"}, {"time": "5-15分钟 结构化快测期 (无需语言，考查纯理解)", "steps": "基础概念试探： 拿出一个大球和一个小球。“给妈妈大的”。 拿出1块积木和很多积木。“给妈妈1个”。", "observe": "抽象概念：知不知道“大小”？知不知道“1”和“许多”？这些是最基础的空间与数量概念。", "intervene": "结合实物演示：如果全错，直接拉着他的手摸大球“这是大的”，再摸小球“这是小的”，然后再次下发指令。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：和他玩套圈、敲打台、或者简单的拼图（2-3块）。", "observe": "手眼协调与问题解决：遇到困难是放弃，发脾气，还是寻求帮助？能完成简单的目的性操作吗？", "intervene": "保护积极性：故意把拼图弄得简单一点，让他完成，体验“我成功了”的感觉。如果发脾气，停止测试，安抚，退回上一阶段。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：问家长：“孩子能听懂复杂的话吗？”“平时教一个新东西要教多少次？”“对玩具感兴趣吗？还是只喜欢自己的手？”", "observe": "生活自理能力评估：会自己吃饭？穿衣？如厕？有没有处理日常生活的基本认知？", "intervene": "调整家庭预期：告诉家长，教认知必须“慢”且“重复”。要求家长回家把任务拆解，比如说穿鞋，拆成“拿鞋”、“伸脚”、“拉后跟”三个步骤一步步教。"}, {"time": "35-40分钟 收尾期", "steps": "操作：拿出他刚才玩过的一个球，“把球放框里”。进行简单的物品归位。", "observe": "指令理解力：在不带暗示的情况下，他还能听懂刚才学过的词汇吗？", "intervene": "稳定结束：哪怕他只看了一眼球，辅助他拿起来放进去，马上奖励。以“成功且快乐”结束这节课。"}], "stages": [{"name": "【第一阶段】基础依从与感知觉提升（打地基）", "content": "精细教学顺序与具体内容： 安坐与静手：坐好2秒就给奖励，缓慢延长。 因果感知：按按钮，玩具弹出来；推倒积木；开关盒子。 抓握与操作：拿放物品（抓握大物品，再到小物品）。 一模一样的实物配对：杯子对杯子（这项通过率100%后才能教图片配对）。 一步指令：“放”（把东西放到盒子里）、“给”（递给老师）。使用全肢体辅助。 BCBA教学回合实例（练：因果感知）：\n1. 指令（Sd）：拿出一个按压发声的小鸭子，放在孩子面前。\n2. 辅助（Prompt）：全肢体辅助他的手指按压“看，嘎嘎叫了！”\n3. 反应（Response）：在辅助下听到声音。\n4. 结果（Consequence）：立刻给他强化物（或者让他连续按三次作为奖励），并用夸张的笑容表示肯定。 🎮 治疗室游戏库（第一阶段）：“按压玩具”、“击打台”、“找找藏哪了”（看大人把玩具藏在盒子下，是否能找到，物体恒存概念）。 🏠 家庭指导（第一阶段）： 小步子生活化：吃饭时，把勺子递到他手里，辅助他把勺子放进碗里，立刻表扬。每天重复。 加强感觉刺激：洗澡时拍水花，捏软泥，触摸粗糙和光滑的物品，提供丰富的触觉体验，刺激大脑神经连接。 指令精简：只说“拿水杯”，不说“宝宝你去把桌上的水杯拿给妈妈”。教指令时搭配动作示范。"}, {"name": "【第二阶段】核心认知期（识别与配对、分类）", "content": "精细教学顺序与具体内容： 实物到图片的过渡：先用真实的苹果让他摸，再拿苹果的卡片告诉他“苹果”，最后他能在图片中找到苹果。 图片与图片配对：卡片对卡片（100%掌握）。 形状与颜色配对：圆对圆，红对红（先用颜色一致、形状完全相同的卡片开始）。 按属性分类：把动物和水果分开，把吃的和穿的放在两个盒子里。 指认身体部位：眼睛、鼻子、嘴巴。每天强化。 BCBA教学回合实例（练：实物-图片配对）：\n1. 设置环境：桌上放一个真实的苹果和一张苹果的照片。治疗师把另一个真实的苹果递给它，“一样的放一起”。\n2. 辅助：手把手拿着真实的苹果放到照片上。\n3. 反应：通过辅助完成了任务。\n4. 结果：立刻给强化物，并大声肯定“一样！对了，这是苹果！”反复20次辅助后，撤销手部辅助，等待孩子自己做出动作。 🎮 治疗室游戏库（第二阶段）：“小管家”（把玩具放进玩具盒，把水果放到果盘里）、“奇妙口袋”（摸出同类型的物品）、“给娃娃指眼睛”。 🏠 家庭指导（第二阶段）： 日常分类：收衣服的时候“帮妈妈把袜子放进这个篮子，把裤子放进那个篮子”。 多感官输入：教“苹果”时，让他摸、闻、吃，然后再反复看卡片。强调“多感觉道”并存。 日常指认：带他上街时，反复指着“汽车”、“大树”、“红绿灯”，用极其统一的词汇刺激他的听觉记忆。"}, {"name": "【第三阶段】概念理解期（大小、颜色、方位、数前概念）", "content": "精细教学顺序与具体内容： 大小概念：先学差异极大的大/小（大西瓜vs小弹珠），再到差异较小的。不要同时教多种属性，先练好一种。 颜色与形状：先认红色（红球、红车、红苹果），再认黄色。 方位词：在、上、下、里、外。通过实物摆放练习。 数前概念（1和许多）：这是数学的起点。先会指1个，再看一大堆（许多）。 唱数和按数取物：在完整掌握1和许多后，才开始数1-5，过渡到拿3个。 BCBA教学回合实例（练：大小概念）：\n1. 设置环境：桌上放一个超大号球和一个极小号球。\n2. 指令（Sd）：要求“给妈妈大的”。先给一个示范（给大的）并强化自己。\n3. 辅助：如果孩子拿错，手轻轻挡住他拿小的手，辅助他拿大的。\n4. 反应：拿到大的球。\n5. 结果：立刻开心地抱着大球，给他强化物。反复练习后，加入“小的”进行对比训练。 🎮 治疗室游戏库（第三阶段）：“大箱子和小箱子”（把大球放进了大箱子）、“颜色回家”（把红色的积木放进红色的盒子）、“抢椅子”（上面/下面）。 🏠 家庭指导（第三阶段）： 生活比大小：吃饭时，递给宝宝一个大碗，妈妈拿一个小碗，“宝宝是大碗，妈妈是小碗”。拿衣服时，比爸爸的衣服大，宝宝的衣服小。 认知不能强灌：如果孩子今天总是找错大小，立刻暂停。明天再教。认知弱的孩子非常容易疲劳，不要让他产生挫败感，保护他的学习兴趣是第一要务。 不要急着教数数：连“一个”都还没概念时，不要逼他数1、2、3。先玩“给妈妈一个”、“拿一个”的游戏。"}, {"name": "【第四阶段】进阶理解与逻辑推理期", "content": "精细教学顺序与具体内容： 两步指令：“先拍手，再拿杯子”。（非常重要，这是规则理解的铺垫）。 功能关联：知道牙刷（用来刷牙），帽子（用来戴头上）。 理解因果关系：下雨了要打伞，饿了要吃饭，困了要睡觉。 简单规律排序：红球-黄球-红球-黄球，让孩子放下一个。 数概念进阶：点数（1-5），比多少，简单的加减法前体验（“添上一个”）。 BCBA教学回合实例（练：两步指令）：\n1. 指令（Sd）：“先拍手，再摸头”。\n2. 辅助（Prompt）：全肢体辅助他完成拍手，然后立刻推他的手去摸头。\n3. 反应（Response）：完成两步动作。\n4. 结果（Consequence）：给予强化。随着正确率提高，慢慢撤掉辅助，直到他听到完整的句子自己能连续完成。 🎮 治疗室游戏库（第四阶段）：“你拼我搭”（按简单的红黄红规律搭积木）、“小小厨师”（根据指令找食材，做假想食物）、“找找谁不见了”（从三张卡片抽走一张，问谁不见了）。 🏠 家庭指导（第四阶段）： 赋予孩子自主权：虽然他很慢，但仍要让他做一些决定。比如出门前：“今天要穿红色的鞋还是蓝色的鞋？”（给他选项，练认知辨识）。 生活任务解决：饼干盒打不开，怎么办？看他能不能自己想办法或者找你求救。让他体验“遇到问题-解决问题”的完整链条。 讲故事（简短）：多用顺序词：先…然后…最后，反复强调生活顺序。认知弱的孩子需要极强的序列感来理解世界。"}], "ages": [{"age": "0-1岁", "standard": "物体恒存（看不见也知道存在），能注视移动的物体，能完成简单的抓握。", "focus": "视觉追踪、抓握训练、物体永存训练（布盖住玩具找他）。"}, {"age": "1-2岁", "standard": "会简单的一步指令（给我、放进去），可以完成一模一样物品的配对，能在口头指导下指认3-5个身体部位。", "focus": "基础配对、一步指令、指认五官。"}, {"age": "2-3岁", "standard": "能完成图片配对，理解形状（圆/方）和颜色（红/黄），能指认常用的日常物品和动物。", "focus": "图片配对、基础颜色形状认知、分类练习（吃的/玩的）。"}, {"age": "3-4岁", "standard": "理解“大小”、“长短”，能按颜色或形状分类，学会唱数1-5（但点数可能困难），理解“上面/下面”。", "focus": "大小/长短概念构建、颜色形状分类、方位词认知。"}, {"age": "4-5岁", "standard": "能按数取物（1-5），理解“前后”、“里外”，能进行两步指令，知道基本物品的功能（牙刷用来刷牙）。", "focus": "数前概念与取物、两步指令、功能关联。"}, {"age": "5-6岁", "standard": "能点数1-10，能识别简单规律（红黄红黄），理解基本因果关系（为什么下雨要带伞），具备初步的问题解决能力。", "focus": "规律排序、因果关系推理、简单逻辑思维训练。"}]}, {"key": "语言发育迟缓", "desc": "BCBA核心心法（必读）：\n1. 先观察，再干预。前5分钟绝对不“考”孩子。\n2. 先提要求，后命名。动机是最强的内驱力。\n3. 无错教学。孩子做错时绝对不批评，立刻辅助做对并强化。\n4. 阶梯式干预。严禁跳步，每一小步达到80%正确率再进入下一步。", "flow": [{"time": "0-5分钟 自然观察期 (绝对不考试)", "steps": "操作：治疗师安静坐在旁，让孩子自己玩一会。观察他第一件事去玩什么。", "observe": "环境探索：冲过去抢玩具，还是缩在妈妈身后？ 自发行为：偷看老师一眼（联合注意）？有没有自言自语？ 动机搜寻：对什么玩具最感兴趣？", "intervene": "建立关系：他玩小车，你也拿一辆在旁边平行玩。他看你时，立刻夸张地笑，让他觉得“这个老师很好玩”。"}, {"time": "0-5分钟 自然观察期 (绝对不考试)", "steps": "破冰测试：拿出泡泡水吹一个泡泡，“看，泡泡！”", "observe": "眼神对视：是看泡泡还是看你？叫名回头吗？ 安坐基线：能呆多久？", "intervene": "寻找主强化物：对泡泡无感？换零食、贴纸，直到找到他眼睛发亮的东西。"}, {"time": "5-15分钟 结构化快测期", "steps": "理解与模仿： 1. 一步指令：“给我”、“坐下”。 2. 两步指令：“先拍手，再跺脚”。 3. 动作模仿：“拍手”、“摸头”。 4. 口肌模仿：张大嘴、撅嘴、吹气（吹纸片）。", "observe": "听者反应与模仿：独立完成？需要何种辅助（手势/全辅）？口肌灵活性如何？", "intervene": "触底反弹：连续错2题停止。两步做不了降一步，口肌做不了手把手辅助，只要配合就强化。"}, {"time": "5-15分钟 结构化快测期", "steps": "认知与表达： 1. 配对：实物对实物、图片对图片。 2. 名词：“这是什么？”（苹果、车）。 3. 动词：“他在干什么？”（吃、跑）。", "observe": "理解层与表达层：能理解多少？能命名多少？发音清晰度如何？", "intervene": "语言诱导：如果不会说，指着实物夸张地示范发音“车车！”，停顿等着他仿说。"}, {"time": "5-15分钟 结构化快测期", "steps": "提要求（最核心）：把喜欢的车放进透明罐，“要吗？”看反应：抢？拉手？指？说“要”？", "observe": "沟通意图：是用非语言沟通（拉手/指），还是语言沟通？", "intervene": "同步治疗：只要发出任何信号，立刻代偿教他说“要”或“开”。让他尝到说话的甜头。"}, {"time": "15-25分钟 游戏试水期", "steps": "操作：玩“轮流推小车”，“到你了”；或者玩搭积木推倒。", "observe": "共同注意与轮流：能否听从轮流？是否刻板？ 精细动作：能抓握、换手吗？", "intervene": "建立规则：他抢积木时，挡一下，等看他，说“等一下”，再给他。建立轮流概念。"}, {"time": "25-35分钟 家长访谈期", "steps": "操作：让孩子自由玩，问家长：“在家最常说哪10个词？”、“怎么表达需求？”、“听不听得懂两步指令？”", "observe": "家庭泛化评估：诊室表现与家里是否反差巨大？", "intervene": "定家庭目标：确定这一周在家练的最核心的一个目标（如每天吃饭练说“要”）。"}, {"time": "35-40分钟 收尾期", "steps": "操作：收玩具。“下课啦，帮小车回家。”给强化物。", "observe": "转换能力：能接受结束吗？有哭闹抗拒吗？", "intervene": "处理逃避：如果哭闹，绝对不妥协（不给玩具）。等安静2秒，立刻给零食（强化安静）。"}], "stages": [{"name": "【第一阶段】前语言期准备（无语言、抗拒、配合度差）", "content": "精细教学顺序与具体内容： 安坐（1秒-5分钟）：拿高强化物，只要坐好或眼神看老师1秒，立刻给零食。逐渐拉长时间。 动作模仿：先做最简单的（拍手、跺脚），再做复杂的（摸头、拍肩膀）。 口部运动：吹纸条、吹泡泡（圆唇）；咧嘴笑（展唇）；伸舌头、弹舌。 因果操作：按按钮小狗叫，推倒多米诺，敲击小鼓。 基础配对：一模一样的实物配对（杯子-杯子）。 BCBA教学回合实例（练：安坐+眼神）：\n1. 指令（Sd）：拿零食放在眼前，“看我”。\n2. 辅助（Prompt）：全肢体辅助（托下巴转向）。\n3. 反应（Response）：眼神接触1秒。\n4. 结果（Consequence）：立刻给零食，夸张表扬。每回合间让他休息10秒，绝对不在挫败中度过。 🎮 治疗室游戏库（第一阶段）：“抢吃零食”（坐好才给吃）、“跟我做”（赢贴纸）、“吹羽毛比赛”、“找找藏哪了”（物品恒存）、躲猫猫（偷看）。 🏠 家庭指导（第一阶段）： 制造困难：把酸奶放透明瓶，孩子看妈妈/拉妈妈手，立刻给他。 跟随兴趣：他玩车，你平行玩，发出“滴滴”声，看他一眼就夸他。 夸张表情：模仿他“啊”的声音，激发互动。"}, {"name": "【第二阶段】词汇爆发期（建立词汇库，引入叠词单字）", "content": "精细教学顺序与具体内容： 提要求（核心）：拿高动机物品，教他说：“要”、“开”、“给我”、“吃”。 高频名词：亲人（爸爸/妈妈）、食物（饼饼）、动物（汪汪/喵喵）、日常用品（杯杯）。强调叠词！叠词发音容易，能建立自信。 高频动词：吃、喝、抱、开、跑。在情景中教，做动作的同时大声说。 视觉配对：从实物到图片，“把苹果卡片给我”。 属性起步：先学大小（大篮球和小弹珠），再过渡到长短、红黄颜色。 BCBA教学回合实例（练：提要求“要”）：\n1. 设置动机：把车车放到拿不到的地方。\n2. 辅助：手把手拉着他的手去指，做口型“要”。\n3. 反应：发出类似“要”的音。\n4. 结果：立刻给车车，“对！你要车车！”。 🎮 治疗室游戏库（第二阶段）：“神秘袋”（摸出来说名字）、“超市购物”（我要买这个）、“给小动物喂食”（“喂啊呜”）、吹羽毛（气息）。 🏠 家庭指导（第二阶段）： 吃饭穿衣“碎碎念”：“穿鞋鞋”、“吃果果”，等他说了再行动。 玩“接龙”：妈妈拍手说“妈妈”，等孩子接“抱”，然后马上抱他。 不要猜透心思：指着水杯“嗯嗯”时，说：“你要喝水吗？说‘水’。”不要马上就倒水。"}, {"name": "【第三阶段】短句建构期（掌握语法骨架，引入代词、量词）", "content": "精细教学顺序与具体内容： 双词句：主谓（“妈妈抱”），谓宾（“吃饼饼”）。 三词句（主谓宾）：“妈妈吃苹果”，“宝宝要车车”。用“延迟模仿”法。 代词引入（难点）：先教“我的”（拍胸口），再教“你的”（指对方）。混淆了退回第一阶段。 否定句：利用拒绝，“要不要？”“不要”。 量词：先学“个”（1个苹果），再学“只”（2只狗），再学“块”、“条”。 方位词：上、下、里、外。 BCBA教学回合实例（练：主谓宾“妈妈吃”）：\n1. 指令：拿苹果问“谁吃？”\n2. 辅助：拉着他的手指妈妈，辅助说“妈妈吃”。\n3. 反应：说出“妈妈吃”。\n4. 结果：给妈妈吃一口，给孩子强化物。代词教学用“身体标记法”（说我拍胸口）。 🎮 治疗室游戏库（第三阶段）：“过家家”（你吃饼干，我喝水）、“给娃娃穿衣服”（穿蓝色衣服）、“找宝贝”（放在桌子下面）、三词卡拼句。 🏠 家庭指导（第三阶段）： 绘本共读：每天10分钟，指着图画问“谁在干什么？”（引导说“妈妈抱宝宝”）。 建立“你我”概念：分水果说“这是你的”，吃的时候说“这是我的”。可以故意拿错让他纠正。 情绪表达：不要怕他说不，问“穿不穿？”“好不好？”，允许他用语言拒绝。"}, {"name": "【第四阶段】语法进阶与逻辑期（高阶表达）", "content": "精细教学顺序与具体内容： 形容词+名词：“红红的苹果”、“高高的树”。利用图片对比。 把/被字句：“我把苹果吃了”、“苹果被妹妹吃了”。用小玩偶演情景。 时间概念：先学“今天/明天/昨天”。用具体事件（今天去公园了）。 顺序词：“先……再……最后”。刷牙步骤示意图排序。 因果与转折：“因为下雨了，所以不出门”；“虽然累了，但坚持做完”。 高阶构音：结合声母发育顺序（b,m,d,h → p,t,g,k,n → f,j,q,x → l,z,s,r → c,zh,ch,sh），从单音节扩展到长句。 BCBA教学回合实例（练：因果“因为...所以...”）：\n1. 场景：拿两张图（下雨/没雨）。\n2. 辅助：指着下雨图说“因为下雨了”，指着另一张说“所以不出门”。\n3. 练习：指着第二张图问“为什么不出门？”\n4. 结果：说出“因为下雨了”。立刻奖励。先有真实体验再逻辑抽象。 🎮 治疗室游戏库（第四阶段）：“角色扮演”（医生看病，解释肚子痛）、“今天做了什么”（回忆游戏）、“脑筋急转弯”（为什么下雨带伞？）。 🏠 家庭指导（第四阶段）： 生活复盘：睡觉前和孩子说：“今天先……然后……最后……” 角色互换：妈妈当宝宝，孩子当妈妈。让他发号施令。 多问开放性问题：少问“是不是”，多问“你觉得呢？”。"}], "ages": [{"age": "0-1岁", "standard": "对声音有反应，明白“拜拜”，知道叫自己名字。", "focus": "无意识发声，咿呀学语，模仿大人声音。"}, {"age": "1-1.5岁", "standard": "理解一步指令，认识3-5个身体部位。", "focus": "有意识叫爸妈，用指或发音表达需要（“要”、“奶”）。"}, {"age": "1.5-2岁", "standard": "理解两步指令（拿鞋给妈妈），熟悉常见物品名称。", "focus": "词汇爆发，能说20-50个单字/词（吃吃、车车），重复大人尾字。"}, {"age": "2-2.5岁", "standard": "明白大/小、干净/脏，能区分熟悉的图片。", "focus": "说出双词短句（妈妈抱、去商店），主动问“这是什么？”。"}, {"age": "2.5-3岁", "standard": "明白“谁”、“哪里”，理解3个元素指令（去衣柜拿毛巾给妈妈）。", "focus": "说出三词句（妈妈吃苹果），会用代词“你、我、他”，叫出熟人名字。"}, {"age": "3-4岁", "standard": "明白颜色、位置（上下前后），理解“多少”，能回答“谁的”、“为什么”。", "focus": "说出姓名、年龄、性别，会问“为什么”，开始使用连词（然后、因为）。"}, {"age": "4-5岁", "standard": "明白时间概念（昨天/今天/明天），理解“如果……就……”。", "focus": "能连贯复述小故事，进行多轮对话，能数到20，基本发音准确。"}, {"age": "5-6岁", "standard": "明白“虽然……但是……”等复杂句，听懂被动语态。", "focus": "能完整复述长故事，词汇丰富，发音完全清晰，具备抽象逻辑能力。"}]}];

/* 行为检测 flex gap：不靠 CSSOM，直接量两个空 div 的间距 */
function flexGapSupported(){
  try{
    var f=document.createElement('div');
    f.style.display='flex'; f.style.flexDirection='column';
    f.style.rowGap='1px'; f.style.position='absolute';
    f.style.visibility='hidden'; f.style.height='0'; f.style.padding='0'; f.style.border='0';
    f.appendChild(document.createElement('div'));
    f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    var ok=(f.scrollHeight===1);
    f.parentNode.removeChild(f);
    return ok;
  }catch(e){ return true; }
}
function applyGapFallback(){
  try{
    if(!flexGapSupported()) document.documentElement.className+=' nogap';
  }catch(e){}
}

/* 一键强制更新：注销 SW + 清空所有缓存 + 换 URL 重载（绕过 iOS 顽固缓存） */
function forceUpdate(){
  try{ if(sessionStorage.getItem('slp_forcing')==='1') return; }catch(e){}
  try{ sessionStorage.setItem('slp_forcing','1'); }catch(e){}
  try{ toast('正在获取最新版本…','ok'); }catch(e){}
  var fired=false;
  function done(){
    if(fired) return; fired=true;
    var base=location.pathname.replace(/[?#].*$/,'');
    var nv=base+'?v='+APP_VER+'&t='+Date.now();
    try{ window.top.location.href=nv; }
    catch(e){ try{ window.location.href=nv; }catch(e2){ try{ location.replace(nv); }catch(e3){} } }
  }
  var jobs=[];
  try{
    if(window.caches && caches.keys){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches['delete'](k); }));
      }));
    }
  }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
  }catch(e){}
  if(jobs.length){
    try{ Promise.all(jobs).then(done, done); }catch(e){ done(); }
    setTimeout(done, 2500);   /* 兜底：清理卡住也照样重载 */
  } else { done(); }
}

/* 静默检查线上版本号；用 XHR（iOS12 fetch 的 cache 选项会直接 reject，XHR 最稳）。
   发现新版直接自动强刷——不等用户点按钮，因为 iOS12 PWA 的按钮经常点不动。 */
function autoCheckUpdate(){
  try{
    var host=location.hostname||'';
    if(host==='localhost'||host==='127.0.0.1'||host==='') return;
    var url=location.pathname.replace(/[?#].*$/,'')+'?vc='+Date.now();
    var x=new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      if(x.status!==200 && x.status!==0) return;
      var txt=x.responseText||'';
      var m=txt.match(/APP_VER\s*=\s*'([^']+)'/);
      if(m && m[1] && m[1]!==APP_VER){
        var bar=document.getElementById('updBar');
        var t=document.getElementById('updTxt');
        if(t) t.textContent='发现新版本 '+m[1]+'（当前 '+APP_VER+'）';
        if(bar) bar.classList.add('on');
        forceUpdate(); /* iOS12：自动强刷，不依赖点按钮 */
      }
    };
    x.send();
  }catch(e){}
}

function initVersionUI(){
  try{
    var v=document.getElementById('verNow');
    if(v) v.textContent=APP_VER;
  }catch(e){}
}

(function(){

    var isLocal=(host==='localhost'||host==='127.0.0.1'||host==='');
    if(!('serviceWorker' in navigator) || location.protocol==='file:' || isLocal) return;
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(){
        /* 注册成功，离线可用 */
      }).catch(function(e){ /* 旧版 Safari 不支持或协议不符，静默忽略 */ });
    });
  }catch(e){}
})();

  var instr=document.getElementById('aiInstr').value.trim();
  var tpl=AI_TPLS[aiState.mode]||'';
  var userText='【任务】'+(tpl||'请扩写润色下面的内容。')+'\n【补充要求】'+(instr||'（无）')+'\n【原始内容】\n'+(src||'（空，请根据上下文给建议）');
  var sys='你是资深言语语言治疗师（SLP）的临床文书助理。把治疗师提供的简短中文临床笔记，扩写、润色为专业、结构化、符合临床规范的治疗记录。规则：1) 严格基于提供的信息，不编造未提及的事实或数据；2) 语言专业但不晦涩，适合写入病历/档案；3) 涉及具体儿童时用[儿童]代指，保护隐私；4) 信息不足时标注「（待补充）」而非杜撰；5) 默认输出中文（除非要求英文）。';
  var msgs=[{role:'system',content:sys}];
  var ctx=aiBuildCtx(aiState.kidId); if(ctx) msgs.push({role:'system',content:ctx});
  for(var i=0;i<aiState.history.length;i++){ msgs.push(aiState.history[i]); }
  var sendText=userText;
  if(aiGetDesen() && aiState.kidId){ var k=kidById(aiState.kidId); if(k&&k.name){ sendText=userText.split(k.name).join('[儿童]'); } }
  msgs.push({role:'user',content:sendText});
  aiState.busy=true; setAISend(true);
  aiRawCall(msgs, function(ok,txt){
    aiState.busy=false; setAISend(false);
    if(!ok){ appendAIChat('a','⚠️ '+txt); return; }
    aiState.history.push({role:'user',content:sendText});
    aiState.history.push({role:'assistant',content:txt});
    appendAIChat('a', txt);
    document.getElementById('aiDraftWrap').style.display='block';
    document.getElementById('aiDraft').value=txt;
  });
}
function aiRawCall(messages, cb){
  var key=aiGetKey(); var model=aiGetModel(); var provider=aiGetProv();
  if(!key){ cb(false,'请先在设置里填写当前服务商的 API Key'); return; }
  var body=JSON.stringify({provider:provider, apiKey:key, model:model, messages:messages});
  fetch('/api/ai', {method:'POST', headers:{'Content-Type':'application/json'}, body:body})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, data:j}; }); })
    .then(function(res){
      if(!res.ok){ cb(false, (res.data&&res.data.error)||('HTTP '+res.status)); return; }
      var c=res.data&&res.data.content; if(!c){ cb(false,'返回内容为空'); return; }
      cb(true, c);
    })
    .catch(function(e){ cb(false, '网络错误：'+((e&&e.message)?e.message:e)); });
}
function appendAIChat(role, text){
  var box=document.getElementById('aiChat'); if(!box) return;
  var div=document.createElement('div'); div.className='ai-msg '+(role==='u'?'u':'a');
  div.textContent=(role==='u'?'你：':'AI：')+text;
  box.appendChild(div); box.scrollTop=box.scrollHeight;
}
function setAISend(b){ var b1=document.getElementById('aiSendBtn'); if(!b1) return; b1.disabled=b; b1.textContent=b?'生成中…':'生成 / 继续讨论'; }
function aiAdopt(keep){
  if(!aiState.taEl) return;
  aiState.taEl.value=document.getElementById('aiDraft').value;
  if(aiState.taEl.dispatchEvent){ try{ aiState.taEl.dispatchEvent(new Event('input')); }catch(e){} }
  if(!keep){ closeAIMo(); }
  toast(keep?'已写入，可继续讨论':'已采纳并写入'+aiState.kind, 'ok');
}
function aiAdoptKeep(){ aiAdopt(true); }
function aiDiscard(){ document.getElementById('aiDraftWrap').style.display='none'; document.getElementById('aiDraft').value=''; }

</script>
<div id="aiMo" class="ov">
  <div class="mo wide">
    <div class="mo-h"><h3 id="aiTitle">✨ AI 润色</h3>
      <button class="mo-x" type="button" onclick="closeAIMo()"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="mo-b">
      <div class="ai-set" id="aiSetBox"></div>
      <div class="ai-ctx" id="aiCtx"></div>
      <div class="ai-tpl" id="aiTpl"></div>
      <label class="ai-lab">你的要求（可空，默认按所选模板扩写润色）</label>
      <textarea id="aiInstr" class="inp" rows="2" placeholder="例如：再加一点情绪行为观察，语气温柔专业"></textarea>
      <div class="ai-chat" id="aiChat"></div>
      <div class="ai-draft" id="aiDraftWrap" style="display:none">
        <div class="ai-draft-h">AI 草稿 · 待审核（请核对事实后再采纳，AI 不会自动写入）</div>
        <textarea id="aiDraft" class="inp" rows="6"></textarea>
        <div class="ai-actions">
          <button class="btn pri" type="button" onclick="aiAdopt(false)">采纳并写入</button>
          <button class="btn" type="button" onclick="aiAdopt(true)">采纳并继续讨论</button>
          <button class="btn ghost" type="button" onclick="aiDiscard()">放弃</button>
        </div>
      </div>
    </div>
    <div class="mo-f">
      <button class="btn" type="button" onclick="closeAIMo()">关闭</button>
      <button class="btn pri" type="button" id="aiSendBtn" onclick="aiSend()">生成 / 继续讨论</button>
    </div>
  </div>
</div>
</body>
</html>
